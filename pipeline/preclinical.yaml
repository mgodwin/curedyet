# A stage of the cure pipeline. Field guide: METHODOLOGY.md.
id: preclinical
order: 4
name: Lab testing
kind: stage
question: Can lab models replace animal studies and predict human results?
cleared_when: Cleared when organoids, organ-on-chips and other human-cell lab models are accepted by FDA/EMA
  in place of most animal studies and measurably cut late-stage failures. (Computational prediction belongs
  to the simulation gate.)
status: easing
odds_much_faster:
  by_2030: 20
  by_2035: 50
ai_linked: false
status_note: 'Policy has moved fast. FDA says it met its first-year milestones on the animal-testing roadmap
  (Apr 2026), issued draft NAM validation guidance (Mar 2026) and a direct final rule recasting ''animal
  studies'' as ''nonclinical studies'' (Sep 2026), and cleared an oncology IND on human vascularized organoid
  efficacy data (Qureator, Oct 2025). Formal acceptance still lags: FDA had qualified no organ-chip drug
  development tool as of Jan 2026, and Emulate only submitted the first full Liver-Chip qualification
  package in Sep 2026. FDA Modernization Act 3.0 passed the Senate in Dec 2025 but has had no House vote,
  and no data yet show lower late-stage failure rates.'
time_today:
  low: 1
  high: 3
  label: 1–3 yrs
  note: The HHS ASPE cost model uses an average of 31.2 months of nonclinical work from compound synthesis
    to first human dosing, including IND clearance.
time_best_case:
  low: 0.2
  high: 1
  label: 2–12 mo
  note: Moderna dosed its first COVID vaccine trial participant 63 days after sequence selection by running
    safety work in parallel, and FDA's April 2025 roadmap starts replacing animal tests for antibodies
    with AI toxicity models and organoids.
