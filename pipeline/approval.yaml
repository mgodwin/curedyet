# A stage of the cure pipeline. Field guide: METHODOLOGY.md.
id: approval
order: 6
name: Approval
kind: stage
question: Will regulators approve fast, and on biomarkers for slow diseases?
cleared_when: Regulators routinely approve on validated biomarkers or surrogate endpoints for slow diseases
  (aging, neurodegeneration, prevention) and review major new therapies in about 6 months or less, including
  AI-assisted review.
status: easing
odds_much_faster:
  by_2030: 15
  by_2035: 32
ai_linked: false
status_note: 'Fast review now works in a narrow lane. The National Priority Voucher pilot (about 18 vouchers)
  delivered approvals in 44-55 days for the cases with reported times, and CDER approved 26 novel drugs
  in H1 2026, up from 19 in H1 2025. FDA also issued the plausible-mechanism draft guidance for ultra-rare
  therapies, and Elsa 4.0 is in agency-wide use, though FDA hasn''t reported any measured effect on review
  time. Against that: standard review is still about 10 months, there is no surrogate pathway for aging
  or neurodegeneration, and leadership is unstable (Makary resigned May 2026, Prasad left CBER in April).
  This depends on policy more than AI.'
time_today:
  low: 0.7
  high: 1.3
  label: 8–16 mo
  note: FDA aims to act within 6 months (priority) or 10 months (standard) after a 60-day filing period,
    and the median novel approval in 2024 took 11.7 months from submission.
time_best_case:
  low: 0.1
  high: 0.3
  label: 3 wks–4 mo
  note: Under the Commissioner's National Priority Voucher pilot, Hernexeos was approved 44 days after
    filing in 2026 and seven voucher approvals averaged about 95 days from voucher to decision, while
    the Pfizer COVID vaccine got emergency authorization 21 days after its request.
