# A stage of the cure pipeline. Field guide: METHODOLOGY.md.
id: design
order: 2
name: Design
kind: stage
question: Can AI design a drug that works, much faster and with better odds than before?
cleared_when: AI-designed molecules (small molecules, antibodies, proteins, gene editors) routinely reach
  the clinic well under the old ~4-6 years from target to first-in-human, AND show clearly better Phase
  1/2 success than historical rates.
status: easing
odds_much_faster:
  by_2030: 40
  by_2035: 62
ai_linked: true
status_note: 'Speed is largely shown: about 117 AI-enabled assets had entered trials by Dec 2025, Insilico
  reports 9-18 months to a candidate, and Chai-2 hits about 20% of antibody targets zero-shot. Phase 1
  success looks high (BCG: 80-90%), but Phase 2 success (about 40%) matches historical rates. No AI-discovered
  drug is fully approved, Isomorphic slipped its first trial to late 2026, and positive mid-stage readouts
  remain few (e.g. Recursion REC-4881 with a 47% median polyp reduction). Calibration: P(open | TAI) about
  70%, P(open | jagged) about 30%, P(open | plateau) about 10%, which gives about 40%.'
time_today:
  low: 2.5
  high: 4
  label: 2.5–4 yrs
  note: Conventional hit-to-lead and lead optimization takes about 2.5 to 4 years and 3,000 to 5,000 synthesized
    molecules per program to reach a preclinical candidate.
time_best_case:
  low: 0.1
  high: 1.5
  label: 1–18 mo
  note: Insilico reports 22 AI-designed candidates from 2021 to 2024 took 12 to 18 months each (about
    60 to 200 molecules), rentosertib took about 18 months from target to candidate, and Moderna had a
    clinical batch of its COVID vaccine 25 days after sequence selection.
