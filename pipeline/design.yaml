  name: AI-enabled assets that have entered interventional trials
  url: https://intuitionlabs.ai/articles/ai-discovered-drugs-clinical-trials-2026
  value: 117 (60 completed Phase 1, 8 completed Phase 2)
- asOf: 2026-10
  name: Phase 2 success, AI-discovered vs historical
  url: https://intuitionlabs.ai/articles/ai-discovered-drugs-clinical-trials-2026
  value: 'about 40%, no better than historical (Phase 1: 80-90%)'
- asOf: 2026-10
  name: FDA-approved AI-discovered drugs
  url: https://www.bio-itworld.com/news/2026/07/08/insilico-medicine-launches-phase-iii-trial-for-ai-developed-drug
  value: 0; furthest along is rentosertib in Phase 3 (NDA projected 2030)
- asOf: 2026-04
  name: Isomorphic Labs first-in-human
  url: https://www.chemdiv.com/company/media/pharma-news/2026/isomorphic-labs-launches-human-trials-for-ai-designed-cancer-drugs/
  value: not yet dosed; guided to late 2026, oncology first
watch: A peer-reviewed cohort study showing AI-designed drugs beat historical Phase 2 success, or Isomorphic/Chai
  de novo molecules entering and clearing Phase 1-2.
