# A stage of the cure pipeline. Field guide: METHODOLOGY.md.
id: simulation
order: 3
name: Simulation
kind: booster
question: Can computers predict what a drug will do in the body well enough to skip experiments?
cleared_when: Cleared when computational models (virtual cell / bio foundation models, physics and AI
  models of drug-target binding and toxicity, digital twins, in-silico trials) routinely replace a meaningful
  share of wet-lab or patient experiments and are accepted by regulators as evidence, e.g. digital-twin
  control arms shrinking trials and in-silico evidence in submissions.
status: easing
odds_much_faster:
  by_2030: 29
  by_2035: 55
ai_linked: true
status_note: 'Narrow mechanistic models are already accepted: FDA took Certara Simcyp PBPK simulations
  in place of at least ten clinical pharmacology studies for asciminib (Mar 2026), EMA has qualified Unlearn''s
  digital-twin PROCOVA method, and in Jun 2026 FDA accepted its first in-silico tool (an AI digital liver
  model for DILI) into ISTAND, though only at the letter-of-intent stage. The AI-heavy frontier lags:
  Arc''s 2025 Virtual Cell Challenge models did not consistently beat naive baselines, Boltz-2 affinity
  correlation hit about 0.66 on an FEP+ subset but did poorly on 5 of 8 blinded Recursion assays, and
  FDA''s Jan 2025 AI-credibility guidance was still a draft as of Apr 2026 (FDA and EMA did publish joint
  good-AI-practice principles in Jan 2026). pOpen2030 = 0.55 x 0.30 (transformative) + 0.20 x 0.60 (jagged)
  + 0.05 x 0.10 (plateau) = 0.29.'
shortens:
- preclinical
- trials
effect_note: Model-informed drug development saved one large sponsor about 10 months of cycle time and
  roughly $5 million per program on average (2021-2023) by replacing or shrinking studies, and EMA-qualified
  digital-twin controls cut outcome variance (18% in one ALS analysis, about 92 fewer patients) so pivotal
  trials can enroll fewer people. FDA's 2025 plan to accept AI toxicity models and organoids in place
  of some animal studies targets the preclinical stage, though no time savings have been quantified yet.
