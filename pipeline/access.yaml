# A stage of the cure pipeline. Field guide: METHODOLOGY.md.
id: access
order: 7
name: Access
kind: stage
question: Can most eligible patients actually get a curative therapy?
cleared_when: 'Curative but complex therapies (gene and cell therapies, antibodies) are made and delivered
  at a cost and scale where most eligible patients in rich countries get them: gene therapy well under
  ~$500k and broadly reimbursed, with non-viral or in-vivo delivery replacing chemo conditioning.'
status: blocking
odds_much_faster:
  by_2030: 8
  by_2035: 28
ai_linked: false
status_note: 'The gate is still closed today, though cracks are visible. US gene therapy list prices run
  $2.5M-$4.25M, and Casgevy infused only 64 patients in 2025 against about 100,000 Americans with sickle
  cell, with busulfan conditioning a major barrier. CMS''s outcomes-based Cell and Gene Therapy Access
  Model now covers 34 state-level Medicaid programs. The way out is in-vivo delivery, which is showing
  early human data: Kelonia''s in-vivo CAR-T produced responses in 18/18 myeloma patients with no lymphodepletion,
  and a single dose of Lilly''s VERVE-102 base editor cut LDL by up to 62%. Prices and the manufacturing
  shift are driven by money and policy more than AI, and 2030 is close given approval lag.'
time_today:
  low: 3
  high: 10
  label: 3–10+ yrs
  note: 'Even curative drugs spread slowly: CDC found only about 1 in 3 diagnosed hepatitis C patients
    were cured nearly a decade after the new antivirals launched, Casgevy infused just 64 patients in
    2025 against about 100,000 Americans with sickle cell, and new EU medicines take a median 532 days
    to reach patients.'
time_best_case:
  low: 0.5
  high: 2
  label: 6 mo–2 yrs
  note: COVID vaccines went from first authorization in December 2020 to 70% of EU adults fully vaccinated
    by August 31, 2021, about 9 months, and Germany makes new EU medicines available in a median 56 days.
