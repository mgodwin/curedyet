<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Is it cured yet? Where major diseases stand on the road to a cure, with sourced forecasts updated weekly.">
<title>Cure Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: wide pages; disease pages are a main column plus a side rail. Hash routes: home, d-<id> (disease or hub), d-<id>/<variant>, pipeline, record, stats. */
:root{
  --tough:#806800; --tough-soft:#f3ecc8;
  --v-mild:#1e7f4f; --v-mod:#806800; --v-modf:#e0b000; --v-hard:#a85400; --v-no:#4e5862; --v-nof:#8a9690;
  --ground:#f4f6f3; --card:#ffffff; --sunk:#f4f6f3; --ink:#121815; --muted:#4e5862; --rule:#e1e6e2; --soft:#c9d2cb;
  --yes:#1e7f4f; --yes-soft:#e3ece6; --some:#a85400; --some-soft:#f6e7d7; --no:#4e5862;
  --heavy:#9c2f1f; --heavy-soft:#f8e1da; --mod:#8a5a00; --mod-soft:#f6ecd6; --light-c:#1e6b46; --light-soft:#e3ece6;
  --easing:#c98a1c; --blocking:#c2412d; --cleared:#1e7f4f;
  --dark:#121815; --on-dark:#f4f6f3; --on-dark-muted:#c3cdc6; --on-dark-accent:#9ee2b8;
  --st1:#8aa197; --st2:#6d8a7e; --st3:#536f63; --st4:#121815; --st5:#2f463c; --st6:#a85400;
  --f-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --tough:#e3cb55; --tough-soft:#332c0c;
  --v-mild:#5fd39a; --v-mod:#e3cb55; --v-modf:#d9b635; --v-hard:#f0a254; --v-no:#a3aea7; --v-nof:#66746d;
  --ground:#0f1412; --card:#18201c; --sunk:#111815; --ink:#e9eee9; --muted:#a3aea7; --rule:#27312c; --soft:#3a4640;
  --yes:#5fd39a; --yes-soft:#173327; --some:#f0a254; --some-soft:#3a2914; --no:#a3aea7;
  --heavy:#f29a87; --heavy-soft:#3b1d17; --mod:#e8c06a; --mod-soft:#33290f; --light-c:#7fd8a8; --light-soft:#173327;
  --easing:#e0a63a; --blocking:#f07a62; --cleared:#5fd39a;
  --dark:#e9eee9; --on-dark:#0f1412; --on-dark-muted:#3a4640; --on-dark-accent:#1e6b46;
  --st1:#7f978c; --st2:#9ab4a8; --st3:#b7cec3; --st4:#e9eee9; --st5:#5f7a6e; --st6:#f0a254; color-scheme:dark;}}
:root[data-theme="dark"]{
  --tough:#e3cb55; --tough-soft:#332c0c;
  --v-mild:#5fd39a; --v-mod:#e3cb55; --v-modf:#d9b635; --v-hard:#f0a254; --v-no:#a3aea7; --v-nof:#66746d;
  --ground:#0f1412; --card:#18201c; --sunk:#111815; --ink:#e9eee9; --muted:#a3aea7; --rule:#27312c; --soft:#3a4640;
  --yes:#5fd39a; --yes-soft:#173327; --some:#f0a254; --some-soft:#3a2914; --no:#a3aea7;
  --heavy:#f29a87; --heavy-soft:#3b1d17; --mod:#e8c06a; --mod-soft:#33290f; --light-c:#7fd8a8; --light-soft:#173327;
  --easing:#e0a63a; --blocking:#f07a62; --cleared:#5fd39a;
  --dark:#e9eee9; --on-dark:#0f1412; --on-dark-muted:#3a4640; --on-dark-accent:#1e6b46;
  --st1:#7f978c; --st2:#9ab4a8; --st3:#b7cec3; --st4:#e9eee9; --st5:#5f7a6e; --st6:#f0a254; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
a{color:var(--light-c)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--some);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance}
.display{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--card);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.back{font-size:14px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;min-height:44px}

/* Home */
.hero h1{font-size:clamp(40px,10vw,56px);line-height:1}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;height:48px;border:1.5px solid var(--ink);border-radius:12px;padding:0 14px;font:inherit;background:var(--card);color:var(--ink)}
.counts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:560px){.counts{grid-template-columns:repeat(4,minmax(0,1fr))}}
.count{background:var(--card);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.count[aria-pressed="true"]{outline:2px solid var(--ink)}
.count b{font-family:var(--f-display);font-size:30px;line-height:1.1}
.count span{font-size:12px;font-weight:600}
.key{margin:0;font-size:13px;color:var(--muted);border-left:3px solid var(--soft);padding-left:10px}
.key b{color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:600 13px var(--f-body);min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--soft);background:var(--card);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
select{font:600 13px var(--f-body);min-height:36px;border:1px solid var(--soft);border-radius:10px;background:var(--card);color:var(--ink);padding:0 8px}
.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:720px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1100px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
.dcard{text-decoration:none;color:inherit;background:var(--card);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0;border:1px solid transparent}
.dcard:hover{border-color:var(--soft)}
.dcard h2{font-size:17px;font-weight:600}
.verdict{font-family:var(--f-display);font-weight:700;font-size:36px;line-height:1}
.v-mild{color:var(--v-mild)} .v-mod{color:var(--v-mod)} .v-hard{color:var(--v-hard)} .v-no{color:var(--v-no)}
.vlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.vlist li{border-top:1px solid var(--rule);font-size:14px}
.vlist li a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0;min-height:36px;color:inherit;text-decoration:none}
.vlist li a:hover .vname{text-decoration:underline}
.dcard-title{color:inherit;text-decoration:none}.dcard-title:hover{text-decoration:underline}
a.more{text-decoration:none}
.vlist .vname{min-width:0}
.vstat{flex:none;font-size:13px;font-weight:600;text-align:right;display:inline-flex;align-items:center;gap:6px}
.vstat i{display:inline-block;width:8px;height:8px;border-radius:50%}
.stage-tag{font-size:13px;font-weight:600;color:var(--ink);background:var(--sunk);border-radius:6px;padding:4px 8px;width:fit-content}
.groups{display:flex;flex-direction:column;border-top:1px solid var(--rule);margin-top:4px}
.grow{display:flex;flex-direction:column;gap:6px;padding:12px 0 4px;border-bottom:1px solid var(--rule)}
.grow:last-child{border-bottom:0;padding-bottom:0}
.grow-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.grow-top b{font-size:15px}
.grow-v{font-size:13px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;background:var(--sunk);border-radius:10px;padding:10px 12px}
.stats span{display:block;font-size:11px;color:var(--muted)}
.stats b{font-family:var(--f-display);font-size:24px}
.meta-row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--muted)}
.tb{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:2px 6px}
.tb.light{background:var(--light-soft);color:var(--light-c)} .tb.moderate{background:var(--mod-soft);color:var(--mod)} .tb.heavy{background:var(--heavy-soft);color:var(--heavy)}
.more{font-size:13px;font-weight:600;color:var(--light-c)}
.dark-card{text-decoration:none;background:var(--dark);color:var(--on-dark);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px}
.dark-card .eyebrow{color:var(--on-dark-muted)}
.dark-card .go{color:var(--on-dark-accent);font-weight:600;font-size:14px}
.week{background:var(--card);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit}
.empty{padding:24px;text-align:center;color:var(--muted);background:var(--card);border-radius:16px}

/* Detail */
.ladder-strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px}
.ladder-strip i{height:10px;border-radius:3px;background:var(--rule)}
.ladder-labels{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;font-size:10px;line-height:1.2;color:var(--muted)}
.range{position:relative;height:18px}
.range .base{position:absolute;left:0;right:0;top:8px;height:2px;background:var(--rule)}
.range .band{position:absolute;top:5px;height:8px;border-radius:4px;background:var(--some-soft)}
.range .dot{position:absolute;top:1px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--some)}
.range .dot{box-shadow:0 0 0 2px var(--card)}
.range .mk{position:absolute;top:3px;width:12px;height:12px;margin-left:-6px;border-radius:50%}
.range .mk.bound{background:var(--card);border:2px solid var(--some)}
.range .mk.now{background:var(--yes);box-shadow:0 0 0 2px var(--card)}
.rlabels{position:relative;height:30px;font-size:12px;line-height:1.25;color:var(--muted)}
.rlabels.top{height:16px}
.rlabels span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.rlabels b{display:block;color:var(--ink);font-weight:600}
.method{border-top:1px solid var(--rule);margin-top:4px}
.gacc{border-top:1px solid var(--rule)}
.gacc summary{cursor:pointer;font-weight:600;font-size:13px;min-height:40px;display:flex;align-items:center;gap:8px;color:var(--light-c)}
.gacc summary,.method summary{list-style:none}
.gacc summary::-webkit-details-marker,.method summary::-webkit-details-marker{display:none}
.gacc summary::before,.method summary::before{content:"";flex:none;width:6px;height:6px;margin:0 4px 0 2px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
.gacc[open]>summary::before,.method[open]>summary::before{transform:rotate(45deg)}
.grow-name{font-size:15px}
.prog{font-size:13px;color:var(--muted)}
.prog b{color:var(--ink);font-weight:600}
.gacc-body{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.gacc .big-year{font-size:32px}
.method summary{cursor:pointer;font-weight:600;font-size:14px;min-height:44px;display:flex;align-items:center;gap:8px;color:var(--light-c)}
.method-body{display:flex;flex-direction:column;gap:10px;padding-bottom:4px}
.trend-wrap{position:relative}
.trend{display:block;width:100%;outline-offset:2px}
.trend:focus-visible{outline:2px solid var(--some);border-radius:6px}
.ttip{position:absolute;top:0;pointer-events:none;background:var(--card);border:1px solid var(--soft);border-radius:8px;padding:6px 8px;font-size:12px;line-height:1.35;max-width:220px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.ttip b{display:block;font-size:14px}
.events{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.events li{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px}
.events li>span:first-child{white-space:nowrap}
.tkey{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.tkey i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:6px;border-radius:1px}
.ttable{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.ttable th,.ttable td{text-align:left;padding:4px 6px;border-top:1px solid var(--rule)}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.big-year{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1}
.grid-tracks{display:grid;grid-template-columns:minmax(0,1fr) 52px 52px 60px;gap:6px 8px;font-size:13px;align-items:baseline}
.grid-tracks .h{font-size:11px;color:var(--muted)}
.burden-box{display:flex;gap:10px;align-items:flex-start;background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:13px}
.burden-box .tb{flex:none}
.pl{display:flex;gap:10px;font-size:14px}
.stage{flex:none;font-size:11px;font-weight:600;background:var(--yes-soft);color:var(--light-c);border-radius:4px;padding:2px 6px;height:fit-content;white-space:nowrap}
.card ul,.card ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.delta{font-size:12px;font-weight:600;margin-left:4px}
.delta.up{color:var(--yes)} .delta.down{color:var(--heavy)}

/* Pipeline */
.totals .row{display:flex;justify-content:space-between;align-items:baseline}
.bar{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.flow{display:flex;flex-direction:column}
.node{display:flex;align-items:center;gap:12px}
.node .ring{width:14px;height:14px;margin-left:5px;border-radius:50%;border:2px solid var(--muted);flex:none}
.node .fill{width:18px;height:18px;margin-left:3px;border-radius:50%;background:var(--yes);flex:none}
.step{border-left:2px solid var(--soft);margin-left:11px;padding:4px 0 18px 20px;display:flex;flex-direction:column;gap:6px;position:relative}
.step .mark{position:absolute;left:-8px;top:7px;width:14px;height:14px;border-radius:4px}
.step .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.step .top b{font-size:16px}
.st-easing{color:var(--mod);font-size:12px;font-weight:700} .st-blocking{color:var(--heavy);font-size:12px;font-weight:700} .st-cleared{color:var(--yes);font-size:12px;font-weight:700}
.times{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;background:var(--card);border-radius:10px;padding:10px 12px;font-size:13px}
.times small{display:block;font-size:11px;color:var(--muted);line-height:1.35;margin-top:2px}
.times .fast{color:var(--yes)}
.booster{border:1.5px dashed var(--soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--card)}
.step details,.booster details{font-size:13px}
.step summary{cursor:pointer;color:var(--light-c);font-weight:600;min-height:32px;display:flex;align-items:center}
.step details ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.odds{font-size:12px;color:var(--muted)}

/* Record */
.check{display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--rule);font-size:14px}
.check:first-child{border-top:0}
.prob{font-family:var(--f-display);font-weight:700;font-size:22px;text-align:right}
.res{font-size:11px;font-weight:700;text-transform:uppercase;padding:1px 6px;border-radius:4px}
.res.void{background:var(--sunk);color:var(--muted)} .res.yes{background:var(--yes-soft);color:var(--yes)} .res.no{background:var(--heavy-soft);color:var(--heavy)}
.cal{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.cal li{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--rule);font-size:14px}
.cal li:first-child{border-top:0}
.changes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}


/* Home: nav, cards in masonry columns, colour key */
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.topnav{display:flex;justify-content:space-between;align-items:center;gap:8px 20px;flex-wrap:wrap;min-height:44px}
.brand{font-size:clamp(24px,3vw,30px);line-height:1.1;color:var(--ink);text-decoration:none}
.themebtn{font:600 13px var(--f-body);min-height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--soft);background:var(--card);color:var(--ink);cursor:pointer}
.navlinks{display:flex;gap:4px 18px;flex-wrap:wrap;align-items:center;font-size:14px;font-weight:600}
.navlinks a{color:var(--ink);text-decoration:none;min-height:32px;display:inline-flex;align-items:center}.navlinks a:hover{text-decoration:underline}
.hero{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.hero .search{width:100%}.hero .search input{height:56px;font-size:17px}
.navlinks a.updchip{font-size:13px;min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--light-c);color:var(--light-c);text-decoration:none}.navlinks a.updchip:hover{background:var(--light-soft);text-decoration:none}
.controls{gap:8px 12px}.controls label{display:flex;gap:8px;align-items:center;font-size:13px}.controls select{min-height:40px;padding:0 10px}
.controls select#cat{font-weight:600;max-width:min(240px,46vw)}
.vkey{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted)}
.vkey span{display:inline-flex;gap:6px;align-items:center}.vkey i{width:10px;height:10px;border-radius:50%;flex:none}
.masonry{display:flex;gap:12px;align-items:flex-start}
.mcol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:12px}
.vlist.two li a,.vhead{display:grid;grid-template-columns:minmax(0,1fr) 108px 72px;gap:10px;align-items:center}
.vhead{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-top:4px}.vhead span{text-align:right}
.pline{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;font-weight:600;border-top:1px solid var(--rule);padding-top:8px}
.pline>span:last-child{text-align:right;display:flex;flex-direction:column;line-height:1.25}.pline small{font-size:11px;font-weight:400;color:var(--muted)}
.dwhy{margin:0;font-size:15px;line-height:1.45;text-wrap:pretty}
.cstat{flex:none;text-align:right;font-size:13px;font-weight:600;display:flex;flex-direction:column;line-height:1.25}
.cstat small{font-size:11px;font-weight:400;color:var(--muted)}
.sbar{display:flex;gap:2px;height:18px;border-radius:5px;overflow:hidden}
.srows{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:8px}
.srows div{display:flex;gap:10px;align-items:baseline;background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:14px}
.srows i{width:10px;height:10px;border-radius:50%;flex:none;align-self:center}.srows b{font-family:var(--f-display);font-size:26px;line-height:1}
/* Long text stays readable on wide screens */
.card p,.key{max-width:80ch}
/* Disease pages */
.dlayout{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.dmain{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:20px}
.drail{flex:1 1 280px;max-width:380px;display:flex;flex-direction:column;gap:12px}
.dmain>.card,.drail>.card{padding:20px;gap:12px}
.ch{margin:0;font-family:var(--f-display);font-size:18px}
.dtitle{margin:0;font-size:clamp(40px,5vw,56px);line-height:1.02}
.lede{margin:0;font-size:17px;max-width:72ch;text-wrap:pretty}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:8px;font-size:14px}
.chips span{background:var(--sunk);border-radius:10px;padding:10px 12px}
.why{background:var(--heavy-soft);border-radius:12px;padding:12px 14px;font-size:13px}.why.light{background:var(--light-soft)}.why.moderate{background:var(--mod-soft)}
.cat{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--rule);font-size:14px}
.cat-top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.cat-when{font-size:12px;margin-left:auto}
.eff{flex:none;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:4px;padding:2px 6px;background:var(--sunk);color:var(--muted)}
.eff.big{background:var(--yes-soft);color:var(--light-c)}.eff.some{background:var(--tough-soft);color:var(--tough)}
.log{display:flex;flex-direction:column}
.log-row{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:10px 0;border-top:1px solid var(--rule);font-size:14px}
.srcs ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.srcs h2{margin:0 0 8px}
.dfoot{border-top:1px solid var(--soft);padding-top:20px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 32px;align-items:baseline;font-size:14px}
.pill-link{font-weight:600;text-decoration:none;border:1px solid var(--ink);color:var(--ink);border-radius:999px;padding:10px 16px;min-height:44px;box-sizing:border-box;display:inline-flex;align-items:center}
.vlist-nav{background:var(--card);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.vrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) 24px;gap:12px 20px;align-items:center;padding:18px 20px;text-decoration:none;color:var(--ink);border-top:1px solid var(--rule)}
.vrow:first-child{border-top:0}.vrow:hover{background:var(--sunk)}
.vgo{font-size:18px;color:var(--light-c)}.ok{color:var(--light-c)}
@media (max-width:640px){.vrow{grid-template-columns:minmax(0,1fr) auto}.vhide{display:none}}
@media (max-width:640px){.ladder-labels span:not([style*="font-weight"]){visibility:hidden}}
.crumb{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.crumb-path{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600;min-height:44px}
.crumb-path a{text-decoration:none}.crumb-path span{color:var(--muted)}
.sibs{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sib{font-size:13px;font-weight:600;text-decoration:none;border:1px solid var(--soft);border-radius:999px;padding:6px 12px;background:var(--card);color:var(--ink);min-height:32px;display:inline-flex;align-items:center}
.sib.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.tip{position:relative;display:inline-flex}
.tip>button{font:inherit;cursor:help;border:0;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:2px 6px}
.tip .pop{display:none;position:absolute;top:calc(100% + 8px);left:0;z-index:5;width:300px;max-width:80vw;flex-direction:column;gap:6px;background:var(--dark);color:var(--on-dark);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.45;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.tip:hover .pop,.tip:focus-within .pop{display:flex}
.placeholder{height:120px;border-radius:12px;background:var(--sunk);display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
<script>try{var t=localStorage.getItem("cw-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>


<div class="wrap" id="app">
  <div class="empty">Loading the tracker…</div>
</div>

<script>
(function(){
const LEVELS=["No treatment","Slows it","Controlled","Cured for some","Cured for most","Cured for all"];
const S={meta:null,cats:[],dz:[],checks:[],cal:[],updates:[],gates:[],ready:false,err:null};
let q="", catF="all", sort="closest";
try{sort=localStorage.getItem("cw2-sort")||sort}catch(e){}
if(!["closest","az","cat"].includes(sort))sort="closest";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>/^https?:\/\//i.test(u||"")?u:null;
const link=(u,t)=>safe(u)?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`:esc(t);
const MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fd=d=>{const m=String(d||"").match(/^(\d{4})(?:-(\d{2}))?(?:-(\d{2}))?/);if(!m)return esc(d);if(!m[2])return m[1];return m[3]?`${MO[+m[2]-1]} ${+m[3]}, ${m[1]}`:`${MO[+m[2]-1]} ${m[1]}`};
const yr=y=>y==null?"—":(y>=2100?"2100+":"~"+y);
const lv=d=>Math.max(0,Math.min(LEVELS.length-1,d.level|0));
/* Status as a word: the bottom rung reads "No treatment yet", since research is moving; ladder labels keep the short name. */
const lword=L=>L===0?"No treatment yet":LEVELS[L];
/* Colour = rung plus treatment burden. Cured for most or all: green with mild treatment, yellow moderate, orange difficult.
   Cured for some is orange whatever the treatment; below that, grey. */
const toV=(level,burden)=>level>=4?(burden==="light"?"mild":burden==="moderate"?"mod":"hard"):level===3?"hard":"no";
const VCOL={mild:"--v-mild",mod:"--v-mod",hard:"--v-hard",no:"--v-no"};
const VFILL={mild:"--v-mild",mod:"--v-modf",hard:"--v-hard",no:"--v-nof"};
/* Burden keys stay light/moderate/heavy in the data; readers see mild/moderate/difficult. */
const BURDEN_WORD={light:"mild",moderate:"moderate",heavy:"difficult"};
const bword=b=>BURDEN_WORD[b]||b;
/* On a cured-for-most rung, how far the segment fills shows how hard the treatment is. */
const BFRAC={light:100,moderate:66,heavy:33};
/* d.groups: stages or subtypes, each on its own ladder rung. */
const isStages=d=>(d.groups||[]).some(g=>/^Stage /.test(g.name));
/* Patient groups: each stage or type, or the whole disease when it has none. */
const lines=d=>(d.groups||[]).length?d.groups.map(g=>({level:Math.max(0,Math.min(LEVELS.length-1,g.level|0)),burden:g.burden})):[{level:lv(d),burden:d.txBurden}];
/* Closer to the goal scores higher: the rung first, then milder treatment once most are cured. */
const score=l=>l.level*3+(l.level>=4?({light:2,moderate:1}[l.burden]||0):0);
const best=d=>Math.max(...lines(d).map(score));
const STAGING="Cancer stages run from 0 to IV. Stage 0 is abnormal cells that have not invaded. Stages I to III mean a bigger tumor or spread to nearby tissue or lymph nodes. Stage IV, also called metastatic, means it has spread to distant organs.";
function delta(cur,prev){if(prev==null||cur==null||cur===prev)return"";const d=cur-prev;return`<span class="delta ${d>0?"up":"down"}">${d>0?"▲":"▼"}${Math.abs(d)}</span>`}
function catName(id){const c=S.cats.find(c=>c.id===id);return c?c.name:""}

/* Prevention ladder (infections): how well the best vaccine or preventive drug protects those who get it.
   Colours mirror cures: strong or eliminated is green, yellow or orange by burden; partial is orange; weak or none grey. */
const PLEVELS=["No protection","Weak protection","Partial protection","Strong protection","Eliminated"];
const toPV=(level,burden)=>level>=3?(burden==="light"?"mild":burden==="moderate"?"mod":"hard"):level===2?"hard":"no";
const pvLine=pv=>{if(!pv)return"";const L=Math.max(0,Math.min(PLEVELS.length-1,pv.level|0));
  return `<span class="pline"><span class="muted">Prevention</span><span class="v-${toPV(L,pv.burden)}">${esc(PLEVELS[L])}${L>=3&&pv.burden?`<small>${esc(bword(pv.burden))}</small>`:""}</span></span>`};
/* ---------- Home: search, filters and one card per disease ---------- */
function filtered(){
  let L=S.dz.slice();
  if(q){const t=q.toLowerCase();L=L.filter(d=>[d.name,d.short,catName(d.category),...(d.groups||[]).map(g=>g.name)].some(s=>String(s||"").toLowerCase().includes(t)))}
  if(catF!=="all")L=L.filter(d=>d.category===catF);
  if(sort==="az")L.sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  else if(sort==="cat"){const ci=id=>{const c=S.cats.find(c=>c.id===id);return c?(c.order??S.cats.indexOf(c)):99};L.sort((a,b)=>ci(a.category)-ci(b.category)||String(a.name).localeCompare(String(b.name)))}
  else L.sort((a,b)=>best(b)-best(a)||String(a.name).localeCompare(String(b.name)));
  return L;
}
/* One row's status: the rung in its colour, plus how hard the treatment is once most are cured. */
const statusHTML=(level,burden)=>`<span class="cstat v-${toV(level,burden)}">${esc(lword(level))}${level>=4&&burden?`<small>${esc(bword(burden))} treatment</small>`:""}</span>`;
/* Diseases split into stages or types list each one's status instead of an overall verdict. Forecasts live on the disease pages. */
/* Infections with types show two columns per row: once infected, and prevention (the type's own, or the disease's). */
const PSHORT=["None","Weak","Partial","Strong","Eliminated"];
const pvOf=(d,g)=>g.prevention||d.prevention;
const pvStatusHTML=pv=>{const L=Math.max(0,Math.min(PLEVELS.length-1,pv.level|0));
  return `<span class="cstat pcol v-${toPV(L,pv.burden)}" title="Prevention: ${esc(PLEVELS[L])}">${esc(PSHORT[L])}${L>=3&&pv.burden?`<small>${esc(bword(pv.burden))}</small>`:""}</span>`};
function groupCardHTML(d){const two=!!d.prevention||d.groups.some(g=>g.prevention);
  return `<article class="dcard">
    <h2><a class="dcard-title" href="#d-${esc(d.id)}">${esc(d.name)}</a></h2>
    ${two?`<div class="vhead" aria-hidden="true"><span></span><span>Once infected</span><span>Prevention</span></div>`:""}
    <ul class="vlist${two?" two":""}" aria-label="${isStages(d)?"By stage":"By type"}">${d.groups.map(g=>{const gl=Math.max(0,Math.min(LEVELS.length-1,g.level|0)),pv=two?pvOf(d,g):null;
      return `<li><a href="#d-${esc(d.id)}/${esc(g.id)}"><span class="vname">${esc(g.name)}</span>${statusHTML(gl,g.burden)}${pv?pvStatusHTML(pv):two?`<span class="cstat pcol v-no">—</span>`:""}</a></li>`}).join("")}</ul>
    <a class="more" href="#d-${esc(d.id)}">See all ${isStages(d)?"stages":"types"} →</a></article>`}
function cardHTML(d){
  if((d.groups||[]).length)return groupCardHTML(d);
  const L=lv(d),since=L>=4&&d.timeline?.median?` ${L>=5?"Cured for all":"Cured for most"} since about ${d.timeline.median}.`:"";
  return `<a class="dcard" href="#d-${esc(d.id)}">
    <h2>${esc(d.name)}</h2>
    ${d.prevention?`<span class="eyebrow">Once infected</span>`:""}
    <span class="verdict v-${toV(L,d.txBurden)}">${esc(lword(L))}.</span>
    <p class="dwhy">${esc(d.levelWhy||d.short)}${since}</p>
    ${pvLine(d.prevention)}
    <span class="more">See details →</span></a>`;
}
/* Masonry: each card, in sort order, goes into the shortest column, so the order still reads left to right. */
const ncols=el=>{const w=el.clientWidth;return w>=1040?3:w>=660?2:1};
let masonCols=0;
function renderCards(){const el=$("cards");if(!el)return;const L=filtered();
  /* The count only shows once a search or category narrows the list. */
  const n=$("shown");if(n)n.textContent=L.length<S.dz.length?`${L.length} of ${S.dz.length}`:"";
  if(!L.length){masonCols=0;el.innerHTML=`<div class="empty" style="flex:1">No disease matches "${esc(q)}". Try another name.</div>`;return}
  const k=masonCols=ncols(el);
  el.innerHTML=`<div class="mcol"></div>`.repeat(k);
  const cols=[...el.children],h=cols.map(()=>0),tmp=document.createElement("div");
  L.forEach(d=>{const i=h.indexOf(Math.min(...h));tmp.innerHTML=cardHTML(d);const c=tmp.firstElementChild;cols[i].append(c);h[i]+=c.offsetHeight});
}
function navHTML(){const repo=S.meta?.repo;
  return `<nav class="topnav" aria-label="Site"><a class="brand display" href="#">Is it cured yet?</a><div class="navlinks">${S.meta?.updatedAt?`<a class="updchip" href="#record">Updated ${fd(S.meta.updatedAt).replace(/, \d{4}$/,"")} · what changed →</a>`:`<a href="#record">This week</a>`}<a href="#pipeline">Pipeline</a><a href="#stats">Stats</a>${repo?`<a href="https://github.com/${esc(repo)}/blob/main/METHODOLOGY.md" target="_blank" rel="noopener">How we rate</a>`:""}${themeBtn()}</div></nav>`}
/* Theme: follows the device unless the reader picks light or dark; the choice is remembered in this browser. */
const THEMES=["system","light","dark"],TLABEL={system:"◐ Auto",light:"☀ Light",dark:"☾ Dark"};
const curTheme=()=>document.documentElement.dataset.theme||"system";
const themeBtn=()=>`<button class="themebtn" type="button" data-theme-cycle aria-label="Colour theme: ${TLABEL[curTheme()].slice(2)}. Click to change.">${TLABEL[curTheme()]}</button>`;
function cycleTheme(){const t=THEMES[(THEMES.indexOf(curTheme())+1)%THEMES.length];
  if(t==="system")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t;
  try{t==="system"?localStorage.removeItem("cw-theme"):localStorage.setItem("cw-theme",t)}catch(e){}
  document.querySelectorAll("[data-theme-cycle]").forEach(b=>{b.textContent=TLABEL[t];b.setAttribute("aria-label",`Colour theme: ${TLABEL[t].slice(2)}. Click to change.`)})}
function home(){
  const m=S.meta||{};const cats=S.cats.slice().sort((a,b)=>(a.order||0)-(b.order||0));
  return `
  <header class="hero">
    <h1 class="sr-only">Is it cured yet? Search diseases</h1>
    <label for="q" class="sr-only">Search diseases, stages and types</label>
    <div class="search"><input id="q" type="search" autocomplete="off" placeholder="Search: Alzheimer's, HIV, stage IV…" value="${esc(q)}"></div>
    <span class="muted" style="font-size:13px;margin-top:-6px">Tracking ${S.dz.length} diseases</span>
  </header>
  <div class="filters controls">
    <label><span class="sr-only">Category</span><select id="cat"><option value="all">All categories</option>${cats.map(k=>`<option value="${esc(k.id)}"${catF===k.id?" selected":""}>${esc(k.name)}</option>`).join("")}</select></label>
    <label>Sort <select id="sort"><option value="closest">Closest to cured</option><option value="az">A to Z</option><option value="cat">By category</option></select></label>
    <span class="muted num" id="shown" style="font-size:13px;margin-left:auto"></span></div>
  <div class="masonry" id="cards"></div>
  <p class="muted" style="font-size:12px;margin:0">Updated weekly and scored against what actually happens. A research tracker, not medical advice.${m.repo?` Open data: <a href="https://github.com/${esc(m.repo)}" target="_blank" rel="noopener">add a disease or fix a fact on GitHub</a>.`:""}</p>`;
}

/* ---------- Stats: how many patient groups sit at each status ---------- */
function stats(){
  const G=S.dz.flatMap(lines),c={mild:0,mod:0,hard:0,some:0,no:0};
  G.forEach(l=>{c[l.level>=4?toV(l.level,l.burden):l.level===3?"some":"no"]++});
  const rows=[["mild","Cured for most, mild treatment","--v-mild"],["mod","Cured for most, moderate treatment","--v-modf"],["hard","Cured for most, difficult treatment","--v-hard"],["some","Cured for some","--v-hard"],["no","Not curable yet","--v-nof"]];
  const byRung=LEVELS.map((n,i)=>[n,G.filter(l=>l.level===i).length]);
  const T=pipeTotals(),m=S.meta||{};
  return `
  <header style="display:flex;flex-direction:column;gap:8px"><h1 class="display" style="font-size:clamp(36px,5vw,48px);line-height:1.05">Stats</h1>
    <p class="lede">We track ${S.dz.length} diseases. Diseases with distinct stages or types count each one, so there are ${G.length} patient groups. Each counts once.</p></header>
  <section class="card"><h2 class="ch">Where the ${G.length} patient groups stand</h2>
    <div class="sbar">${rows.map(([k,,v])=>c[k]?`<i style="flex:${c[k]};background:var(${v})${k==="some"?";opacity:.55":""}"></i>`:"").join("")}</div>
    <div class="srows">${rows.map(([k,t,v])=>`<div><i style="background:var(${v})${k==="some"?";opacity:.55":""}"></i><b class="num">${c[k]}</b><span>${t}</span></div>`).join("")}</div></section>
  <section class="card"><h2 class="ch">By rung on the cure ladder</h2>
    <div class="srows">${byRung.map(([n,k])=>`<div><b class="num">${k}</b><span>${esc(n)}</span></div>`).join("")}</div>
    <p class="muted" style="margin:0;font-size:13px">Cured for most needs at least about 85% of patients cured, cured for all about 98%. How hard the treatment is is rated on its own: mild, moderate or difficult.${m.repo?` <a href="https://github.com/${esc(m.repo)}/blob/main/METHODOLOGY.md" target="_blank" rel="noopener">How we rate →</a>`:""}</p></section>
  ${m.headline?`<a class="week" href="#record"><span class="eyebrow">This week${m.week?` · week ${esc(m.week)}`:""}</span><span style="font-weight:600">${esc(m.headline)}</span><span class="more">This week and our track record →</span></a>`:""}
  <a class="dark-card" href="#pipeline">
    <span class="eyebrow">Why do cures take so long?</span>
    <span class="display" style="font-size:28px;line-height:1.1">${T?`About ${T.today} years, from discovery to patients`:"From discovery to patients"}</span>
    <span style="font-size:14px;color:var(--on-dark-muted)">${T?`Trials alone take ${esc(T.trialsLabel||"years")}. In the best case, with AI and faster rules, it could shrink to about ${T.fast} years.`:"See the six stages every cure moves through, and how AI could shorten them."}</span>
    <span class="go">See the pipeline →</span></a>`;
}


/* ---------- Estimate timeline and history ---------- */
const NOW=new Date().getFullYear();
const hiLabel=h=>h>=2100?"after 2100":yr(h);
function lpos(p){return p<12?`left:${p}%;transform:none`:p>88?`left:${p}%;transform:translateX(-100%)`:`left:${p}%`}
const XR=y=>((Math.max(2025,Math.min(2080,y))-2025)/55)*100;
/* Forecast for one stage or type: when most patients with it could be curable. */
function groupEstHTML(f){return `<div style="display:flex;align-items:baseline;gap:10px"><span class="big-year num">${yr(f.median)}</span><span class="muted" style="font-size:13px">best guess</span></div>
  ${f.low!=null?`${rangeHTML(f,XR)}<div class="axis"><span>2025</span><span>2045</span><span>2065</span><span>2080+</span></div>`:""}
  <div class="stats"><div><span>Chance by 2035</span><b class="num">${f.p2035??"—"}%</b></div><div><span>Chance by 2045</span><b class="num">${f.p2045??"—"}%</b></div></div>
  ${f.note?`<span style="font-size:14px">${esc(f.note)}</span>`:""}`}
function rangeHTML(t,x){const lo=x(t.low),hi=x(t.high),md=x(t.median),nw=x(NOW);
  const bottom=hi-lo<26?`<span style="${lpos((lo+hi)/2)}"><b class="num">${yr(t.low)} to ${hiLabel(t.high)}</b>optimistic to pessimistic</span>`
    :`<span style="${lpos(lo)}"><b class="num">${yr(t.low)}</b>optimistic</span><span style="${lpos(hi)}"><b class="num">${hiLabel(t.high)}</b>pessimistic</span>`;
  return `<div class="rlabels top"><span style="${lpos(nw)}">Today · ${NOW}</span></div>
    <div class="range"><span class="base"></span><span class="band" style="left:${lo}%;width:${Math.max(1,hi-lo)}%"></span>
      <span class="mk now" style="left:${nw}%" title="Today"></span><span class="mk bound" style="left:${lo}%" title="Optimistic"></span><span class="mk bound" style="left:${hi}%" title="Pessimistic"></span><span class="dot" style="left:${md}%" title="Best guess"></span></div>
    <div class="rlabels">${bottom}</div>`}
const evText=e=>`${e.text}`;
/* Years from a date until a forecast year; the 2100 cap reads as "2100+". */
const decYear=t=>1970+t/(365.25*864e5);
const yrsAway=(y,date)=>Math.max(0,Math.round(Math.min(2100,y)-decYear(Date.parse(date))));
function eventsHTML(E){return E.length?`<ul class="events">${E.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(e=>`<li><span class="muted num">${fd(e.date)}</span><span>${esc(e.text)} ${safe(e.url)?link(e.url,"Source"):""}</span></li>`).join("")}</ul>`:""}
function trendHTML(d){const T=(d.trend||[]).filter(p=>p.median!=null),E=d.events||[];
  const head=`<h3 style="font-size:14px;margin-top:6px">Years until most patients are curable</h3>`;
  if(!T.length)return `${head}<p class="muted" style="margin:0;font-size:13px">Tracking started ${fd(T[0]?.date||S.meta?.updatedAt)}, ${T[0]?`about ${yrsAway(T[0].median,T[0].date)} years away`:""}. Each weekly update adds a point here, marked with the news that moved it. A line falling faster than time passes means a cure is getting closer.</p>${eventsHTML(E)}`;
  const rows=T.map(p=>`<tr><td class="num">${fd(p.date)}</td><td class="num">${yrsAway(p.median,p.date)} yrs (${yr(p.median)})</td><td class="num">${p.low!=null?`${yr(p.low)} to ${hiLabel(p.high)}`:"—"}</td></tr>`).join("");
  const first=T.length===1?`<p class="muted" style="margin:0;font-size:13px">Tracking started ${fd(T[0].date)}, about ${yrsAway(T[0].median,T[0].date)} years away. Each weekly update adds a point, marked with any news that moved it. A line falling faster than the grey one means a cure is getting closer.</p>`:"";
  return `${head}${first}<div class="trend-wrap"><div class="trend" data-id="${esc(d.id)}" tabindex="0" role="img" aria-label="Years until most patients are curable, at each weekly update. Use arrow keys to step through."></div><div class="ttip" hidden></div></div>

  return `${headerHTML(d,d.name,d.short)}
  <div class="dlayout"><main class="dmain">
    <section class="card"><span class="eyebrow">${d.prevention?"Once infected":"Where it stands"}</span><span class="display" style="font-size:30px;line-height:1">${esc(lword(L))}</span>${ladderHTML(L,d.txBurden)}${d.levelWhy?`<span style="font-size:14px">${esc(d.levelWhy)}</span>`:""}</section>
    ${preventionHTML(d.prevention)}
    <section class="card"><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><h2 class="ch" style="font-size:22px">Treatment today</h2>${burdenTip(d.txBurden,d.id)}</div>
      ${d.status?`<p style="margin:0">${esc(d.status)}</p>`:""}${(d.bestTherapies||[]).length?`<div class="chips">${d.bestTherapies.map(b=>`<span>${esc(b)}</span>`).join("")}</div>`:""}
      ${d.txBurdenNote?`<div class="why ${esc(d.txBurden||"")}"><b>Why it's rated ${esc(bword(d.txBurden))}:</b> ${esc(d.txBurdenNote)}</div>`:""}</section>
    ${forecastHTML({head:d.id==="aging"?"When could most people halt or reverse aging?":"When will most patients be curable?",level:L,burden:d.txBurden,f:t,note:d.outlook,reached:L>=4?t.median:null,reachedEasy:d.reachedEasy,easy:d.easy,trend:trendHTML(d),method:methodHTML(d)})}
    ${catalystsHTML(d.pipeline)}${logHTML(logRows)}${sourcesHTML(d.sources)}
  </main>${railHTML(d)}</div>${footerHTML()}`}

function hubPage(d){const t=d.timeline||{},G=d.groups,w=kindWord(d);
  const rows=G.map(g=>{const f=g.forecast,gl=g.level|0,pv=pvOf(d,g),pl=pv?Math.max(0,Math.min(PLEVELS.length-1,pv.level|0)):0;
    const when=gl>=4&&g.burden==="light"?`<b class="v-mild">${esc(LEVELS[gl])}</b><div class="muted" style="font-size:12px">with mild treatment</div>`:gl>=4?`<b class="v-${toV(gl,g.burden)}">${esc(LEVELS[gl])}</b><div class="muted" style="font-size:12px">next: mild treatment${g.easy?` ~${YRS(g.easy.median)} yrs`:""}</div>`:f?`<b class="display num" style="font-size:22px">~${YRS(f.median)} yrs</b><div class="muted" style="font-size:12px">until most curable · ${f.median>=2100?"after 2100":f.median}</div>`:`<span class="muted">Forecast coming</span>`;
    return `<a class="vrow" href="#d-${esc(d.id)}/${esc(g.id)}"><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><b style="font-size:17px">${esc(g.name)}</b>${g.what?`<span class="muted" style="font-size:13px">${esc(g.what)}</span>`:""}${pv?`<span class="eyebrow" style="font-size:11px;margin-top:2px">Once infected</span>`:""}${stripHTML(gl,g.burden)}<span style="font-size:13px;font-weight:600">${esc(lword(gl))}</span>
      ${pv?`<span class="eyebrow" style="font-size:11px;margin-top:6px">Prevention</span>${stripHTML(pl,pv.burden,PLEVELS,toPV,3)}<span class="v-${toPV(pl,pv.burden)}" style="font-size:13px;font-weight:600">${esc(PLEVELS[pl])}${pl>=1&&pv.burden?`<span class="muted" style="font-weight:400"> · ${esc(bword(pv.burden))}</span>`:""}</span>`:""}</div>
      <div class="vhide">${g.survival?`<span style="font-size:14px">${esc(g.survival)}</span>`:""}${g.burden?`<div style="margin-top:4px"><span class="tb ${esc(g.burden)}">${esc(bword(g.burden))} treatment</span></div>`:""}</div>
      <div class="vhide">${when}</div><span aria-hidden="true" class="vgo">→</span></a>`}).join("");
  return `${headerHTML(d,d.name,`${d.short||""} How it's treated and how likely a cure is depend on the ${w}, so each ${w} has its own page.`)}
  <div class="dlayout"><main class="dmain">
    <section style="display:flex;flex-direction:column;gap:10px"><h2 class="ch" style="font-size:24px">Choose a ${w}</h2>
      ${isStages(d)?`<span class="muted" style="font-size:13px">${STAGING}</span>`:""}
      <nav class="vlist-nav" aria-label="${w==="stage"?"Stages":"Types"}">${rows}</nav></section>
    ${preventionHTML(d.prevention,(d.groups||[]).some(g=>g.prevention)?`typical person at risk; each ${w} has its own`:"")}
    ${lv(d)>=4?`<section class="card"><span class="eyebrow">Across all ${w}s</span><span class="display" style="font-size:28px;line-height:1.1">${esc(LEVELS[lv(d)])} for the typical patient${t.median?` since ~${t.median}`:""}</span>
      <span class="muted" style="font-size:13px">Pooled across everyone diagnosed. Some ${w}s are still far from a cure; each has its own page.</span></section>`:""}
    ${lv(d)<4&&t.median!=null?`<section class="card"><span class="eyebrow">Across all ${w}s</span>
      <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><span class="display num" style="font-size:32px;line-height:1">~${YRS(t.median)} years</span><span class="muted">until most people with ${esc(d.name.toLowerCase())} are curable (best guess ${t.median>=2100?"after 2100":t.median})</span></div>
      <span class="muted" style="font-size:13px">Pooled across everyone diagnosed, whatever their ${w}. Each ${w} has its own forecast on its page.</span>
      <details class="gacc"><summary>How it's changed over time</summary><div class="gacc-body">${trendHTML(d)}${methodHTML(d)}</div></details></section>`:""}
    ${sourcesHTML(d.sources)}
  </main>${railHTML(d)}</div>${footerHTML()}`}

function variantPage(d,g){const gl=g.level|0,col=vcolor(gl,g.burden),f=g.forecast||{},w=kindWord(d);
  const crumb=`<nav class="crumb" aria-label="Breadcrumb"><div class="crumb-path"><a href="#">All diseases</a><span>/</span><a href="#d-${esc(d.id)}">${esc(d.name)}</a><span>/</span><span>${esc(g.name)}</span></div>
    <div class="sibs"><span class="muted" style="font-size:12px">Other ${w}s</span>${d.groups.map(s=>s.id===g.id?`<span class="sib on" aria-current="page">${esc(s.name.replace(/^Stage /,""))}</span>`:`<a class="sib" href="#d-${esc(d.id)}/${esc(s.id)}">${esc(s.name.replace(/^Stage /,""))}</a>`).join("")}</div></nav>`;
  const title=w==="stage"?`${g.name} ${d.name.toLowerCase()}`:g.name;
  const logRows=baseRow(d,false).concat((g.events||[]).map(e=>({date:e.date,text:e.text,url:e.url,tag:"Changed"})));
  return `${headerHTML(d,title,g.what,crumb)}
  <div class="dlayout"><main class="dmain">
    <section class="card"><span class="eyebrow">${g.prevention||d.prevention?"Once infected":"Where it stands"}</span><span class="display" style="font-size:30px;line-height:1">${esc(lword(gl))}</span>${ladderHTML(gl,g.burden)}
      ${g.survival?`<span style="font-size:14px"><b>Prognosis:</b> ${esc(g.survival)}</span>`:""}</section>
    ${preventionHTML(g.prevention||d.prevention,g.prevention?g.name:"")}
    <section class="card"><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><h2 class="ch" style="font-size:22px">Treatment today</h2>${burdenTip(g.burden,g.id)}</div>
      <p style="margin:0">${esc(g.note)}</p>${g.burden_why?`<div class="why ${esc(g.burden||"")}"><b>Why it's rated ${esc(bword(g.burden))}:</b> ${esc(g.burden_why)}</div>`:""}${g.caveat?`<span class="muted" style="font-size:12px">${esc(g.caveat)}</span>`:""}</section>
    ${forecastHTML({head:`When will most people with ${g.name.replace(/^Stage /,"stage ")} be curable?`,level:gl,burden:g.burden,f,note:f.note,reached:g.reached?.year,reachedEasy:g.reached_easy?.year,easy:g.easy,
      trend:`<div class="placeholder">Years-until-cure history for ${esc(g.name)} starts with the next weekly update.</div>`})}
    ${catalystsHTML(g.catalysts,g.name)}${logHTML(logRows)}
    ${sourcesHTML([g.url?{url:g.url,title:"Survival figure"}:null,g.reached?.url?{url:g.reached.url,title:`Cured for most since ~${g.reached.year}`}:null].filter(Boolean))}
  </main>${railHTML(d,`${g.share?`<section class="card"><span class="eyebrow">How common</span><span style="font-weight:600">${safe(g.share_url)?link(g.share_url,g.share):esc(g.share)}</span></section>`:""}<section class="card"><span class="eyebrow">Part of ${esc(d.name)}</span><a href="#d-${esc(d.id)}" style="font-weight:600">See every ${w}, the overall forecast and how many people are affected →</a></section>`,true)}</div>${footerHTML()}`}

function detail(id,vid){const d=S.dz.find(x=>x.id===id);
  if(!d)return `<a class="back" href="#">← All diseases</a><div class="empty">${S.ready?"That disease isn't in the tracker.":"Loading…"}</div>`;
  if((d.groups||[]).length){if(vid){const g=d.groups.find(x=>x.id===vid);if(g)return variantPage(d,g)}return hubPage(d)}
  return singlePage(d)}

/* ---------- Pipeline ---------- */
const STAGE_COLORS={biology:"--st1",design:"--st2",preclinical:"--st3",trials:"--st4",approval:"--st5",access:"--st6"};
function stages(){return S.gates.filter(g=>g.id!=="simulation").sort((a,b)=>(a.order||0)-(b.order||0))}
function mid(a,b){return (Number(a)+Number(b))/2}
function pipeTotals(){const st=stages().filter(g=>g.todayLow!=null&&g.fastLow!=null);if(st.length<4)return null;
  const today=st.reduce((s,g)=>s+mid(g.todayLow,g.todayHigh),0),fast=st.reduce((s,g)=>s+mid(g.fastLow,g.fastHigh),0);
  const tr=st.find(g=>g.id==="trials");return{today:Math.round(today),fast:Math.round(fast),trialsLabel:tr?.todayLabel,st}}
function pipeline(){
  const T=pipeTotals(),m=S.meta||{},sim=S.gates.find(g=>g.id==="simulation");
  const bar=key=>T?T.st.map(g=>`<span style="flex:${mid(g[key+"Low"],g[key+"High"])};background:var(${STAGE_COLORS[g.id]||"--st1"})" title="${esc(g.name)}"></span>`).join(""):"";
  const totals=T?`<div class="card totals"><div class="row"><span style="font-size:13px;font-weight:600">Today</span><span class="display num" style="font-size:22px">~${T.today} years</span></div>
    <div class="bar">${bar("today")}</div>
    <div class="row" style="margin-top:6px"><span style="font-size:13px;font-weight:600">Best case</span><span class="display num" style="font-size:22px;color:var(--yes)">~${T.fast} years</span></div>
    <div class="bar" style="width:${Math.max(12,Math.round(T.fast/T.today*100))}%">${bar("fast")}</div>
    <div class="legend">${T.st.map(g=>`<span><i style="background:var(${STAGE_COLORS[g.id]||"--st1"})"></i>${esc(g.name)}</span>`).join("")}</div>
    <p class="muted" style="margin:0;font-size:12px">Typical times for a new drug, using the middle of each range. "Best case" built from things that have already happened somewhere, like COVID vaccine trials finishing in about 7 months. Real diseases vary a lot.</p></div>`:"";
  const boosterHTML=sim?`<div class="booster"><div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><b style="font-size:14px">Booster · ${esc(sim.name)}</b><span class="odds">${esc(sim.pOpen2030)}% by 2030</span></div>
    <span style="font-size:13px">${esc(sim.effectNote||sim.question)}</span>
    <details><summary>Evidence and signals</summary><p style="margin:6px 0 0">${esc(sim.statusNote)}</p>${(sim.signals||[]).length?`<ul>${sim.signals.map(s=>`<li>${link(s.url,s.name)}: ${esc(s.value)} <span class="muted">${fd(s.asOf)}</span></li>`).join("")}</ul>`:""}
    ${[...(sim.timeSources||[]),...(sim.sources||[])].length?`<p style="margin:6px 0 0" class="muted">Sources: ${[...(sim.timeSources||[]),...(sim.sources||[])].map(s=>link(s.url,s.title)).join(" · ")}</p>`:""}</details></div>`:"";
  const stepHTML=(g,i)=>{const st=g.status||"easing";
    const times=g.todayLabel?`<div class="times"><span>Today <b class="num">${esc(g.todayLabel)}</b>${g.todayNote?`<small>${esc(g.todayNote)}</small>`:""}</span><span>Best case <b class="num fast">${esc(g.fastLabel)}</b>${g.fastNote?`<small>${esc(g.fastNote)}</small>`:""}</span></div>`:"";
    const srcs=[...(g.timeSources||[]),...(g.sources||[])];
    return `<div class="step"><span class="mark" style="background:var(--${esc(st)})"></span>
      <div class="top"><b>${i+1} · ${esc(g.name)}</b><span class="st-${esc(st)}">${esc(st[0].toUpperCase()+st.slice(1))}</span></div>
      <span class="muted" style="font-size:13px">${esc(g.question)}</span>${times}
      <span class="odds">${esc(g.pOpen2030)}% chance this gets much faster by 2030${delta(g.pOpen2030,g.prevPOpen2030)}</span>
      <details><summary>Evidence and signals</summary><p style="margin:6px 0 0">${esc(g.statusNote)}</p>
        ${(g.signals||[]).length?`<ul>${g.signals.map(s=>`<li>${link(s.url,s.name)}: ${esc(s.value)} <span class="muted">${fd(s.asOf)}</span></li>`).join("")}</ul>`:""}
        ${g.watch?`<p style="margin:6px 0 0"><b>Watch:</b> ${esc(g.watch)}</p>`:""}
        ${srcs.length?`<p style="margin:6px 0 0" class="muted">Sources: ${srcs.map(s=>link(s.url,s.title)).join(" · ")}</p>`:""}</details>
      ${g.id==="preclinical"?boosterHTML:""}
    </div>`};
  return `<a class="back" href="#">← All diseases</a>
  <header style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow">The cure pipeline</span>
    <h1 class="display" style="font-size:36px;line-height:1.05">${T?`Why cures take about ${T.today} years`:"Why cures take so long"}</h1>
    <p style="margin:0">Every cure moves through the same six stages. Here is how long each takes today, and how short it could get if AI and faster rules pay off.</p></header>
  ${totals}
  <section class="flow"><div class="node" style="padding-bottom:12px"><span class="ring"></span><span class="eyebrow">Disease discovered</span></div>
    ${stages().map(stepHTML).join("")||`<div class="empty">Stages load from the tracker's data.</div>`}
    <div class="node" style="padding-top:2px"><span class="fill"></span><span class="eyebrow" style="color:var(--yes)">Cure reaches most patients</span></div></section>
  <div class="card" style="font-size:13px"><span><span class="st-easing">Easing</span> real progress, not solved yet · <span class="st-blocking">Blocking</span> still holding progress back · <span class="st-cleared">Cleared</span> solved in practice</span></div>
  ${m.accelIndex!=null?`<div class="dark-card"><span class="eyebrow">Acceleration index</span><span class="display num" style="font-size:32px;line-height:1">${esc(m.accelIndex)}%${delta(m.accelIndex,m.prevAccelIndex)}</span>
    <span style="font-size:14px;color:var(--on-dark-muted)">The average chance each stage gets much faster by 2030. AI-driven stages use the AI odds from Futures Watch. Every disease forecast leans this far toward the faster pipeline.</span></div>`:""}`;
}

/* ---------- Record ---------- */
function record(){
  const m=S.meta||{},u=S.updates[0],sc=Array.isArray(m.scorecard)?m.scorecard:[];
  const today=new Date().toISOString().slice(0,7);
  const checks=S.checks.slice().sort((a,b)=>((a.resolved?1:0)-(b.resolved?1:0))||String(a.resolvesBy).localeCompare(String(b.resolvesBy)));
  const cal=S.cal.filter(c=>String(c.date)>=today).sort((a,b)=>String(a.date).localeCompare(String(b.date))).slice(0,14);
  return `<a class="back" href="#">← All diseases</a>
  <header style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">${m.week?`Week ${esc(m.week)} · `:""}${fd(m.updatedAt)}</span><h1 class="display" style="font-size:36px;line-height:1.05">This week</h1>
    ${m.headline?`<p style="margin:0;font-weight:600">${esc(m.headline)}</p>`:""}</header>
  ${(m.thisWeek||[]).length?`<div class="card">${m.thisWeek.map(p=>`<p style="margin:0">${esc(p)}</p>`).join("")}</div>`:""}
  <div class="card"><h2 style="font-size:15px">What moved</h2>${u&&(u.changes||[]).length?`<ul class="changes">${u.changes.map(c=>`<li><b>${esc(c.target)}</b> <span class="num">${esc(c.from)} → ${esc(c.to)}</span>. ${esc(c.why)} ${safe(c.url)?link(c.url,"Source"):""}</li>`).join("")}</ul>`:`<p class="muted" style="margin:0">No forecast moved this week.</p>`}</div>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap"><h2 style="font-size:15px">Short-range forecasts</h2><span class="muted" style="font-size:12px">${sc.length?`Brier score ${(sc.reduce((a,b)=>a+(+b.brier||0),0)/sc.length).toFixed(3)} · ${sc.length} resolved`:"None resolved yet"}</span></div>
    <p class="muted" style="margin:0;font-size:13px">Dated yes-or-no calls that resolve within months. They are how this tracker checks its own accuracy. Lower Brier is better; always guessing 50% scores 0.25.</p>
    <div>${checks.map(c=>`<div class="check"><div>${link(c.url,c.label)}<div class="muted" style="font-size:12px;margin-top:2px">${c.resolved==="void"?`<span class="res void">void</span> ${esc(c.note||"not scored")}`:c.resolved?`<span class="res ${esc(c.resolved)}">${esc(c.resolved)}</span> last forecast ${esc(c.lastForecast??c.prevProb)}%`:`Resolves by ${fd(c.resolvesBy)}`}</div></div><div class="prob num">${c.resolved?"":esc(c.prob)+"%"}</div></div>`).join("")}</div></div>
  <div class="card"><h2 style="font-size:15px">Coming up</h2><ul class="cal">${cal.map(c=>`<li><span class="muted num">${fd(c.date)}</span><span>${link(c.url,c.event)}</span></li>`).join("")||`<li class="muted">Nothing scheduled yet.</li>`}</ul></div>
  <div class="card"><h2 style="font-size:15px">How this works</h2>
    <p style="margin:0;font-size:14px">Each disease, and each stage or type, sits on a 0 to 5 ladder, from no treatment to cured for all, and how hard its treatment is gets rated on its own. The best-guess year is when we expect most patients to be curable with tolerable care. Each forecast blends a today's-pace track and a faster-pipeline track, weighted by the acceleration index. Forecasts start from shared base rates: about 1 in 10 drugs that enter human trials get approved, and past cures took decades.</p>
    <p style="margin:0;font-size:14px">Every Thursday Claude sweeps the week's news for all diseases and re-checks five in depth on rotation. Anyone can add a disease or a source by pull request.</p></div>`;
}

/* ---------- Router ---------- */
function route(){const h=(location.hash||"").replace(/^#/,"");
  if(h.startsWith("d-")){const [id,vid]=h.slice(2).split("/");return{v:"detail",id,vid}}
  if(h==="pipeline")return{v:"pipeline"};
  if(h==="record")return{v:"record"};
  if(h==="stats")return{v:"stats"};
  return{v:"home"};}
let lastView="";
function render(){const app=$("app"),r=route(),key=r.v+(r.id||"")+"/"+(r.vid||"");
  if(!S.ready&&!S.dz.length){app.innerHTML=`<div class="empty">${esc(S.err||"Loading the tracker…")}</div>`;return}
  const focusQ=document.activeElement&&document.activeElement.id==="q",selStart=focusQ?document.activeElement.selectionStart:0;
  app.innerHTML=navHTML()+(r.v==="detail"?detail(r.id,r.vid):r.v==="pipeline"?pipeline():r.v==="record"?record():r.v==="stats"?stats():home());
  if(r.v==="home"){const s=$("sort");if(s)s.value=sort;renderCards();if(masonRO){masonRO.disconnect();masonRO.observe($("cards"))}if(focusQ){const i=$("q");if(i){i.focus();try{i.setSelectionRange(selStart,selStart)}catch(e){}}}}
  if(r.v==="detail")drawTrend();
  if(key!==lastView){if(lastView)window.scrollTo(0,0);lastView=key}
  document.title=r.v==="stats"?"Stats · Cure Watch":r.v==="detail"?`${(S.dz.find(d=>d.id===r.id)||{}).name||"Disease"} · Cure Watch`:"Cure Watch";
}
window.addEventListener("hashchange",render);
document.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value;renderCards()}});
document.addEventListener("change",e=>{if(e.target.id==="cat"){catF=e.target.value;renderCards();return}if(e.target.id==="sort"){sort=e.target.value;try{localStorage.setItem("cw2-sort",sort)}catch(_){}renderCards()}});
document.addEventListener("click",e=>{if(e.target.closest("[data-theme-cycle]"))cycleTheme()});
/* Re-pack the masonry when the column count changes. Watching the card area itself also catches zoom and
   viewport changes that don't fire a window resize. */
const masonRO=typeof ResizeObserver==="function"?new ResizeObserver(()=>{const el=$("cards");if(el&&ncols(el)!==masonCols)renderCards()}):null;
let rsz2;window.addEventListener("resize",()=>{clearTimeout(rsz2);rsz2=setTimeout(()=>{const el=$("cards");if(el&&ncols(el)!==masonCols)renderCards()},120)});

(async()=>{
  const timer=setTimeout(()=>{if(!S.ready){S.err="Still loading the tracker's data…";render()}},10000);
  try{
    const r=await fetch("data.json",{cache:"no-cache"});
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();
    S.meta=j.meta;S.cats=j.categories;S.dz=j.diseases;S.gates=j.gates;S.checks=j.checks;S.cal=j.calendar;S.updates=j.updates||[];
    S.ready=true;
  }catch(e){S.err="Couldn't load the tracker's data. Try reloading the page."}
  clearTimeout(timer);render();
})();
render();
})();
</script>

</body>
