headline: No brain, mental health, autoimmune or aging condition moved closer to a cure this update. Parkinson's
  odds dipped after another failed trial, the first psilocybin application reached the FDA, and the FDA
  turned down a lung cancer drug.
this_week:
- This update reviewed the brain and nerves, mental health, autoimmune, and aging and everyday conditions
  groups, 22 conditions in all. No cure level or treatment burden changed. The acceleration index stays
  at 21%.
- The one forecast move was Parkinson's, whose chance of a cure by 2045 slipped from 14% to 13%. Bial's
  GCase activator failed a phase 2b trial in Parkinson's linked to the GBA gene, the second
  disease-modifying failure this year. Roche also ended tominersen for Huntington's after it lowered
  huntingtin without helping patients.
- Compass completed the first full FDA application for psilocybin, for treatment-resistant depression,
  and Kalshi prices approval before July 2027 at about 81%. The FDA approved a once-monthly olanzapine
  injection for schizophrenia. Lung cancer was pulled in out of turn after the FDA rejected ivonescimab
  for lack of a survival benefit, so that check resolved no. WHO's TB report showed 2025 deaths fell to
  1.13 million, so that check resolved yes.
- The Bundibugyo Ebola epidemic reached 11,197 confirmed cases and 5,471 related deaths in DRC by Nov
  12.
- 'Watch next: AR1001 Alzheimer''s results at CTAD (Nov 16), PAHO''s measles ruling for the US and Mexico,
  the FDA decision on obinutuzumab for lupus (by December), and FDA acceptance of azetukalner for epilepsy.'
