headline: No infection or outbreak moved closer to a cure this update, but the Bundibugyo Ebola epidemic
  passed 10,600 confirmed cases and the first vaccines designed against it were cleared for testing.
this_week:
- This update reviewed the infections and deadly outbreaks group, all 21 diseases, a day late after the
  Nov 8 run did not produce one. No approval, rejection or pivotal trial result landed in the group, so
  no cure level, treatment burden or forecast changed. The acceleration index stays at 21%.
- The Bundibugyo Ebola epidemic reached 10,668 confirmed cases and 5,198 deaths in DRC by Nov 3, with
  9 cases in Kenya and one imported case from Nigeria. WHO advisers added the first two vaccines built
  for this virus, from Oxford and Moderna, to the TUMAINI ring trial. WHO expects first findings from the
  treatment trial in the coming months, so the check on PARTNERS results by mid-2027 rose from 40% to 50%.
- For hepatitis B, about 91% of people cured by bepirovirsen were still cured about a year after stopping
  all drugs. That supports the cure for the low-HBsAg group but does not reach more patients. US measles
  passed 5,000 cases for the year, and Washington reported the first US bird flu death of 2026, with no
  person-to-person spread.
- 'Watch next: the FDA decision on ivonescimab for lung cancer (Nov 14), PAHO''s ruling on US and Mexico
  measles elimination (Nov 10-13), Alzheimer''s data at CTAD (Nov 16), first PARTNERS treatment data for
  Bundibugyo Ebola, and WHO''s 2026 TB report.'
