headline: "No metabolic, genetic or heart condition moved closer to a cure this update. Nineteen new conditions joined the tracker, the FDA approved a new kind of pill to prevent repeat strokes, and three countries lost measles elimination."
this_week:
- "This update reviewed the metabolic, genetic, heart and other groups, 19 already-tracked conditions in all. No cure level, treatment burden or long-range forecast changed. The acceleration index stays at 21%."
- "Nineteen proposed conditions now have forecasts and are tracked, including polio, guinea worm, hereditary angioedema, ATTR amyloidosis, PTSD and sepsis. Smallpox, leprosy, stomach ulcers, bacterial STIs and three cancers are already cured for most, so they carry the year that happened."
- "The FDA approved asundexian (Sunharbo), the first factor XIa pill, to prevent repeat strokes. Full Lp(a)HORIZON results confirmed that cutting Lp(a) 78% did not prevent heart attacks. The EU approved denecimig for hemophilia A, Novo filed etavopivat for sickle cell, and the FDA rejected deramiocel for Duchenne again. The FDA is also investigating tumors after Zolgensma gene therapy for SMA."
- "Alzheimer's AR1001 met its goal in one of two primary groups, so that check resolved yes against our 15% forecast, a Brier score of 0.72. PAHO said the US, Mexico and Bolivia lost measles elimination status. The Bundibugyo Ebola epidemic reached 11,613 confirmed cases and 5,678 deaths in DRC by Nov 17."
- "Watch next: the FDA decision on giredestrant for breast cancer (Nov 30), CagriSema for obesity (by year end), sura-vec gene therapy results for macular degeneration (Q4), and lorundrostat for high blood pressure (Dec 22)."
