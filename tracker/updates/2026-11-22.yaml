date: '2026-11-22'
week: 4
headline: "Metabolic, genetic, heart and other conditions reviewed and 19 new conditions now tracked. The FDA approved a first-of-its-kind pill to prevent repeat strokes, and an oral Alzheimer's drug met one of its two goals."
summary: "Reviewed all 19 already-tracked conditions in the metabolic, genetic, heart and other groups, plus Alzheimer's, Ebola and measles for news. Nineteen proposed conditions got forecasts and joined the tracker. No level, treatment burden or long-range forecast changed for an existing condition. The Alzheimer's check resolved yes, the epilepsy check was lowered, and one check was added."
