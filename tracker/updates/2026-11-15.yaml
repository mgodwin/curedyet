date: '2026-11-15'
week: 3
headline: 'Brain, mental health, autoimmune and aging conditions reviewed: no cure moved closer, Parkinson''s
  2045 odds dipped after another failed trial, and the FDA turned down a lung cancer drug.'
summary: Reviewed all 22 conditions in the brain and nerves, mental health, autoimmune, and aging and everyday
  groups, plus lung cancer out of turn after an FDA rejection. No level or treatment burden changed. Parkinson's
  odds of a cure by 2045 slipped one point after a second disease-modifying trial failed this year. Two
  checks resolved (lung cancer no, tuberculosis yes), one was voided, and two were added.
changes:
- target: 'Parkinson''s: odds by 2045'
  from: 14
  to: 13
  why: Bial's GCase activator BIA 28-6156 failed its phase 2b ACTIVATE trial in GBA-linked Parkinson's,
    the second disease-modifying failure of 2026 after BIIB122; both tracks trimmed within the 2-point cap.
  url: https://www.neurologylive.com/view/mds-congress-2026-late-breaking-data-snapshot
  disease: parkinsons
