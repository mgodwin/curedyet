# Cure Watch disease record. Field guide: CONTRIBUTING.md. Sources live in research.md.
id: als
name: ALS
category: neuro
tracking: active
summary: Amyotrophic lateral sclerosis, a fatal disease that destroys motor neurons and causes progressive
  paralysis.
toll:
  text: About 1.9 new cases per 100,000 people per year worldwide; median survival about 2-4 years from
    onset (published estimates).
  url: https://en.wikipedia.org/wiki/Amyotrophic_lateral_sclerosis
  ratio: "1 in 400"
  ratio_caption: "people will develop ALS in their lifetime"
  ratio_url: https://jamanetwork.com/journals/jama/fullarticle/2830516
  ratio_basis: "Lifetime risk of about 1 in 400, stated in Turnbull, 'Platform Trials in ALS', JAMA 2025 editorial."
status:
  level: 1
  why: Riluzole, edaravone and tofersen modestly slow decline in some patients, but ALS still progresses
    and is fatal.
  today: Riluzole adds a few months of survival and edaravone slows function loss in a subset of early
    patients. Tofersen (Qalsody) lowers toxic SOD1 protein and helps the roughly 2% of patients with SOD1
    mutations. Ventilation and multidisciplinary care extend life, but most patients die within a few
    years.
  last_reviewed: null
treatment:
  best:
  - Riluzole
  - Edaravone
  - Tofersen (Qalsody) for SOD1-ALS
  - Non-invasive ventilation
  - Multidisciplinary care
  burden: moderate
  burden_note: Riluzole is a daily pill needing liver tests, edaravone is costly and tofersen requires
    repeated spinal injections; ventilation and feeding support become intensive as disease progresses.
forecast:
  bottleneck: biology-limited
  normal:
    p2035: 1
    p2045: 8
    median: 2068
    low: 2045
    high: 2100
  faster:
    p2035: 4
    p2045: 28
    median: 2050
    low: 2038
    high: 2090
  faster_note: AI that finds causal targets for sporadic TDP-43 ALS would be the key change, since gene-targeted
    drugs already work for rare forms; the 2045 lift is large but 2035 stays low.
  outlook: Gene-targeted antisense drugs now work for rare genetic forms (SOD1, FUS), which together cover
    only a few percent of patients. Most ALS is sporadic and TDP-43 driven, and no therapy yet clearly
    slows it. Expect more subset successes, not a cure for most, by 2035.
pipeline:
- name: Ulefnersen (ION363, Ionis/Otsuka) for FUS-ALS
  note: FUSION met its primary endpoint (p=0.0005) in Sept 2026; FDA talks on expedited filing planned.
  stage: Phase 3
  url: https://ir.ionis.com/news-releases/news-release-details/ionis-announces-positive-topline-results-phase-3-fusion-study
- name: QRL-201 (QurAlis, UNC13A/STMN2)
  note: Early biomarker and safety signals; phase 3 planned.
  stage: Phase 2
  url: https://en.wikipedia.org/wiki/Amyotrophic_lateral_sclerosis
- name: Tofersen in presymptomatic SOD1 carriers (ATLAS)
  note: Tests whether early treatment delays onset in people with SOD1 mutations.
  stage: Phase 3
  url: https://en.wikipedia.org/wiki/Tofersen
recent:
- date: 2026-09
  text: Antisense drug ulefnersen became the second genetic ALS therapy to succeed in phase 3, for the
    aggressive FUS form.
  url: https://ir.ionis.com/news-releases/news-release-details/ionis-announces-positive-topline-results-phase-3-fusion-study
next_milestone: null
ai:
  impact: some
  note: AI target-discovery firms have moved ALS candidates into early trials, but none has shown clinical
    efficacy yet.
markets: []
