  text: Second COMP360 Phase 3 (COMP006) showed benefit lasting to at least week 26 in treatment-resistant
    depression.
  url: https://www.biospace.com/press-releases/compass-pathways-announces-second-quarter-and-first-half-2026-financial-results-and-business-highlights
- date: 2025-11
  text: FDA approved lumateperone as adjunctive therapy for MDD based on two Phase 3 trials.
  url: https://www.indianpharmapost.com/regulatory/johnson-johnson-gets-fda-nod-for-new-depression-treatment-18193
next_milestone:
