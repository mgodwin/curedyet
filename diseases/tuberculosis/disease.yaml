# Cure Watch disease record. Field guide: CONTRIBUTING.md. Sources live in research.md.
id: tuberculosis
name: Tuberculosis
category: infectious
tracking: active
summary: A bacterial infection, usually of the lungs, spread through the air.
toll:
  text: About 1.23 million deaths in 2024; 8.3M people diagnosed, a record (WHO Global TB Report 2025)
  url: https://www.pbs.org/newshour/health/global-tuberculosis-case-rise-to-a-record-but-deaths-fall-reports-who
  ratio: "1 in 4"
  ratio_caption: "people worldwide is estimated to have been infected with TB bacteria, though most never fall ill"
  ratio_url: https://www.who.int/news-room/fact-sheets/detail/tuberculosis
  ratio_basis: "WHO TB fact sheet: 'About a quarter of the global population is estimated to have been infected with TB bacteria.'"
status:
  level: 4
  why: Standard multi-drug regimens cure most people with drug-susceptible TB, and 6-month all-oral
    regimens now cure most drug-resistant TB too, but many people are never diagnosed or treated, and
    about 1.23 million died in 2024.
  today: A 4-6 month drug course cures most patients with drug-susceptible TB. Drug-resistant TB now has
    short all-oral regimens (BPaLM, and the BEAT-TB regimen that is safe for children and pregnancy). TB
    still causes more deaths than any other infection because many cases go undiagnosed, and the only
    vaccine, BCG, protects adults poorly.
  last_reviewed: '2026-11-09'
treatment:
  best:
  - HRZE standard regimen (isoniazid, rifampicin, pyrazinamide, ethambutol)
  - BPaLM 6-month regimen for drug-resistant TB
  - BEAT-TB regimen (bedaquiline, linezolid, delamanid + levofloxacin or clofazimine)
  - 3HP/1HP preventive therapy
  - BCG vaccine (infants)
  burden: moderate
  burden_note: Four to six months of daily multi-drug pills, often observed, with liver toxicity, nausea
    and rash risks; drug-resistant regimens add linezolid nerve and blood toxicity, but programs usually
    provide treatment free.
  cure_tolerable: true
forecast:
  bottleneck: access-limited
  reached: 1970
  faster_note: Already curable for most; acceleration would help via AI X-ray screening and faster vaccine
    and short-regimen trials, but the remaining gap is diagnosis and funding.
  outlook: Most TB is already curable, so the gap is diagnosis, adherence and resistance. An effective
    adult vaccine such as M72 would be the big shift toward elimination, with Phase 3 results likely in
    the next few years. Funding cuts are a real risk.
pipeline:
- name: M72/AS01E vaccine
  stage: Phase 3
  note: About 20,000 people enrolled across 5 countries; earlier Phase 2b showed about 50% efficacy.
  url: https://www.gatesmri.org/the-phase-3-clinical-trial-of-the-m72-aso1e-tuberculosis-tb-vaccine-candidate-has-reached-full-enrollment/
  variants:
  - drug-susceptible
  - drug-resistant
  expected: '2028'
  effect: small
  effect_note: If the Phase 3 confirms about 50% efficacy, a vaccine would prevent many cases but would
    not change how well treatment cures those who get sick.
- name: BEAT-TB 6-month regimen for rifampicin-resistant TB
  stage: Phase 3
  note: Published in NEJM June 2026; matched 9-month care at about 86% success and is usable in children
    and pregnancy.
  url: https://www.ewn.co.za/2026/07/01/important-advance-made-in-tb-treatment
  variants:
  - drug-resistant
  effect: some
  effect_note: Already published; a 6-month all-oral regimen usable in children and pregnancy makes drug-resistant
    TB treatment shorter and easier.
- name: Long-acting pretomanid and sorfequiline (TBAJ-876)
  stage: Preclinical
  note: Preclinical data shown at CROI 2026; aims to simplify treatment.
  url: https://www.eatg.org/hiv-news/treatment-action-group-croi-2026-tb-research-round-up/
  variants:
  - drug-susceptible
  - drug-resistant
  effect: some
  effect_note: Preclinical; if long-acting injections work, they could shrink months of daily pills to
    a few doses, a step toward an easy cure.
recent:
- date: 2026-06
  text: BEAT-TB showed a 6-month regimen without pretomanid works for rifampicin-resistant TB, including
    in children and pregnancy.
  url: https://www.ewn.co.za/2026/07/01/important-advance-made-in-tb-treatment
- date: 2025-11
  text: WHO reported TB deaths fell to 1.23M in 2024 while diagnoses hit a record 8.3M.
  url: https://www.pbs.org/newshour/health/global-tuberculosis-case-rise-to-a-record-but-deaths-fall-reports-who
next_milestone:
  date: 2026-11
  url: https://www.who.int/teams/global-tuberculosis-programme/tb-reports/global-tuberculosis-report-2025
  what: WHO Global Tuberculosis Report 2026 with 2025 burden data (expected, based on the Nov 2025 release)
ai:
  impact: some
  note: WHO-recommended AI software that reads chest X-rays (computer-aided detection) is widely used
    to screen for TB.
markets: []
prevention:
  level: 1
  burden: moderate
  why: The only vaccine, BCG, protects babies well against the deadliest childhood forms (about 85% against
    TB meningitis and miliary TB) but gives little reliable protection against lung TB in teens and adults,
    who drive most cases and spread.
  burden_why: BCG is one cheap shot at birth, but for adults the main tool is preventive treatment (3-9
    months of pills, cutting risk about 60%), which only reaches people found through contact tracing
    or HIV care, and coverage is low.
  best:
  - BCG vaccine (infants)
  - TB preventive treatment (isoniazid, 3HP) for infected contacts
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7024998
  forecast:
    median: 2058
    low: 2040
    high: 2100
    p2035: 3
    p2045: 15
    note: 'The lead candidate, M72/AS01E, is in a 20,000-person phase 3 trial with results expected late
      2028 and filings from 2029, but its phase 2b showed only about 50% protection, so success would
      most likely reach rung 2, not 3. MTBVAC (infant phase 3) aims to beat BCG, while VPM1002 failed
      in phase 3 in 2024. Base rates: about half of phase 3 vaccines are licensed, and no TB vaccine candidate
      has yet shown 85% protection against adult lung TB.'
  easy:
    median: 2062
    low: 2042
    high: 2100
    p2035: 2
    p2045: 12
    note: Strong and mild would need a cheap, lasting vaccine giving about 85% protection to adolescents
      and adults, which no current candidate has shown. M72 (2 doses, about 50% in phase 2b) is the only
      late-stage adult option, so this depends on a next-generation candidate still in early trials, where
      historical success is about 10% over 10-15 years.
