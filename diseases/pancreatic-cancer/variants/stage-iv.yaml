# Cure Watch variant record: one stage or type of Pancreatic cancer. Field guide: CONTRIBUTING.md.
id: stage-iv
name: Stage IV
order: 4
what: Cancer that has spread to distant organs such as the liver or lungs (metastatic).
level: 1
burden: heavy
burden_why: Chemotherapy continues until it stops working, then further drugs, without cure.
survival: ~3% alive at 5 years (SEER 'distant' stage, 5-year relative survival, 2015-2021)
share: About half of US pancreatic cancers have spread to distant organs at diagnosis (SEER 'distant',
  51%)
share_url: https://seer.cancer.gov/statfacts/html/pancreas.html
treatment: Patients get chemotherapy such as FOLFIRINOX or gemcitabine-based regimens until it stops working,
  and since 2026 the RAS inhibitor daraxonrasib after first-line chemo. These extend life by months and
  ease symptoms but do not cure.
caveat: Share is from SEER Cancer Stat Facts (https://seer.cancer.gov/statfacts/html/pancreas.html); AJCC-based
  SEER 2004-2012 data put stage IV at ~55%.
url: https://www.cancer.org/cancer/types/pancreatic-cancer/detection-diagnosis-staging/survival-rates.html
forecast:
  median: 2070
  low: 2046
  high: 2100
  p2035: 1
  p2045: 9
  note: About 3 in 100 are alive at 5 years, so this needs drugs that eradicate spread disease, far beyond
    the months of extra life RAS inhibitors now give. Combinations of RAS inhibitors with other targeted
    drugs or immunotherapy are the nearest candidates.
