# Cure Watch disease record. Field guide: CONTRIBUTING.md. Sources live in research.md.
id: sma
name: Spinal muscular atrophy
category: genetic
tracking: active
summary: An inherited disease where loss of the SMN1 gene causes motor nerve cells to die, leading to
  muscle weakness and, in severe forms, death in infancy.
toll:
  text: About 1 in 7,000-10,000 births (US/Europe); the leading genetic cause of infant death before modern
    treatment.
  url: https://en.wikipedia.org/wiki/Spinal_muscular_atrophy
  ratio: "1 in 8,000 to 10,000"
  ratio_caption: "people worldwide is affected by spinal muscular atrophy"
  ratio_url: https://medlineplus.gov/genetics/condition/spinal-muscular-atrophy/
  ratio_basis: "NIH MedlinePlus Genetics: 'Spinal muscular atrophy affects 1 per 8,000 to 10,000 people worldwide.' Other sources give about 1 in 10,000 births."
status:
  level: 3
  why: Infants found by newborn screening and treated before symptoms, often with one-time Zolgensma,
    can reach near-normal motor milestones, but people treated after symptoms start keep lasting weakness.
  today: Three disease-modifying therapies (nusinersen, risdiplam, onasemnogene) changed SMA from fatal
    to treatable, and timing matters most. Newborn screening lets many babies be treated before symptoms.
    People treated later improve or stabilize but live with lasting disability, and in 2025-26 an
    intrathecal gene therapy for ages 2+ (Itvisma) and a muscle-targeted add-on (apitegromab) were
    approved.
  last_reviewed: null
treatment:
  best:
  - Onasemnogene abeparvovec (Zolgensma)
  - Itvisma (intrathecal onasemnogene)
  - Risdiplam (Evrysdi)
  - Nusinersen (Spinraza)
  - Apitegromab (Isembyld)
  burden: heavy
  burden_note: One-time Zolgensma costs over $2M and risks liver injury needing steroids and monitoring;
    alternatives are repeated spinal injections of nusinersen or daily risdiplam for life, all very costly.
forecast:
  bottleneck: access-limited
  normal:
    p2035: 2
    p2045: 19
    median: 2059
    low: 2042
    high: 2087
  faster:
    p2035: 17
    p2045: 34
    median: 2055
    low: 2041
    high: 2077
  faster_note: Level 4 depends mostly on universal newborn screening and one-time gene therapy reaching
    every new case; acceleration helps with cheaper delivery and fixes for older patients, so the lift
    is real but modest.
  outlook: With universal newborn screening and one-time gene therapy, most new cases in rich countries
    may soon get near-normal lives, which is close to a cure for most. The gap is older patients who lost
    motor nerve cells before treatment and gaps in screening. Level 4 could arrive in the 2030s as
    screened cohorts grow up. Most people living with SMA today were treated after symptoms, a group
    unlikely to be cured soon; this forecast assumes people screened and treated before symptoms become
    most of those living with SMA over the coming decades.
pipeline:
- name: Apitegromab (Isembyld)
  stage: Approved 2025-26
  note: Anti-myostatin add-on approved in the US in Sept 2026; EU application withdrawn over manufacturing.
  url: https://en.wikipedia.org/wiki/Apitegromab
  variants:
  - treated-after-symptoms
  effect: small
  effect_note: Already US-approved; a muscle-targeting add-on gives modest motor gains on top of existing
    drugs.
- name: Itvisma (intrathecal onasemnogene)
  stage: Approved 2025-26
  note: One-time gene therapy for patients 2 and older; FDA Dec 2025, EU July 2026.
  url: https://www.healthday.com/healthpro-news/neurology/fda-approves-itvisma-for-spinal-muscular-atrophy
  variants:
  - treated-after-symptoms
  effect: small
  effect_note: Already approved; one-time gene therapy for older children and adults stabilizes the disease
    but cannot restore lost motor neurons.
recent:
- date: 2025-12
  text: FDA approved Itvisma, extending one-time SMA gene therapy to patients 2 and older.
  url: https://www.healthday.com/healthpro-news/neurology/fda-approves-itvisma-for-spinal-muscular-atrophy
- date: 2026-09
  text: FDA approved apitegromab, the first muscle-targeted SMA therapy, as an add-on to SMN drugs.
  url: https://en.wikipedia.org/wiki/Apitegromab
next_milestone: null
ai:
  impact: low
  note: SMA progress came from antisense, small-molecule splicing and AAV gene therapy; AI plays little
    visible role now.
markets: []
