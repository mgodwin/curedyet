# Cure Watch variant record: one stage or type of Spinal muscular atrophy. Field guide: CONTRIBUTING.md.
id: treated-after-symptoms
name: SMA treated after symptoms
order: 2
what: People whose spinal muscular atrophy was treated only after muscle weakness had started, including
  most children and adults diagnosed before newborn screening.
level: 1
burden: heavy
survival: 91% of infants with type 1 survived without permanent ventilation at 14 months and 59% sat alone
  by 18 months, versus 26% and 0% untreated (STR1VE)
treatment: Patients get one-time gene therapy (Zolgensma, or Itvisma for ages 2 and up), repeated spinal
  injections (nusinersen) or daily risdiplam, all very costly. These usually stop or slow the decline
  and can bring some gains, but nerve cells already lost do not come back, so most live with lasting disability.
caveat: 'Level sits between 1 and 2: treatment often halts decline, but life is not near-normal, which
  level 2 requires. Survival figure is for symptomatic infants with type 1 SMA; older patients with types
  2-3 mostly stabilize rather than improve.'
url: https://pubmed.ncbi.nlm.nih.gov/33743238/
forecast:
  median: 2075
  low: 2048
  high: 2100
  p2035: 1
  p2045: 5
  note: Needs a way to restore lost motor nerve cells or their function, not just stop decline. Muscle-targeted
    add-ons like apitegromab and Itvisma for older patients help, but no regenerative candidate is in
    late trials.
