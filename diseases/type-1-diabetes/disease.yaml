# Cure Watch disease record. Field guide: CONTRIBUTING.md. Sources live in research.md.
id: type-1-diabetes
name: Type 1 diabetes
category: metabolic
tracking: active
summary: An autoimmune disease in which the immune system destroys the insulin-making beta cells of the
  pancreas.
toll:
  text: About 9.5M people living with diagnosed T1D and ~174,000 deaths worldwide (2025 estimates); ~1.5M
    in the US.
  url: https://www.ajmc.com/view/projected-burden-demands-investment-and-equity-in-type-1-diabetes-care
status:
  level: 2
  why: Insulin with CGMs and automated insulin pumps gives near-normal lives in rich countries, but nothing
    restores insulin production for most patients.
  today: Lifelong insulin is standard, increasingly via closed-loop pump and CGM systems, and teplizumab
    can delay onset in at-risk people. Donor islet transplants and Vertex's stem-cell islets (zimislecel)
    have freed some patients from insulin, but both need lifelong immunosuppression and reach very few.
    Gene-edited hypoimmune islets that avoid immunosuppression are in first-in-human testing.
  last_reviewed: '2026-11-03'
treatment:
  best:
  - Automated insulin delivery (closed-loop)
  - Continuous glucose monitors
  - Teplizumab (delays onset)
  - Donor islet transplant (Lantidra)
  burden: moderate
  burden_note: Lifelong insulin by pump or injections with CGM; hypoglycemia risk, daily self-management
    and device and insulin costs; islet transplants need lifelong immunosuppression and reach few.
forecast:
  bottleneck: design-limited
  normal:
    p2035: 7
    p2045: 38
    median: 2046
    low: 2035
    high: 2075
  faster:
    p2035: 15
    p2045: 62
    median: 2041
    low: 2033
    high: 2060
  faster_note: Engineering hypoimmune islets that avoid immunosuppression and scaling their manufacture
    would matter most; the biology already works, so the lift is large by 2045.
  outlook: Cell replacement works biologically, but the immunosuppression problem is unsolved at scale
    and Vertex's lead program has stalled. A hypoimmune or encapsulated islet that most patients can get
    without drugs probably needs a decade of trials and manufacturing scale-up, so a cure for most is
    more likely in the 2040s.
pipeline:
- name: VX-017 (Vertex islet program)
  note: Vertex is shifting focus here from zimislecel to reach more patients; pivotal development expected
    2027.
  stage: Phase 1
  url: https://news.vrtx.com/news-releases/news-release-details/vertex-reports-third-quarter-2026-financial-results
- name: SC451 (Sana hypoimmune iPSC islets)
  note: Aims for insulin independence without immunosuppression; IND and Phase 1/2 start targeted as early
    as 2026.
  stage: Preclinical
  url: https://ir.sana.com/news-releases/news-release-details/sana-biotechnology-reports-second-quarter-2026-financial-results
- name: UP421 (Sana hypoimmune donor islets)
  note: One patient made insulin for 14+ months with no immunosuppression and no immune rejection.
  stage: Phase 1
  url: https://ir.sana.com/news-releases/news-release-details/sana-biotechnology-reports-second-quarter-2026-financial-results
- name: Zimislecel (Vertex stem-cell islets)
  note: Made most early patients insulin-independent with immunosuppression; dosing paused in 2026 for
    a manufacturing review and now deprioritized.
  stage: Phase 3
  url: https://www.businesswire.com/news/home/20260111805110/en/Vertex-Provides-Pipeline-and-Business-Updates-in-Advance-of-Upcoming-Investor-Meetings
recent:
- date: 2026-08
  text: Sana reported gene-edited donor islets still making insulin at 14 months in a patient taking no
    immunosuppressants.
  url: https://ir.sana.com/news-releases/news-release-details/sana-biotechnology-reports-second-quarter-2026-financial-results
- date: 2026-11
  text: Vertex said it will focus on its next-generation VX-017 islet program over zimislecel, which only
    suits certain blood types.
  url: https://news.vrtx.com/news-releases/news-release-details/vertex-reports-third-quarter-2026-financial-results
next_milestone:
  date: 2026-12
  url: https://ir.sana.com/news-releases/news-release-details/sana-biotechnology-reports-second-quarter-2026-financial-results
  what: Sana targets IND filing and Phase 1/2 start for SC451 hypoimmune islets (as early as 2026)
ai:
  impact: some
  note: AI mainly helps through dosing algorithms in closed-loop insulin systems; cell-therapy progress
    is driven by gene editing, not AI-discovered drugs.
