  url: https://www.pharmacytimes.com/view/fda-grants-breakthrough-therapy-designation-to-investigational-cannabis-derived-therapy-for-chronic-low-back-pain
  what: First data from Vertanical's US Phase 3 trial of VER-01 in chronic low back pain (company guidance).
ai:
  impact: low
  note: AI is used to triage imaging and power digital exercise programmes, but no AI-discovered treatment
    for back pain is in late trials.
