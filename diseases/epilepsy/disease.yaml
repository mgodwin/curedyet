# Cure Watch disease record. Field guide: CONTRIBUTING.md. Sources live in research.md.
id: epilepsy
name: Epilepsy
category: neuro
tracking: active
summary: A brain disorder that causes repeated, unprovoked seizures.
toll:
  text: About 50 million people worldwide; premature death risk up to 3x higher (WHO fact sheet, accessed
    2026)
  url: https://www.who.int/news-room/fact-sheets/detail/epilepsy
status:
  level: 2
  why: Up to 70% of patients can become seizure free on antiseizure medicines, but most need lifelong
    treatment and about a third have drug-resistant epilepsy.
  today: Most patients control seizures with one or two antiseizure medicines taken every day. Surgery
    can stop seizures for some people with drug-resistant focal epilepsy, and devices such as responsive
    neurostimulation reduce seizures for others. In low-income countries about three quarters of patients
    do not get the treatment they need.
  groups:
  - name: Drug-responsive epilepsy
    what: Epilepsy in which daily antiseizure medicines stop the seizures.
    level: 2
    burden: moderate
    survival: ~64% seizure-free for at least a year on medicines (30-year Glasgow cohort of newly treated
      patients)
    share: About two-thirds of newly treated patients
    note: Most people become seizure-free on one or two daily antiseizure medicines, usually taken for years
      or for life, with side effects such as tiredness, dizziness or mood changes and pregnancy concerns
      with some drugs. Seizures are controlled, not cured, though some can later stop medicines.
    caveat: The 64% is the share seizure-free at last follow-up in one specialist center; it barely changed
      across three decades despite newer drugs.
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5885858
    forecast:
      median: 2056
      low: 2039
      high: 2100
      p2035: 5
      p2045: 20
      note: A treatment that removes the cause so most people can stop medicines without seizures returning
        would be needed; nothing in late trials does this, though gene therapies for specific genetic epilepsies
        are a start.
  - name: Drug-resistant epilepsy
    what: Epilepsy in which seizures keep happening despite trying at least two suitable medicines.
    level: 1
    burden: moderate
    share: About one-third of patients
    note: Care is usually several medicines at once, sometimes plus a ketogenic diet or an implanted stimulator
      (vagus nerve or responsive neurostimulation), which reduce but rarely stop seizures. Seizures, injuries
      and a higher risk of sudden death persist for most.
    caveat: 'Burden is a judgment call: polytherapy side effects are moderate, but device implants add surgery.
      People whose seizures start in one removable brain area may be surgery candidates (see the next group).'
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5885858
    forecast:
      median: 2060
      low: 2042
      high: 2100
      p2035: 3
      p2045: 14
      note: Epilepsy with many causes would need cures tailored to each; one-time cell and gene therapies
        such as NRTX-1001 and antisense drugs for Dravet syndrome are the nearest candidates but cover only
        some subtypes.
  - name: Drug-resistant focal epilepsy (surgery candidates)
    what: Drug-resistant epilepsy where seizures start in one brain area that surgeons can safely remove
      or destroy.
    level: 3
    burden: heavy
    survival: ~52% seizure-free 5 years and ~47% 10 years after epilepsy surgery (adult cohort, simple partial
      seizures allowed)
    note: After detailed testing, part of the brain is removed or laser-ablated; this is brain surgery with
      risks such as memory, mood or visual field problems. About half stay seizure-free long term (better
      for temporal lobe surgery), many still on medicines, so it cures a meaningful share but not most.
    caveat: Figures confirmed from the abstract via search; PubMed blocked a direct fetch. A randomized
      trial found 58% vs 8% free of disabling seizures one year after temporal lobe surgery vs medicines
      (Wiebe et al., NEJM 2001). Only a minority of drug-resistant patients are suitable surgical candidates,
      and surgery is underused.
    url: https://pubmed.ncbi.nlm.nih.gov/22000136/
    forecast:
      median: 2046
      low: 2032
      high: 2085
      p2035: 20
      p2045: 46
      note: A less invasive one-time treatment that keeps most patients seizure-free long term would be
        needed; the NRTX-1001 cell therapy, now in Phase 3 for temporal lobe epilepsy, is the nearest candidate.
  last_reviewed: '2026-11-03'
treatment:
  best:
  - Antiseizure medicines (e.g. levetiracetam, lamotrigine, cenobamate)
  - Resective epilepsy surgery or laser ablation
  - Responsive neurostimulation (RNS)
  - Vagus nerve stimulation
  - Ketogenic diet therapy
  burden: moderate
  burden_note: Usually lifelong daily antiseizure pills with dizziness, fatigue, mood changes or rare
    serious rashes, plus birth defect concerns with some drugs; surgery helps select drug-resistant patients.
forecast:
  bottleneck: biology-limited
  normal:
    p2035: 4
    p2045: 16
    median: 2058
    low: 2040
    high: 2100
  faster:
    p2035: 8
    p2045: 35
    median: 2047
    low: 2036
    high: 2085
  faster_note: One-time cell and gene therapies could cure subtypes sooner, but epilepsy has many causes,
    so the lift depends on AI mapping and designing for each and is moderate.
  outlook: New drugs mostly add control rather than cure. One-time cell and genetic therapies could cure
    specific subtypes, such as temporal lobe epilepsy or Dravet syndrome, within 5 to 10 years. Curing
    most of a disease with many causes will take much longer.
pipeline:
- name: Azetukalner (Kv7 opener)
  note: Xenon submitted the NDA for focal seizures in Sept 2026 after the positive Phase 3 X-TOLE2.
  stage: Filed
  url: https://www.neurologylive.com/view/xenon-submits-new-drug-application-azetukalner-treatment-focal-seizures
- name: NRTX-1001 (inhibitory interneuron cell therapy)
  note: One-time implant for drug-resistant mesial temporal lobe epilepsy; Phase 1/2 showed median 92%
    seizure reduction in the low-dose group.
  stage: Phase 3
  url: https://www.neurologylive.com/view/phase-3-epic-trial-evaluate-nrtx-1001-cell-therapy-drug-resistant-mesial-temporal-lobe-epilepsy
- name: Zorevunersen (SCN1A antisense, Dravet syndrome)
  note: EMPEROR fully enrolled in June 2026; readout expected Q3 2027 and possible US launch early 2028.
  stage: Phase 3
  url: https://www.biospace.com/press-releases/stoke-therapeutics-announces-second-quarter-2026-financial-results-and-provides-business-updates
- name: ETX101 (AAV gene therapy, Dravet syndrome)
  note: Early-stage trials; Breakthrough Therapy designation in Jan 2026 after sustained seizure reductions
    from one dose. Exact phase unclear.
  stage: Phase 2
  url: https://xtalks.com/international-epilepsy-day-2026-advances-across-therapies-devices-and-monitoring-4606
- name: NeuroPace RNS for generalized epilepsy
  note: PMA supplement for idiopathic generalized epilepsy is under FDA review, based on the NAUTILUS
    study.
  stage: Filed
  url: https://xtalks.com/international-epilepsy-day-2026-advances-across-therapies-devices-and-monitoring-4606
recent:
- date: 2026-03
  text: Azetukalner cut focal seizures by a median 53% at 25 mg vs 10% on placebo in Phase 3 X-TOLE2.
  url: https://www.sec.gov/Archives/edgar/data/0001582313/000119312526211843/xene-ex99_1.htm
- date: 2025-12
  text: Neurona reported some NRTX-1001 patients kept over 97% seizure reduction for up to 24 months after
    one dose.
  url: https://www.biospace.com/press-releases/neurona-therapeutics-presents-new-long-term-clinical-data-from-nrtx-1001-cell-therapy-trials-at-2025-annual-meeting-of-the-american-epilepsy-society
- date: 2026-04
  text: Neurona presented the design of the Phase 3 EPIC sham-controlled trial of its one-time cell therapy
    at AAN 2026.
  url: https://www.neurologylive.com/view/phase-3-epic-trial-evaluate-nrtx-1001-cell-therapy-drug-resistant-mesial-temporal-lobe-epilepsy
