# Cure Watch disease record. Field guide: CONTRIBUTING.md. Sources live in research.md.
id: heart-failure
name: Heart failure
category: cardio
tracking: active
summary: The heart cannot pump or fill well enough to meet the body's needs, causing breathlessness, fluid
  buildup and early death.
toll:
  text: Roughly 64M people live with heart failure worldwide (GBD 2017 estimate cited in reviews).
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10398425/
  ratio: "1 in 4"
  ratio_caption: "people will develop heart failure in their lifetime"
  ratio_url: https://hfsa.org/hf-stats-2025-heart-failure-epidemiology-and-outcomes-statistics
  ratio_basis: "Heart Failure Society of America, HF Stats 2025: lifetime risk of HF has increased to 24%, about 1 in 4."
status:
  level: 1
  why: Modern drug combinations slow decline and cut deaths, but most patients still worsen and about
    half die within five years of diagnosis.
  today: For reduced ejection fraction, four drug classes (ARNI, beta blocker, MRA, SGLT2 inhibitor) plus
    devices extend life a lot. Preserved ejection fraction now has SGLT2 inhibitors, finerenone (FDA approved
    2025) and GLP-1 drugs in obese patients. Heart transplant or LVAD helps a small number with end-stage
    disease.
  last_reviewed: '2026-11-03'
treatment:
  best:
  - Sacubitril/valsartan
  - SGLT2 inhibitors
  - Beta blockers + MRAs (incl. finerenone)
  - ICD/CRT devices
  - Heart transplant / LVAD
  burden: moderate
  burden_note: Lifelong multi-drug regimen with low blood pressure, dizziness and kidney or potassium
    problems needing frequent blood tests; implanted devices, LVAD or transplant are heavy options for
    a few.
forecast:
  bottleneck: biology-limited
  normal:
    p2035: 2
    p2045: 6
    median: 2069
    low: 2047
    high: 2100
  faster:
    p2035: 4
    p2045: 18
    median: 2056
    low: 2042
    high: 2100
  faster_note: Curing heart failure needs heart muscle regeneration or repair, which is still mostly biology;
    acceleration could find regeneration targets but they then need years of trials, so the lift is small
    by 2035.
  outlook: Drugs keep shaving risk, but heart failure is the end point of many diseases and damaged heart
    muscle does not regrow. A cure for most would need working cardiac gene therapy or regeneration, which
    is still in early trials. Prevention through better control of blood pressure, diabetes and obesity
    is the likelier near-term win. About half of patients or more have preserved ejection fraction, which has fewer options, so this forecast follows that type's.
pipeline:
- name: AZD5462 (AstraZeneca), oral relaxin receptor agonist
  stage: Phase 2
  note: LUMINARA Phase 2b in about 260 chronic HF patients presented at ESC 2026.
  url: https://www.consultantlive.com/view/european-society-of-cardiology-2026-preview-6-trials-to-know
  variants:
  - hfref
  - hfpef
  effect: small
  effect_note: If later trials work, a relaxin pill would add another drug that may ease symptoms and
    hospital stays, not reverse heart failure.
- name: AB-1002 (AskBio), cardiac gene therapy
  stage: Phase 2
  note: Phase 1 showed no drug-related adverse events and clinical gains; randomized GenePHIT trial enrolling.
  url: https://www.indianpharmapost.com/biotech/lite/askbios-gene-therapy-shows-promising-12-month-results-for-heart-failure-18088
  variants:
  - hfref
  expected: '2027'
  effect: some
  effect_note: If GenePHIT works, a one-time gene therapy could improve heart pumping in reduced-ejection
    heart failure, a first step toward disease repair.
- name: Finerenone for HFmrEF/HFpEF
  stage: Approved 2025-26
  note: FDA approved for HF with LVEF 40% or more in 2025.
  url: https://cardiovascularbusiness.com/topics/clinical/heart-failure/fda-approves-bayers-finerenone-treat-wide-range-heart-failure-patients
  variants:
  - hfpef
  effect: small
  effect_note: Already approved; it lowers worsening events in HF with preserved or mildly reduced ejection
    but does not cure it.
- name: Aficamten (cardiac myosin inhibitor)
  stage: Phase 3
  note: ACACIA-HCM improved symptoms and exercise in nonobstructive HCM, a cause of HF.
  url: https://www.consultantlive.com/view/european-society-of-cardiology-2026-preview-6-trials-to-know
  variants:
  - hfpef
  effect: small
  effect_note: If approved for nonobstructive HCM, it would ease symptoms in one cause of heart failure,
    a small share of patients.
- name: Ziltivekimab (Novo Nordisk, anti-IL-6) HERMES
  stage: Phase 3
  note: Outcome trial in HFpEF/HFmrEF with systemic inflammation; results expected in the first half of
    2027, after the related ZEUS trial failed.
  url: https://european-biotechnology.com/?p=21368
  variants:
  - hfpef
  expected: '2027'
  effect: small
  effect_note: If positive, an anti-inflammatory shot would cut heart failure events in inflamed HFpEF
    patients, but it would control rather than cure the disease.
recent:
- date: 2026-05
  text: Aficamten met endpoints in nonobstructive hypertrophic cardiomyopathy in the ACACIA-HCM trial.
  url: https://www.consultantlive.com/view/european-society-of-cardiology-2026-preview-6-trials-to-know
- date: 2025-10
  text: AB-1002 gene therapy showed 12-month safety and efficacy signals in Nature Medicine.
  url: https://www.indianpharmapost.com/biotech/lite/askbios-gene-therapy-shows-promising-12-month-results-for-heart-failure-18088
next_milestone: null
ai:
  impact: some
  note: AI-ECG algorithms that flag low ejection fraction are cleared by the FDA and help find patients
    earlier.
markets: []
