# Cure Watch disease record. Field guide: CONTRIBUTING.md. Sources live in research.md.
id: rett-syndrome
name: "Rett syndrome"
category: genetic
tracking: proposed
summary: "A rare genetic brain disorder, almost always in girls, that takes away speech, hand use and walking after early childhood."
toll:
  text: "About 1 in 10,000 girls by age 12 in the US (BMC Neurology, 2023)."
  url: https://bmcneurol.biomedcentral.com/articles/10.1186/s12883-023-03181-y/tables/2
status:
  level: 1
  why: "One approved drug eases some symptoms, but nothing restores lost abilities yet."
  today: "Trofinetide (Daybue), approved in 2023, modestly improves some symptoms. Physical, speech and seizure treatments help day to day. Gene therapies that add a working MECP2 gene are in pivotal trials."
  last_reviewed: null
treatment:
  best:
  - "Trofinetide (Daybue)"
  - "Seizure medicines and therapy"
  burden: heavy
  burden_note: "Lifelong care needs; trofinetide is taken twice daily and often causes diarrhea."
forecast:
  bottleneck: trial-limited
pipeline:
- name: "TSHA-102 (Taysha)"
  stage: "Phase 3"
  note: "One-time gene therapy given into the spinal fluid; all 10 early-trial patients gained at least one milestone, and the pivotal part began dosing in January 2026."
  url: https://www.neurologylive.com/view/taysha-doses-first-patient-pivotal-trial-rett-syndrome-gene-therapy-tsha-102-aligns-fda-bla-plans
  effect: big
  effect_note: "Could restore some lost skills, moving Rett toward level 3."
- name: "NGN-401 (Neurogene)"
  stage: "Phase 3"
  note: "Gene therapy with a built-in dose control circuit; its registrational trial was fully enrolled by March 2026."
  url: https://www.rettsyndrome.org/about-rett-syndrome/pipeline/
  effect: big
  effect_note: "A second gene therapy would widen access."
recent:
- date: "2026-10"
  text: "Taysha reported that all 10 patients in the early part of its TSHA-102 trial gained or regained a developmental milestone."
  url: https://www.neurologylive.com/view/tsha-102-multidomain-functional-gains-rett-syndrome
next_milestone: null
markets: []
