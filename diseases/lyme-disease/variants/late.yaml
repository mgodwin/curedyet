  low: 2030
  high: 2075
  p2035: 30
  p2045: 58
  note: The infection already clears with a month of pills in most people; mild treatment for most would
    need tests that confirm the bacteria are gone, to avoid repeat and IV courses, and better treatment
    for the immune-driven arthritis that persists afterwards. Earlier diagnosis would also shrink this group.
reached:
  year: 1994
  basis: 'Approximate: by the mid-1990s trials showed a month of oral doxycycline or amoxicillin usually
    resolved Lyme arthritis, with IV antibiotics for those who did not respond.'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11322885/
