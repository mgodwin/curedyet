# Cure Watch disease record. Field guide: CONTRIBUTING.md. Sources live in research.md.
id: smallpox
name: Smallpox
category: infectious
tracking: active
summary: A deadly viral disease that the world eradicated, declared gone in 1980.
toll:
  text: Over 10 million cases and 2 million deaths in 43 countries in 1967; the last natural case was
    in Somalia in 1977 (WHO).
  url: https://www.who.int/news/item/17-05-2010-statue-commemorates-smallpox-eradication
status:
  level: 5
  why: 'Eradicated: the World Health Assembly declared smallpox gone in 1980, and no natural case has
    occurred since 1977.'
  today: No one has caught smallpox naturally since 1977. Two antivirals, tecovirimat (2018) and brincidofovir
    (2021), are approved in case it returns, but only on animal data. Vaccines given within 2 to 3 days
    of exposure can prevent or lessen disease.
  last_reviewed: '2026-11-22'
treatment:
  best:
  - Vaccination (led to eradication)
  - Tecovirimat
  - Brincidofovir
  burden_note: No treatment is needed because the disease no longer occurs; the stockpiled antivirals
    are untested in sick people.
forecast:
  reached: 1980
  faster_note: "Already eradicated."
  outlook: "Smallpox was eradicated: WHO declared it gone in 1980. Two antivirals and vaccines are stockpiled in case it returns."
