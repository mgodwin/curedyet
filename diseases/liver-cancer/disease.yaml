  url: https://www.onclive.com/view/elevar-resubmits-nda-for-rivoceranib-plus-camrelizumab-frontline-unresectable-metastatic-hcc
  what: Expected FDA decision on the resubmitted rivoceranib plus camrelizumab NDA (estimate based on
