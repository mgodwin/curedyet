# Cure Watch disease record. Field guide: CONTRIBUTING.md. Sources live in research.md.
id: liver-cancer
name: Liver cancer
category: cancer
tracking: active
summary: Primary cancer of the liver, mostly hepatocellular carcinoma, usually driven by hepatitis B or
  C, alcohol or fatty liver disease.
toll:
  text: About 843,000 new cases and 732,000 deaths worldwide (2024, GLOBOCAN); about 42,340 US cases and
    30,980 US deaths expected in 2026.
  url: https://ascopost.com/news/july-2026/american-cancer-society-reports-latest-global-cancer-statistics/
status:
  level: 3
  why: Small tumors found early can be cured by resection, ablation or transplant, but most patients are
    diagnosed too late for that.
  today: Overall US 5-year survival is about 22%, ranging from 37% for localized to 3% for distant disease.
    Early tumors are cured by surgery, ablation or liver transplant. Advanced disease is treated with
    immunotherapy combinations like atezolizumab plus bevacizumab or durvalumab plus tremelimumab, which
    extend survival but rarely cure.
  groups:
  - name: Stage I
    what: A single tumor in the liver that has not grown into blood vessels or spread.
    level: 3
    burden: heavy
    survival: ~50% alive at 4 years (net survival, all primary liver cancer, England)
    note: Small tumors can be removed by surgery, destroyed by ablation through a needle, or cured by a
      liver transplant. Whether cure is possible depends mostly on how well the rest of the liver works
      (BCLC very early or early stage, and transplant criteria), and the cancer often returns in a cirrhotic
      liver.
    caveat: Only 4-year figures are published by stage, and they cover all primary liver cancer, not hepatocellular
      carcinoma alone. ACS reports 60-70% 5-year survival after transplant for early disease.
    url: https://www.cancerresearchuk.org/about-cancer/liver-cancer/survival
    forecast:
      median: 2045
      low: 2031
      high: 2085
      p2035: 22
      p2045: 50
      note: Surgery, ablation or transplant can remove small tumors, but the cancer often returns in a damaged
        liver, so this needs a treatment that prevents new tumors after surgery plus wider transplant access.
        Adjuvant immunotherapy trials are the nearest candidates, but the first one (atezolizumab plus bevacizumab)
        lost its early benefit on longer follow-up.
  - name: Stage II
    what: A single tumor that has grown into blood vessels, or several small tumors, all within the liver.
    level: 3
    burden: heavy
    survival: ~35% alive at 4 years (net survival, all primary liver cancer, England)
    note: Some can be cured by surgery or a transplant if they meet transplant size and number limits; others
      get repeated treatment that blocks the tumor's blood supply (TACE), which controls but does not usually
      cure.
    caveat: 4-year figures for all primary liver cancer, not hepatocellular carcinoma alone. AJCC stage
      maps loosely onto the BCLC system doctors use to decide treatment.
    url: https://www.cancerresearchuk.org/about-cancer/liver-cancer/survival
    forecast:
      median: 2052
      low: 2036
      high: 2095
      p2035: 10
      p2045: 30
      note: Many tumors at this stage fall outside surgery and transplant limits and get TACE, which controls
        but rarely cures, so this needs systemic drugs strong enough to shrink tumors into curable range
        for most. Combinations of TACE with immunotherapy are the nearest candidates and have improved control
        in Phase 3 trials, without showing cures.
  - name: Stage III
    what: Large or multiple tumors, or cancer that has grown into a major vein of the liver or nearby organs,
      without distant spread.
    level: 1
    burden: heavy
    survival: ~10% alive at 4 years (net survival, all primary liver cancer, England)
    note: Usually TACE or radiation directed at the liver, or ongoing immunotherapy combinations such as
      atezolizumab plus bevacizumab. These extend life but rarely cure.
    caveat: 4-year figures for all primary liver cancer, not hepatocellular carcinoma alone.
    url: https://www.cancerresearchuk.org/about-cancer/liver-cancer/survival
    forecast:
      median: 2066
      low: 2042
      high: 2100
      p2035: 2
      p2045: 12
      note: This needs systemic or liver-directed treatment that clears large or vessel-invading tumors
        for good, which current options do not do. Immunotherapy combinations and conversion to surgery
        are the nearest candidates, helping a minority.
  - name: Stage IV
    what: The cancer has spread to lymph nodes or distant organs such as the lungs or bones.
    level: 1
    burden: heavy
    survival: ~5% alive at 4 years (net survival, all primary liver cancer, England); US SEER distant stage
      3% at 5 years
    note: Ongoing immunotherapy combinations or targeted pills extend survival by months to a few years,
      with immune side effects and, for bevacizumab, bleeding risk. Cure is very rare.
    caveat: 4-year figures for all primary liver cancer, not hepatocellular carcinoma alone.
    url: https://www.cancerresearchuk.org/about-cancer/liver-cancer/survival
    forecast:
      median: 2072
      low: 2046
      high: 2100
      p2035: 1
      p2045: 7
      note: Cure is very rare today, so this would need entirely new drugs that eradicate spread liver cancer
        in patients who often also have cirrhosis. Current immunotherapy combinations extend life by months
        to a few years.
  last_reviewed: '2026-11-03'
treatment:
  best:
  - Resection, ablation or liver transplant
  - Atezolizumab plus bevacizumab
  - Durvalumab plus tremelimumab (STRIDE)
  - Nivolumab plus ipilimumab
  - TACE for intermediate stage
  burden: heavy
  burden_note: Most are diagnosed late and get ongoing immunotherapy infusions with immune side effects
    and bleeding risk from bevacizumab; curative options require resection, ablation or a scarce transplant.
forecast:
  bottleneck: design-limited
  normal:
    p2035: 5
    p2045: 18
    median: 2058
    low: 2040
    high: 2100
  faster:
    p2035: 10
    p2045: 35
    median: 2048
    low: 2037
    high: 2085
  faster_note: Better systemic drugs plus wider surveillance of at-risk livers would shift diagnoses to
    curable stages, but that depends on reaching patients, so the lift is moderate and mostly after 2035.
  outlook: The fastest gains will come from prevention (hepatitis B vaccination, hepatitis C cure, fatty
    liver treatment) and surveillance that catches tumors while they are curable. Systemic therapy keeps
    improving by a few months per generation. Curing most patients requires moving most diagnoses to early
    stage, which is unlikely by 2035.
pipeline:
- name: Rivoceranib plus camrelizumab
  note: OS 23.8 vs 15.2 months vs sorafenib in CARES-310; resubmitted Oct 9, 2026 after a third manufacturing-related
    CRL.
  stage: Filed
  url: https://www.onclive.com/view/elevar-resubmits-nda-for-rivoceranib-plus-camrelizumab-frontline-unresectable-metastatic-hcc
- name: STRIDE plus lenvatinib plus TACE (EMERALD-3)
  note: Improved PFS to 13.0 vs 9.8 months vs TACE alone; OS not yet significant.
  stage: Phase 3
  url: https://www.astrazeneca.com/media-centre/press-releases/2026/imfinzi-plus-imjudo-combined-with-lenvatinib-and-tace-reduced-the-risk-of-disease-progression-or-death-in-emerald-3-phase-iii-trial.html
- name: AI-designed CDK20 inhibitor (Insilico/U of Toronto)
  note: Designed with AlphaFold structures and generative chemistry in about 30 days.
  stage: Preclinical
  url: https://acceleration.utoronto.ca/news/new-study-uses-alphafold-and-ai-to-accelerate-design-of-novel-drug-for-liver-cancer
recent:
- date: 2026-06
  text: EMERALD-3 showed adding immunotherapy and lenvatinib to TACE cut progression risk by 30% in intermediate-stage
    disease.
  url: https://www.astrazeneca.com/media-centre/press-releases/2026/imfinzi-plus-imjudo-combined-with-lenvatinib-and-tace-reduced-the-risk-of-disease-progression-or-death-in-emerald-3-phase-iii-trial.html
- date: 2026-07
  text: FDA rejected rivoceranib plus camrelizumab a third time over a factory inspection, not efficacy;
    the issue was later closed.
  url: https://www.cancernetwork.com/view/fda-clears-manufacturing-concern-behind-rivoceranib-camrelizumab-crl-in-hcc
next_milestone:
