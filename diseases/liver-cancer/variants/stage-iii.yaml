# Cure Watch variant record: one stage or type of Liver cancer. Field guide: CONTRIBUTING.md.
id: stage-iii
name: Stage III
order: 3
what: Large or multiple tumors, or cancer that has grown into a major vein of the liver or nearby organs,
  without distant spread.
level: 1
burden: heavy
survival: ~10% alive at 4 years (net survival, all primary liver cancer, England)
treatment: Usually TACE or radiation directed at the liver, or ongoing immunotherapy combinations such
  as atezolizumab plus bevacizumab. These extend life but rarely cure.
caveat: 4-year figures for all primary liver cancer, not hepatocellular carcinoma alone.
url: https://www.cancerresearchuk.org/about-cancer/liver-cancer/survival
forecast:
  median: 2066
  low: 2042
  high: 2100
  p2035: 2
  p2045: 12
  note: This needs systemic or liver-directed treatment that clears large or vessel-invading tumors for
    good, which current options do not do. Immunotherapy combinations and conversion to surgery are the
    nearest candidates, helping a minority.
