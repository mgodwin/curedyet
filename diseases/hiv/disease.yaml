# Cure Watch disease record. Field guide: CONTRIBUTING.md. Sources live in research.md.
id: hiv
name: HIV/AIDS
category: infectious
tracking: active
summary: A viral infection that attacks immune cells and, untreated, leads to AIDS.
toll:
  text: 41.0M people living with HIV, 1.2M new infections and 570,000 AIDS-related deaths in 2025 (UNAIDS)
  url: https://www.unaids.org/sites/default/files/2026-07/2026_UNAIDS_Global_HIV_Factsheet_en.pdf
  ratio: "About 1 in 200"
  ratio_caption: "people worldwide is living with HIV"
  ratio_url: https://www.unaids.org/sites/default/files/2026-07/2026_UNAIDS_Global_HIV_Factsheet_en.pdf
  ratio_basis: "Derived: UNAIDS 2026 fact sheet's 41.0 million living with HIV in 2025 divided by UN world population of 8.2 billion in 2024 (https://www.un.org/sustainabledevelopment/blog/2024/07/press-release-wpp2024/)."
status:
  level: 2
  why: Antiretroviral therapy gives near-normal life expectancy and stops transmission, but must be taken
    for life; cures have only come from rare stem cell transplants.
  today: Daily pills or long-acting injections keep the virus undetectable, and 32.1M people (78%) were
    on treatment in 2025, so about 1 in 5 people with HIV were not. Twice-yearly lenacapavir injections
    prevent HIV in at least 96% of cases and are rolling out in Africa. Antibody combinations can hold
    the virus off without drugs for some people in trials, but no cure is ready.
  last_reviewed: '2026-11-09'
treatment:
  best:
  - Single-tablet ART (e.g. bictegravir/FTC/TAF)
  - Long-acting cabotegravir/rilpivirine injections
  - Twice-yearly lenacapavir PrEP (Yeztugo)
  - Oral PrEP
  burden: moderate
  burden_note: Lifelong daily single-tablet ART or bimonthly injections is well tolerated with few side
    effects, but requires regular viral load monitoring and strict adherence.
forecast:
  bottleneck: design-limited
  normal:
    p2035: 4
    p2045: 20
    median: 2052
    low: 2038
    high: 2090
  faster:
    p2035: 8
    p2045: 45
    median: 2045
    low: 2035
    high: 2075
  faster_note: AI-designed antibody combinations and gene editors that clear or silence the reservoir
    would be the key change, with a big lift by 2045 but little by 2035 because drug-free remission is
    still in Phase 2.
  outlook: Control and prevention keep getting easier, with weekly pills and twice-yearly shots. A cure
    for most requires clearing or permanently silencing the latent reservoir. Antibody and gene-editing
    approaches show partial remission, but none is close to routine use. Funding cuts in 2025-26 also
    threaten progress.
pipeline:
- name: Once-weekly oral lenacapavir PrEP
  note: FDA decision due Feb 2, 2027.
  stage: Filed
  url: https://patientworthy.com/2026/06/18/fda-reviews-gileads-once-weekly-oral-lenacapavir-for-hiv-prevention/
- name: Islatravir/lenacapavir once-weekly oral treatment
  note: Both ISLEND trials met non-inferiority at week 48; filing planned.
  stage: Phase 3
  url: https://www.gilead.com/news/news-details/2026/gilead-and-merck-announce-positive-topline-results-from-two-phase-3-studies-evaluating-islatravirlenacapavir-an-oral-once-weekly-hiv-treatment
- name: Dual broadly neutralizing antibodies (RIO study)
  note: A second bNAb course halved viral rebound off ART; aims at drug-free remission.
  stage: Phase 2
  url: https://i-base.info/htb/53678
- name: Twice-yearly lenacapavir PrEP
  note: FDA approved in 2025; Global Fund and US target 3M people by 2028.
  stage: Approved 2025-26
  url: https://unaids.org/en/resources/presscentre/pressreleaseandstatementarchive/2026/april/20260415_lenacapavir_expanded_rollout
