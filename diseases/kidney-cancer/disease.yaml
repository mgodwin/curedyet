# Cure Watch disease record. Field guide: CONTRIBUTING.md. Sources live in research.md.
id: kidney-cancer
name: Kidney cancer
category: cancer
tracking: active
summary: Cancer that starts in the kidney, about 9 in 10 of them renal cell carcinoma, often found by
  chance on a scan done for something else.
toll:
  text: About 443,000 new cases and 145,000 deaths/yr worldwide (2024); ~80,450 US cases and ~15,160 US
    deaths est. 2026 (including renal pelvis cancers), with US death rates falling about 1.1% a year.
  url: https://seer.cancer.gov/statfacts/html/kidrp.html
  ratio: "About 1 in 56"
  ratio_caption: "Americans will be diagnosed with kidney or renal pelvis cancer in their lifetime"
  ratio_url: https://seer.cancer.gov/statfacts/html/kidrp.html
  ratio_basis: "NCI SEER Cancer Stat Facts: about 1.8% of men and women diagnosed in their lifetime (2021-2023 data); 1.8% is about 1 in 56."
status:
  level: 3
  why: Surgery cures most cancers still confined to the kidney, but about 79% of Americans with kidney
    cancer are alive at 5 years overall, and spread disease is cured only in a small minority.
  today: About two in three kidney cancers are found while still confined to the kidney, and removing
    part or all of the kidney cures most of them; small masses can instead be watched with scans or destroyed
    with freezing or heat. After surgery for higher-risk clear cell cancer, a year of pembrolizumab cuts
    relapse and lengthened survival in KEYNOTE-564, and belzutifan was added to it in 2026. For spread
    disease, immunotherapy combinations such as nivolumab with ipilimumab or pembrolizumab with axitinib
    or lenvatinib extend life by years for many, and about 1 in 10 have complete responses that can last,
    but most still progress.
  last_reviewed: '2026-11-05'
treatment:
  best:
  - Partial or radical nephrectomy
  - Active surveillance or ablation for small masses
  - Adjuvant pembrolizumab, with or without belzutifan, for higher-risk clear cell cancer
  - Nivolumab plus ipilimumab, or pembrolizumab plus axitinib or lenvatinib, for advanced disease
  - Belzutifan, alone or with lenvatinib, after immunotherapy
  burden: heavy
  burden_note: Most people have kidney surgery, sometimes removing the whole kidney with a lasting loss
    of kidney function; higher-risk cancers add a year of immunotherapy, and advanced disease means
    ongoing drug treatment with immune and other side effects.
forecast:
  bottleneck: design-limited
  normal:
    p2035: 25
    p2045: 52
    median: 2044
    low: 2031
    high: 2075
  faster:
    p2035: 33
    p2045: 68
    median: 2039
    low: 2030
    high: 2062
  faster_note: Faster discovery and trials of drugs that turn more immunotherapy responses into lasting
    complete responses would matter most, since local disease is already mostly cured.
  outlook: Kidney cancer sits just below the cured-for-most line because most cases are caught on scans
    while still in the kidney and cured by surgery. Adjuvant immunotherapy is starting to lower relapse
    after surgery, but the 2026 failure of a triplet in first-line advanced disease shows that adding
    drugs does not easily raise the share of lasting remissions. Cures for spread disease remain the
    main gap.
pipeline:
- name: Adjuvant pembrolizumab (KEYNOTE-564)
  stage: Approved
  note: FDA-approved Nov 2021; a year of pembrolizumab after surgery cut the risk of death by 38% (HR
    0.62), with 4-year survival 91.2% vs 86.0%.
  url: https://ascopost.com/issues/may-25-2024/keynote-564-adjuvant-pembrolizumab-improves-overall-survival-vs-placebo-in-renal-cell-carcinoma
  variants:
  - stage-ii
  - stage-iii
  effect: some
  effect_note: Already approved; it raises cure rates for higher-risk clear cell cancer by a few points,
    nudging stage II and III toward the 85% line.
- name: Adjuvant belzutifan plus pembrolizumab (LITESPARK-022)
  stage: Approved 2025-26
  note: FDA-approved Jun 2026 for intermediate-high or high-risk clear cell cancer; adding belzutifan
    cut recurrence or death by 28% (HR 0.72) versus pembrolizumab alone; survival data not yet mature.
  url: https://www.fda.gov/drugs/resources-information-approved-drugs/fda-approves-belzutifan-pembrolizumab-adjuvant-treatment-renal-cell-carcinoma
  variants:
  - stage-ii
  - stage-iii
  - stage-iv
  effect: some
  effect_note: Already approved; if survival follows the drop in relapse, it could add several more
    points of cure after surgery, though it adds a year of a daily pill that causes anemia.
- name: Belzutifan plus lenvatinib (LITESPARK-011)
  stage: Approved 2025-26
  note: FDA-approved Sept 2026 after immunotherapy; median progression-free survival 14.6 vs 10.6 months
    versus cabozantinib, with no significant survival gain.
  url: https://www.targetedonc.com/view/fda-approves-belzutifan-lenvatinib-advanced-ccrcc
  variants:
  - stage-iv
  effect: small
  effect_note: Already approved; it delays progression by a few months after immunotherapy but does
    not cure.
- name: Zanzalintinib plus nivolumab for non-clear cell cancer (STELLAR-304)
  stage: Phase 3
  note: Exelixis's trial versus sunitinib in untreated advanced non-clear cell kidney cancer; topline
    results guided for the second half of 2026.
  url: https://www.sec.gov/Archives/edgar/data/0000939767/000093976726000058/exel20260331exhibit991.htm
  variants:
  - stage-iv
  expected: '2026-12'
  effect: small
  effect_note: A win would give the rarer non-clear cell types, which respond poorly to current drugs,
    a better first treatment, but it is unlikely to cure most.
- name: Casdatifan plus cabozantinib (PEAK-1)
  stage: Phase 3
  note: Arcus's next-generation HIF-2 alpha inhibitor versus placebo, both with cabozantinib, in about
    720 people with advanced clear cell cancer after immunotherapy.
  url: https://www.urotoday.com/conference-highlights/asco-2026/asco-2026-kidney-cancer/169374-asco-2026-peak-1-a-randomized-double-blind-active-control-multicenter-phase-3-trial-of-casdatifan-and-cabozantinib-versus-placebo-and-cabozantinib-in-patients-with-advanced-clear-cell-rcc.html
  variants:
  - stage-iv
  effect: small
  effect_note: At best a better later-line option that delays progression.
recent:
- date: 2026-09
  text: FDA approved belzutifan plus lenvatinib for advanced clear cell kidney cancer after immunotherapy.
  url: https://www.targetedonc.com/view/fda-approves-belzutifan-lenvatinib-advanced-ccrcc
- date: 2026-06
  text: FDA approved belzutifan plus pembrolizumab after surgery for clear cell kidney cancer at higher
    risk of relapse.
  url: https://www.fda.gov/drugs/resources-information-approved-drugs/fda-approves-belzutifan-pembrolizumab-adjuvant-treatment-renal-cell-carcinoma
- date: 2026-04
  text: LITESPARK-012 found that adding belzutifan or quavonlimab to pembrolizumab plus lenvatinib did
    not improve progression-free or overall survival in untreated advanced clear cell kidney cancer.
  url: https://www.cancernetwork.com/view/litespark-012-trial-does-not-meet-primary-end-point-for-advanced-rcc-group
next_milestone:
  date: '2026-12'
  url: https://www.sec.gov/Archives/edgar/data/0000939767/000093976726000058/exel20260331exhibit991.htm
  what: Expected topline results of STELLAR-304, zanzalintinib plus nivolumab for advanced non-clear cell
    kidney cancer (guided for the second half of 2026).
ai:
  impact: low
  note: Deep learning models can help tell benign from malignant small kidney masses on CT in research
    studies, which could spare some people surgery, but they are not yet standard care.
