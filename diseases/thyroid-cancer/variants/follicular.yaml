id: follicular
name: Follicular
order: 2
what: The second most common type.
level: 4
burden: moderate
burden_why: Surgery, often radioactive iodine, and thyroid hormone pills.
survival: 98% alive at 5 years, all stages (SEER relative survival, diagnosed 2015-2021)
share: About 1 in 10 thyroid cancers
share_url: https://www.cancer.org/cancer/thyroid-cancer/about/what-is-thyroid-cancer.html
treatment: Surgery, often with radioactive iodine. Most are cured.
url: https://www.cancer.org/cancer/thyroid-cancer/detection-diagnosis-staging/survival-rates.html
caveat: The reached year is a lower bound from all-type data.
reached:
  year: 1975
  basis: 'No later than 1975: US 5-year survival for all thyroid cancers diagnosed in 1975-77 was 92%,
