id: medullary
name: Medullary
order: 3
what: A type that starts in the thyroid's C cells and can run in families.
level: 4
burden: moderate
burden_why: Surgery to remove the thyroid and nearby nodes.
survival: 93% alive at 5 years, all stages (SEER relative survival, diagnosed 2015-2021)
share: Under 5% of thyroid cancers
share_url: https://www.cancer.org/cancer/thyroid-cancer/about/what-is-thyroid-cancer.html
treatment: Surgery. Most are cured, though survival falls to 50% once it has spread far.
url: https://www.cancer.org/cancer/thyroid-cancer/detection-diagnosis-staging/survival-rates.html
caveat: The reached year is only a lower bound; it is likely much earlier.
