# Cure Watch disease record. Field guide: CONTRIBUTING.md. Sources live in research.md.
id: thyroid-cancer
name: Thyroid cancer
category: cancer
tracking: proposed
summary: Cancer that starts in the thyroid gland in the neck.
status:
  level: 4
  why: About 9 in 10 thyroid cancers are papillary or follicular, and over 98% of those patients are alive
    at 5 years.
  today: Most thyroid cancers are treated with surgery, with radioactive iodine for some. Five-year survival
    is over 99% for papillary, 98% for follicular and 93% for medullary cancer, but only 10% for the rare
    anaplastic type.
  last_reviewed: null
treatment:
  best:
  - Surgery
  - Radioactive iodine
  burden: moderate
  burden_note: Surgery, sometimes radioactive iodine, and often lifelong thyroid hormone pills.
forecast:
  bottleneck: biology-limited
