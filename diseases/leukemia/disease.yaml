# Cure Watch disease record. Field guide: CONTRIBUTING.md. Sources live in research.md.
id: leukemia
name: Leukemias
category: cancer
tracking: active
summary: Blood cancers of the bone marrow, including AML, ALL, CLL and CML.
toll:
  text: ~67,790 US cases and ~23,910 US deaths est. 2026; global figures not given in ACS 2026 summary.
  url: https://www.cancer.org/content/dam/cancer-org/research/cancer-facts-and-statistics/annual-cancer-facts-and-figures/2026/2026-cancer-facts-and-figures.pdf
status:
  level: 3
  why: Childhood ALL and APL are cured in most patients and CML is well controlled, but AML in older adults
    and relapsed disease are usually fatal.
  today: About 90% of children with ALL are cured, and CML patients on tyrosine kinase inhibitors live
    near-normal lives. CLL is controlled for years with BTK inhibitors and venetoclax, now including an
    all-oral fixed-duration regimen. AML remains the hardest, with cure mostly limited to younger fit
    patients who get intensive chemo or a transplant, though menin and other targeted inhibitors are adding
    options.
  groups:
  - name: Childhood ALL
    what: A fast-growing cancer of immature white blood cells (lymphocytes), the most common cancer in children.
    level: 4
    burden: heavy
    survival: ~90% of children alive at 5 years (ACS)
    share: About half of ALL cases are in people under 20 (SEER 2019-2023)
    note: Treatment is about two to three years of multi-drug chemotherapy, intense in the first months,
      with infection risk and possible long-term effects. Most children are cured; CAR-T or transplant is
      used for relapse.
    caveat: Age share is from SEER ALL Cancer Stat Facts (https://seer.cancer.gov/statfacts/html/alyl.html).
    url: https://www.cancer.org/cancer/types/leukemia-in-children/detection-diagnosis-staging/survival-rates.html
  - name: Adult ALL
    what: The same fast-growing cancer of immature lymphocytes, but in adults, where it is harder to cure.
    level: 3
    burden: heavy
    survival: ~40% long-term disease-free survival with intensive chemotherapy (NCI PDQ); 60-80% reach remission
    note: Adults get intensive multi-drug chemotherapy for two to three years, often a stem cell transplant,
      and newer antibody drugs or CAR-T, with serious infection and organ risks. A meaningful minority are
      cured, more so in younger adults and with targeted drugs for Philadelphia-positive disease.
    caveat: No current SEER or ACS 5-year survival figure for adults only was found; outcomes fall steeply
      with age, and the PDQ figure may understate gains from blinatumomab, inotuzumab and pediatric-style
      regimens.
    url: https://www.cancer.gov/types/leukemia/hp/adult-all-treatment-pdq
    forecast:
      median: 2037
      low: 2030
      high: 2058
      p2035: 42
      p2045: 70
      note: Adding blinatumomab, inotuzumab and earlier CAR-T to first-line care is already raising long-term
        survival; level 4 needs these to push cure rates above half across most adult ages, with older adults
        the hardest part.
  - name: APL
    what: Acute promyelocytic leukemia, a rare type of acute myeloid leukemia driven by one specific gene
      fusion that targeted drugs can switch off.
    level: 4
    burden: moderate
    survival: ~99% alive and ~97% event-free at about 4 years with ATRA plus arsenic trioxide (APL0406 trial,
      low/intermediate-risk patients)
    note: Standard care is a vitamin A-derived drug (ATRA) plus arsenic trioxide for about eight months,
      usually with no traditional chemotherapy, and it cures nearly everyone who gets through the first
      weeks. The early weeks carry a real risk of fatal bleeding and a serious reaction called differentiation
      syndrome, so it needs urgent hospital care.
    caveat: 'Trial figures exclude high-risk patients and early deaths before treatment; population studies
      show more early deaths, so real-world cure rates are lower than the trial''s. Burden is a judgment
      call: chemo-free but intensive and hospital-based at the start.'
    url: https://ascopost.com/issues/february-10-2017/retinoic-acid-and-arsenic-trioxide-vs-retinoic-acid-and-chemotherapy-in-apl/
  - name: AML (other)
    what: Acute myeloid leukemia, a fast-growing cancer of immature blood-forming cells in the bone marrow,
      mostly in older adults.
    level: 3
    burden: heavy
    survival: ~33% alive at 5 years (SEER 5-year relative survival, all AML, 2016-2022)
    share: ~22,720 US cases est. 2026 (SEER), median age 70
    note: Fit patients get intensive chemotherapy and often a stem cell transplant, with high risks of infection
      and death from treatment; older or frail patients usually get gentler venetoclax-based treatment that
      controls it for a time. Cure is mainly reached in younger, fitter patients and in favorable genetic
      subtypes.
    caveat: The SEER figure includes APL, so non-APL AML survival is somewhat lower.
    url: https://seer.cancer.gov/statfacts/html/amyl.html
    forecast:
      median: 2048
      low: 2036
      high: 2085
      p2035: 12
      p2045: 42
      note: Older and frail patients would need a cure that does not depend on intensive chemo or transplant,
        for example menin, FLT3 or IDH inhibitor combinations that clear disease for good; current gentler
        regimens mostly control it for a time.
  - name: CML
    what: Chronic myeloid leukemia, a slow-growing marrow cancer caused by one gene fusion (BCR-ABL) that
      daily pills can block.
    level: 2
    burden: moderate
    survival: ~71% alive at 5 years (SEER 5-year relative survival, 2016-2022)
    share: ~9,650 US cases est. 2026 (SEER), median age 67
    note: Patients take a daily tyrosine kinase inhibitor pill with regular blood tests, usually for life,
      with manageable side effects like fatigue and cramps. Most live near-normal lives, and some in deep
      remission can stop treatment, but it is controlled rather than cured.
    caveat: Population figure is lower than trial results for chronic-phase patients on TKIs, likely reflecting
      older patients, advanced-phase cases and access gaps.
    url: https://seer.cancer.gov/statfacts/html/cmyl.html
    forecast:
      median: 2043
      low: 2033
      high: 2075
      p2035: 18
      p2045: 52
      note: Most patients would need to reach deep enough remission to stop pills for good; earlier use
        of asciminib and newer combinations could raise treatment-free remission from a minority to a majority,
        but that takes years of follow-up to prove.
  - name: CLL
    what: Chronic lymphocytic leukemia, a slow-growing cancer of mature lymphocytes, the most common leukemia
      in adults.
    level: 2
    burden: moderate
    survival: ~90% alive at 5 years (SEER 5-year relative survival, 2016-2022)
    share: ~22,760 US cases est. 2026 (SEER), median age 71
    note: Many people are just watched for years; when treatment is needed it is usually ongoing BTK inhibitor
      pills or a fixed course of venetoclax-based pills or infusions, with side effects like bleeding, heart
      rhythm problems or infections. It is well controlled for years but almost always comes back, so it
      is not cured.
    url: https://seer.cancer.gov/statfacts/html/clyl.html
    forecast:
      median: 2046
      low: 2035
      high: 2085
      p2035: 13
      p2045: 46
      note: Fixed-duration pill combinations give long remissions but the disease nearly always returns;
        level 4 would need regimens that clear it for good in most older patients, such as deeper MRD-guided
        combinations, bispecifics or simpler cell therapies.
  last_reviewed: '2026-11-03'
treatment:
  best:
  - Multi-agent chemotherapy for childhood ALL
  - Tyrosine kinase inhibitors for CML
  - BTK inhibitors and venetoclax for CLL
  - Venetoclax with hypomethylating agents for older AML
  - Allogeneic stem cell transplant and CAR-T for ALL
  burden: heavy
  burden_note: Childhood ALL needs about 2-3 years of multi-agent chemo and AML needs intensive chemo
    or transplant with infection and organ risks; CML and CLL use lifelong or fixed-duration oral drugs.
forecast:
  bottleneck: design-limited
  normal:
    p2035: 10
    p2045: 40
    median: 2048
    low: 2036
    high: 2078
  faster:
    p2035: 22
    p2045: 62
    median: 2042
    low: 2034
    high: 2063
  faster_note: Faster design and testing of menin inhibitors, fixed-duration CLL regimens and cheaper
    CAR-T could raise cure rates in older AML patients, the main holdout, giving a solid lift since many
    candidates already exist.
  outlook: 'Leukemia is a mix: some types are already cured for most and others are controlled, so the
    bar hinges on AML and CLL. Menin inhibitors and fixed-duration CLL regimens could raise cure or deep-remission
    rates, but older AML patients remain the bottleneck. Wider CAR-T and bispecific use in adult ALL is
    a further lever. AML and CLL are each about a third of cases, so cured for most waits on at least one of them, which sets this forecast.'
pipeline:
- name: Ziftomenib with 7+3 in new AML (KOMET-007)
  note: Menin inhibitor approved Nov 2025 for relapsed NPM1 AML; frontline combo showed 96% CRc in NPM1-mutant
    patients.
  stage: Phase 3
  url: https://www.delveinsight.com/eha-conference/eha-2026/phase-iii-komet-007-trial
- name: Acalabrutinib plus venetoclax
  note: Approved Feb 19, 2026 as fixed-duration all-oral first-line CLL therapy (AMPLIFY).
  stage: Approved 2025-26
  url: https://www.fda.gov//drugs/resources-information-approved-drugs/fda-approves-acalabrutinib-venetoclax-chronic-lymphocytic-leukemia-or-small-lymphocytic-lymphoma
- name: Oral decitabine-cedazuridine plus venetoclax
  note: Approved May 13, 2026 as an all-oral option for unfit newly diagnosed AML.
  stage: Approved 2025-26
  url: https://www.fda.gov/drugs/resources-information-approved-drugs/fda-approves-oral-combination-decitabine-and-cedazuridine-tablets-venetoclax-newly-diagnosed-acute
- name: Enzomenib
  note: Menin inhibitor given breakthrough designation Oct 2026 for relapsed KMT2A-rearranged acute leukemia.
  stage: Phase 2
  url: https://www.onclive.com/view/fda-flashback-hematologic-cancer-decisions-and-news-from-september-2026
recent:
- date: 2026-02
  text: FDA approved the first all-oral fixed-duration BTK plus BCL2 regimen for untreated CLL.
  url: https://www.fda.gov//drugs/resources-information-approved-drugs/fda-approves-acalabrutinib-venetoclax-chronic-lymphocytic-leukemia-or-small-lymphocytic-lymphoma
- date: 2026-06
  text: KOMET-007 data at EHA showed high MRD-negative remission rates when adding ziftomenib to induction
    chemo in NPM1 and KMT2A AML.
  url: https://www.delveinsight.com/eha-conference/eha-2026/phase-iii-komet-007-trial
- date: 2026-05
  text: An all-oral decitabine-cedazuridine plus venetoclax regimen won approval for older or unfit AML
    patients.
  url: https://www.fda.gov/drugs/resources-information-approved-drugs/fda-approves-oral-combination-decitabine-and-cedazuridine-tablets-venetoclax-newly-diagnosed-acute
