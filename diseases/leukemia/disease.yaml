  url: https://www.hematology.org/meetings/annual-meeting
  what: ASH 2026 Annual Meeting (Dec 12-15, New Orleans) with major AML, ALL and CLL trial data.
ai:
  impact: low
  note: AI helps with flow cytometry and marrow slide analysis, but no AI-discovered leukemia drug is
    near approval.
