# Cure Watch variant record: one stage or type of Leukemias. Field guide: CONTRIBUTING.md.
id: childhood-all
name: Childhood ALL
order: 1
what: A fast-growing cancer of immature white blood cells (lymphocytes), the most common cancer in children.
level: 4
burden: heavy
burden_why: Two to three years of multi-drug chemotherapy, intense at first, with infection risk and possible
  long-term effects.
survival: ~90% of children alive at 5 years (ACS)
share: About 1 in 20 people with leukemia have ALL diagnosed in childhood or the teens; about half of
  all ALL cases
share_url: https://seer.cancer.gov/statfacts/html/alyl.html
treatment: Treatment is about two to three years of multi-drug chemotherapy, intense in the first months,
  with infection risk and possible long-term effects. Most children are cured; CAR-T or transplant is
  used for relapse.
caveat: Age share is from SEER ALL Cancer Stat Facts (https://seer.cancer.gov/statfacts/html/alyl.html).
  About 90% of children survive long term and most are cured with first treatment, meeting the 85% bar,
  though infants do much worse.
url: https://www.cancer.org/cancer/types/leukemia-in-children/detection-diagnosis-staging/survival-rates.html
easy:
  median: 2050
  low: 2035
  high: 2090
  p2035: 6
  p2045: 35
  note: Cure would need a much shorter, gentler course than 2 to 3 years of chemotherapy; adding blinatumomab
    is already raising cure rates, and trials that use it or CAR-T to cut chemotherapy are the nearest
    candidates.
reached:
  year: 2000
  basis: 'Approximate: in Children''s Oncology Group trials 5-year survival rose from 83.7% (1990-94)
    to 90.4% (2000-05), with relapse-free cure near 85% by the early 2000s.'
  url: https://ascopost.com/issues/may-15-2012/study-shows-steady-increases-in-survival-for-children-with-all/
