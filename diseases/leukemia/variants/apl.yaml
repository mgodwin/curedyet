# Cure Watch variant record: one stage or type of Leukemias. Field guide: CONTRIBUTING.md.
id: apl
name: APL
order: 3
what: Acute promyelocytic leukemia, a rare type of acute myeloid leukemia driven by one specific gene
  fusion that targeted drugs can switch off.
level: 4
burden: moderate
survival: ~99% alive and ~97% event-free at about 4 years with ATRA plus arsenic trioxide (APL0406 trial,
  low/intermediate-risk patients)
treatment: Standard care is a vitamin A-derived drug (ATRA) plus arsenic trioxide for about eight months,
  usually with no traditional chemotherapy, and it cures nearly everyone who gets through the first weeks.
  The early weeks carry a real risk of fatal bleeding and a serious reaction called differentiation syndrome,
  so it needs urgent hospital care.
caveat: 'Trial figures exclude high-risk patients and early deaths before treatment; population studies
  show more early deaths, so real-world cure rates are lower than the trial''s. Burden is a judgment call:
  chemo-free but intensive and hospital-based at the start. Nearly all patients who start ATRA plus arsenic
  are cured; including early deaths (about 8% in a whole-population study), real-world cure stays around
  85-90%, a close call that holds.'
url: https://ascopost.com/issues/february-10-2017/retinoic-acid-and-arsenic-trioxide-vs-retinoic-acid-and-chemotherapy-in-apl/
easy:
  median: 2040
  low: 2030
  high: 2070
  p2035: 30
  p2045: 58
  note: The drugs already avoid chemotherapy; this needs the first weeks made safe and simple, through
    faster diagnosis to prevent early bleeding deaths and all-oral arsenic plus ATRA given largely as
    an outpatient.
reached:
  year: 2013
  basis: The APL0406 trial (first published 2013, final results 2016) established ATRA plus arsenic trioxide,
    with about 97% event-free survival, as the chemo-free standard.
