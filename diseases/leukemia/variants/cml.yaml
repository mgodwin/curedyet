# Cure Watch variant record: one stage or type of Leukemias. Field guide: CONTRIBUTING.md.
id: cml
name: CML
order: 5
what: Chronic myeloid leukemia, a slow-growing marrow cancer caused by one gene fusion (BCR-ABL) that
  daily pills can block.
level: 2
burden: moderate
survival: ~71% alive at 5 years (SEER 5-year relative survival, 2016-2022)
share: ~9,650 US cases est. 2026 (SEER), median age 67
treatment: Patients take a daily tyrosine kinase inhibitor pill with regular blood tests, usually for
  life, with manageable side effects like fatigue and cramps. Most live near-normal lives, and some in
  deep remission can stop treatment, but it is controlled rather than cured.
caveat: Population figure is lower than trial results for chronic-phase patients on TKIs, likely reflecting
  older patients, advanced-phase cases and access gaps.
url: https://seer.cancer.gov/statfacts/html/cmyl.html
forecast:
  median: 2043
  low: 2033
  high: 2075
  p2035: 18
  p2045: 52
  note: Most patients would need to reach deep enough remission to stop pills for good; earlier use of
    asciminib and newer combinations could raise treatment-free remission from a minority to a majority,
    but that takes years of follow-up to prove.
