# Cure Watch variant record: one stage or type of Leukemias. Field guide: CONTRIBUTING.md.
id: aml-other
name: AML (other)
order: 4
what: Acute myeloid leukemia, a fast-growing cancer of immature blood-forming cells in the bone marrow,
  mostly in older adults.
level: 3
burden: heavy
survival: ~33% alive at 5 years (SEER 5-year relative survival, all AML, 2016-2022)
share: ~22,720 US cases est. 2026 (SEER), median age 70
treatment: Fit patients get intensive chemotherapy and often a stem cell transplant, with high risks of
  infection and death from treatment; older or frail patients usually get gentler venetoclax-based treatment
  that controls it for a time. Cure is mainly reached in younger, fitter patients and in favorable genetic
  subtypes.
caveat: The SEER figure includes APL, so non-APL AML survival is somewhat lower.
url: https://seer.cancer.gov/statfacts/html/amyl.html
forecast:
  median: 2048
  low: 2036
  high: 2085
  p2035: 12
  p2045: 42
  note: Older and frail patients would need a cure that does not depend on intensive chemo or transplant,
    for example menin, FLT3 or IDH inhibitor combinations that clear disease for good; current gentler
    regimens mostly control it for a time.
