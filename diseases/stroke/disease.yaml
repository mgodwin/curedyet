  url: https://www.businesswire.com/news/home/20260518787299/en/bayer-granted-priority-review-by-u.s.-fda-for-asundexian-in-patients-after-a-non-cardioembolic-ischemic-stroke-or-transient-ischemic-attack/
  what: FDA decision on asundexian for secondary stroke prevention (priority review accepted May 2026;
