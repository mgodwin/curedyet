# Cure Watch variant record: one stage or type of Uterine (endometrial) cancer. Field guide: CONTRIBUTING.md.
id: stage-iii
name: Stage III
order: 3
what: The cancer has spread outside the womb to the ovaries, tubes, vagina, tissue around the womb or
  nearby lymph nodes, but not to the bladder, bowel or distant organs.
level: 3
burden: heavy
burden_why: Surgery is followed by months of chemotherapy, often with radiation, and now often immunotherapy
  for a year or more, with nerve damage, fatigue and immune side effects.
survival: ~50% alive at 5 years (net survival, England 2013-2017)
share: Most of the roughly 18% of US uterine cancers diagnosed after spreading to nearby tissue or lymph
  nodes (SEER 'regional')
share_url: https://seer.cancer.gov/statfacts/html/corp.html
treatment: Hysterectomy with removal of tubes, ovaries and lymph nodes, then carboplatin and paclitaxel
  chemotherapy, radiation or both. Since 2023-24, US approvals let dostarlimab, pembrolizumab or (for
  mismatch repair-deficient tumors) durvalumab be added to chemotherapy for advanced disease, with the
  biggest gains in mismatch repair-deficient tumors.
caveat: 'Rated 3: almost 50% survive 5 years in England (2013-2017), and SEER regional survival is about
  70% (2016-2022). Both predate immunotherapy added to chemotherapy; in NRG-GY018 about 79% of women with
  mismatch repair-deficient advanced disease were alive at 4 years on pembrolizumab, but that trial also
  included recurrent and stage IV disease.'
url: https://www.cancerresearchuk.org/about-cancer/womb-cancer/survival
forecast:
  median: 2055
  low: 2038
  high: 2095
  p2035: 5
  p2045: 25
  note: Immunotherapy has already lifted outcomes for the mismatch repair-deficient minority, but most
    stage III tumors are mismatch repair-proficient, where gains are small, and p53-abnormal tumors relapse
    often. A cure for most would need strong new drugs for those types, such as antibody-drug conjugates
    now being tested.
easy:
  median: 2080
  low: 2050
  high: 2100
  p2035: 1
  p2045: 4
  note: Surgery plus chemotherapy and often radiation is the cure today; a mild cure for most would need
    drugs that replace all three.
