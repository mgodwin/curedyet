  text: Sabin completed enrollment in all Phase 2 trials of cAd3-Marburg; over 2,800 people have received
    its filovirus vaccines without significant safety concerns.
  url: https://www.sabin.org/resources/sabin-vaccine-institute-completes-enrollment-in-all-phase-2-clinical-trials-for-cad3-marburg-vaccine-and-cad3-sudan-ebolavirus-vaccine/
- date: 2025-12
  text: US shipped up to 2,500 cAd3-Marburg doses and 25 MBP091 courses to Ethiopia's first Marburg outbreak,
    which ended in Jan 2026.
  url: https://www.aspr.gov/news-updates/newsroom/2025-12/hhs-provides-doses-investigational-vaccine
