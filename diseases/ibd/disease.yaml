  url: https://sofinnovapartners.com/news/abivax-announces-landmark-phase-3-abtect-maintenance-trial-results-evaluating-obefazimod-in-moderately-to-severely-active-ulcerative-colitis
- date: 2026-06
  text: Tulisokibart met primary and key secondary endpoints in the ATLAS-UC induction study.
