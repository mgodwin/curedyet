# Cure Watch disease record. Field guide: CONTRIBUTING.md. Sources live in research.md.
id: ibd
name: Crohn's & ulcerative colitis
category: immune
tracking: active
summary: Inflammatory bowel diseases where the immune system inflames the gut, causing pain, diarrhea,
  bleeding and complications.
toll:
  text: About 6.8M people had IBD worldwide in 2017 (GBD 2017).
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7026709/
status:
  level: 2
  why: Biologics and small molecules keep many patients in long remission, but most need lifelong treatment
    and Crohn's has no cure.
  today: Anti-TNF, anti-integrin, IL-12/23 and IL-23 antibodies, and JAK or S1P drugs put many patients
    in remission. Typical one-year remission rates on any single drug are still often under half. Removing
    the colon cures ulcerative colitis but not Crohn's.
  groups:
  - name: Ulcerative colitis
    what: The immune system inflames the inner lining of the large bowel (colon and rectum), causing bloody
      diarrhea and urgency.
    level: 3
    burden: moderate
    survival: ~10% have the colon removed within 10 years of diagnosis
    note: Most patients are managed with lifelong anti-inflammatory pills, biologic injections or infusions,
      or JAK pills, which control it but do not cure it. Removing the colon and rectum ends the disease,
      but it is major surgery that leaves a pouch or stoma, so it is mainly used when medicines fail.
    caveat: 'Judgment call: surgery is a real cure, but it is heavy and most patients would not choose it
      while medicines work, so per METHODOLOGY it stays at level 3 (cured for some) rather than 4. The typical
      patient lives on ongoing medication, which is level 2 territory; burden reflects that medication,
      not surgery. The 10-year figure (9.6%) is from cohorts diagnosed after 2000.'
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8934200
    forecast:
      median: 2051
      low: 2037
      high: 2090
      p2035: 6
      p2045: 21
      note: Needs a drug or procedure that ends the disease without removing the colon, such as a lasting
        immune reset or a fix for the gut microbiome-immune loop. Obefazimod and TL1A antibodies like tulisokibart
        should raise remission rates, but they are ongoing treatments, not cures.
  - name: Crohn's disease
    what: The immune system inflames any part of the gut, often deep into the bowel wall, causing pain,
      diarrhea, narrowing and abnormal channels (fistulas).
    level: 2
    burden: moderate
    survival: ~26% need major bowel surgery within 10 years of diagnosis
    note: Lifelong biologics or other immune-calming drugs put many patients into long remission, with regular
      scopes and blood tests and some infection risk. Surgery removes damaged bowel but does not cure Crohn's,
      which often returns near the join.
    caveat: Level 2 assumes near-normal life on treatment, but a sizable minority keep flaring or develop
      bowel damage despite treatment, so for them it behaves more like level 1. The surgery figure (26.2%)
      is from cohorts diagnosed after 2000; about 1 in 4 to 1 in 3 who have surgery need another within
      10 years.
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8934200
    forecast:
      median: 2056
      low: 2040
      high: 2095
      p2035: 4
      p2045: 16
      note: Needs a lasting immune reset or microbiome fix that stops inflammation anywhere in the gut for
        good; surgery does not cure Crohn's. Nearest candidates are TL1A antibodies such as duvakitug, which
        improve control but must be continued.
  last_reviewed: '2026-11-03'
treatment:
  best:
  - Anti-TNF (infliximab, adalimumab)
  - IL-23 inhibitors (risankizumab, guselkumab)
  - Vedolizumab
  - JAK inhibitors (upadacitinib)
  - Colectomy (UC)
  burden: moderate
  burden_note: Lifelong biologic infusions or injections or JAK pills raising infection risk, with regular
    colonoscopy and blood monitoring and high drug costs; many still need steroids or surgery.
forecast:
  bottleneck: biology-limited
  normal:
    p2035: 3
    p2045: 13
    median: 2057
    low: 2040
    high: 2095
  faster:
    p2035: 6
    p2045: 28
    median: 2047
    low: 2036
    high: 2080
  faster_note: A cure needs understanding of the microbiome-immune loop or a lasting immune reset, neither
    with a clinical signal yet; acceleration helps biology first, so most of the lift comes after 2035.
  outlook: New drug classes like TL1A antibodies and obefazimod will push remission rates higher and may
    allow combination therapy. A cure needs a lasting immune reset or fixing the microbiome-immune link,
    which has no strong clinical signal yet. Expect better control, not cure, through the 2030s.
pipeline:
- name: Obefazimod (Abivax), oral miR-124 enhancer
  note: 'ABTECT maintenance: about 51% remission vs 10% placebo at week 44; NDA planned by end of 2026.'
  stage: Phase 3
  url: https://sofinnovapartners.com/news/abivax-announces-landmark-phase-3-abtect-maintenance-trial-results-evaluating-obefazimod-in-moderately-to-severely-active-ulcerative-colitis
- name: Tulisokibart (Merck), anti-TL1A
  note: First anti-TL1A to meet a Phase 3 UC endpoint (ATLAS-UC, June 2026).
  stage: Phase 3
  url: https://www.hcplive.com/view/tulisokibart-phase-3-endpoints-ulcerative-colitis-anti-tl1a
- name: Duvakitug (Sanofi/Teva), anti-TL1A
  note: Phase 2b maintenance showed durable remission in UC and Crohn's.
  stage: Phase 3
  url: https://www.patientcareonline.com/view/duvakitug-phase-2b-maintenance-data-show-durable-remission-in-uc-and-crohn-disease
recent:
- date: 2026-06
