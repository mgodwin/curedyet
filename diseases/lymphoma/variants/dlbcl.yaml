# Cure Watch variant record: one stage or type of Lymphomas. Field guide: CONTRIBUTING.md.
id: dlbcl
name: DLBCL
order: 2
what: Diffuse large B-cell lymphoma, the most common fast-growing non-Hodgkin lymphoma.
level: 3
burden: heavy
burden_why: Four to five months of chemo-immunotherapy, with hair loss, infections and nerve damage.
survival: ~65% alive at 5 years (SEER 5-year relative survival, 2016-2022); ~80% stage I vs ~56% stage
  IV
share: About 1 in 3 lymphomas are DLBCL
share_url: https://www.cancer.org/cancer/types/non-hodgkin-lymphoma/about/b-cell-lymphoma.html
treatment: Standard care is about six cycles of chemo-immunotherapy (R-CHOP or Pola-R-CHP) over four to
  five months, causing hair loss, infections and nerve damage; older patients can get reduced doses. Most
  are cured, and CAR-T or bispecific antibodies can still cure some after relapse.
caveat: Share is from ACS B-cell lymphoma page (https://www.cancer.org/cancer/types/non-hodgkin-lymphoma/about/b-cell-lymphoma.html).
  First-line treatment cures roughly 60-70% (5-year survival about 65%), well below 85%, though CAR-T
  and bispecifics rescue some after relapse.
url: https://seer.cancer.gov/statfacts/html/dlbcl.html
forecast:
  median: 2038
  low: 2030
  high: 2060
  p2035: 35
  p2045: 65
  note: 'First-line chemo-immunotherapy cures about 60-70%. Adding bispecific antibodies is the nearest
    step: epcoritamab plus R-CHOP cut progression by about half in the EPCORE DLBCL-2 trial (Oct 2026),
    and glofitamab''s SKYGLO trial is pending; level 4 needs approval and long-term data showing 85% cured,
    including older patients.'
easy:
  median: 2058
  low: 2040
  high: 2100
  p2035: 3
  p2045: 18
  note: A cure without months of chemotherapy, such as bispecific antibody or simpler cell-therapy regimens
    that replace it, would be needed; that is not yet in late-stage trials for most patients.
