  url: https://www.clinicaltrialsarena.com/news/summit-debuts-longer-term-ivonescimab-data-as-it-awaits-fda-nsclc-decision/
  what: FDA decision on ivonescimab plus chemotherapy in EGFR-mutated NSCLC after TKI.
ai:
  impact: some
  note: AI reading of low-dose CT scans for nodule risk is spreading in screening programs, while AI-designed
    drugs for lung cancer are still early.
