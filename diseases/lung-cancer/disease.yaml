  text: Zongertinib became an approved oral option for HER2-mutant lung cancer.
  url: https://www.mdlinx.com/article/the-biggest-fda-decision-drops-in-2026-so-far-oncology-approvals/4WRnWWH8XhXAO0mgWJJvfm
- date: 2026-09
  text: Updated HARMONi data at WCLC 2026 showed a survival hazard ratio of 0.76 in Western patients on
    ivonescimab plus chemo.
  url: https://secure.businesswire.com/news/home/20260915307340/en/Updated-HARMONi-Data-Presented-at-WCLC-2026-Demonstrate-Consistent-Overall-Survival-Results-with-Ivonescimab-Plus-Chemotherapy-in-Western-and-Asian-Patients
- date: 2026-01
  text: ACS reported lung cancer 5-year survival rose from 15% to 28%, and distant-stage survival from
    2% to 10%.
  url: https://pressroom.cancer.org/cancer-statistics-report-2026
