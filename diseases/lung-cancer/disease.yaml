# Cure Watch disease record. Field guide: CONTRIBUTING.md. Sources live in research.md.
id: lung-cancer
name: Lung cancer
category: cancer
tracking: active
summary: Cancer of the lungs, mostly non-small cell (NSCLC) with a smaller share of aggressive small cell
  lung cancer.
toll:
  text: About 2.6M new cases and 1.9M deaths/yr worldwide (2024); ~229,410 US cases and ~124,990 US deaths
    est. 2026.
  url: https://pressroom.cancer.org/global-cancer-statistics-2026
status:
  level: 3
  why: Early-stage and some oncogene-driven or immunotherapy-responsive patients are cured or in long
    remission, but most are diagnosed late and 5-year survival is about 28%.
  today: Stage I-II NSCLC is often cured with surgery or radiation, and perioperative immunotherapy raises
    cure rates in stage II-III. Metastatic disease is treated with targeted drugs (EGFR, ALK, ROS1, HER2
    and others) or immunotherapy, which give years of control for some but rarely cure. Small cell lung
    cancer remains highly lethal.
  groups:
  - name: Stage I
    what: A small non-small cell tumor confined to the lung, with no spread to lymph nodes.
    level: 4
    burden: heavy
    survival: ~65% alive at 5 years (net survival, all lung cancer types, England 2016-2020)
    note: Surgery to remove part of the lung cures most people; those who cannot have surgery get a short
      course of targeted radiation (SBRT), which is much easier. Some EGFR-positive patients add years of
      targeted pills.
    caveat: The figure covers all lung cancer by stage, not NSCLC alone, though NSCLC is most cases; US
      SEER gives 67% 5-year relative survival for localized NSCLC (ACS). Many patients are older with other
      lung or heart disease, which lowers overall survival.
    url: https://www.cancerresearchuk.org/about-cancer/lung-cancer/survival
  - name: Stage II
    what: A larger non-small cell tumor, or one that has spread to lymph nodes inside the lung, but still
      within one side of the chest.
    level: 3
    burden: heavy
    survival: ~40% alive at 5 years (net survival, all lung cancer types, England 2016-2020)
    note: Lung surgery plus chemotherapy, now often combined with immunotherapy before and after surgery
      or targeted pills afterward. It cures a substantial share, but many relapse.
    caveat: Covers all lung cancer types; these England figures largely predate routine perioperative immunotherapy,
      so current outcomes are likely somewhat better.
    url: https://www.cancerresearchuk.org/about-cancer/lung-cancer/survival
    forecast:
      median: 2036
      low: 2029
      high: 2055
      p2035: 45
      p2045: 75
      note: Trials of immunotherapy before and after surgery, and targeted pills after surgery for EGFR
        or ALK tumors, already keep over half of patients alive long term. This needs those regimens to
        reach most patients in routine care, including older and frailer ones, with long-term data confirming
        cures.
  - name: Stage III
    what: The non-small cell cancer has spread to lymph nodes in the middle of the chest or has grown into
      nearby structures, but not to distant organs.
    level: 3
    burden: heavy
    survival: ~15% alive at 5 years (net survival, all lung cancer types, England 2016-2020)
    note: Usually chemoradiation followed by a year of immunotherapy (durvalumab), or surgery with chemo-immunotherapy
      for some. It cures a meaningful minority at a heavy toll.
    caveat: Covers all lung cancer types including small cell, and many England patients did not get full-intensity
      treatment; trial patients on chemoradiation plus durvalumab do substantially better.
    url: https://www.cancerresearchuk.org/about-cancer/lung-cancer/survival
    forecast:
      median: 2050
      low: 2036
      high: 2090
      p2035: 7
      p2045: 32
      note: About 4 in 10 are alive at 5 years after chemoradiation and durvalumab in trials, so most would
        need to be cured by better consolidation or perioperative regimens. Candidates are antibody-drug
        conjugates and bispecific antibodies moved into these regimens, with Phase 3 trials running but
        no cure-level results yet.
  - name: Stage IV
    what: The non-small cell cancer has spread to the other lung, the lining around the lung or heart, or
      distant organs.
    level: 1
    burden: heavy
    survival: ~5% alive at 5 years (net survival, all lung cancer types, England 2016-2020)
    note: Ongoing immunotherapy, chemotherapy or targeted pills (for EGFR, ALK and other mutations) extend
      life, sometimes by years, but rarely cure. A small group on immunotherapy has very long remissions.
    caveat: Covers all lung cancer types; US SEER gives 12% 5-year relative survival for distant NSCLC (ACS,
      diagnosed 2015-2021).
    url: https://www.cancerresearchuk.org/about-cancer/lung-cancer/survival
    forecast:
      median: 2066
      low: 2043
      high: 2100
      p2035: 2
      p2045: 12
      note: Most patients with spread lung cancer would need treatments that clear the disease for good,
        while today only a small group on immunotherapy has very long remissions. The nearest candidates
        are next-generation targeted drugs, antibody-drug conjugates and bispecifics, which so far extend
        life rather than cure.
  - name: Small cell
    what: A fast-growing type of lung cancer, strongly linked to smoking, that has usually spread by the
      time it is found.
    level: 1
    burden: heavy
    survival: ~9% alive at 5 years (5-year relative survival, all SEER stages, US diagnosed 2012-2018; 34%
      localized, 4% distant)
    note: Limited-stage disease gets chemoradiation, now followed by immunotherapy, and some are cured.
      Most have extensive-stage disease, where chemotherapy plus immunotherapy shrinks it at first but it
      nearly always returns within months.
    caveat: SEER data for 2012-2018 predate immunotherapy as standard care for small cell lung cancer.
    url: https://www.cancer.org/cancer/types/lung-cancer/detection-diagnosis-staging/survival-rates.html
    forecast:
      median: 2072
      low: 2046
      high: 2100
      p2035: 1
      p2045: 7
      note: Most patients have extensive-stage disease that nearly always returns within months, so this
        needs a treatment that prevents relapse after first response. Tarlatamab and DLL3- or B7-H3-targeted
        drugs are the nearest candidates, and they have extended survival but not shown cures.
  last_reviewed: '2026-11-03'
treatment:
  best:
  - Surgery or stereotactic radiation for early disease
  - Perioperative immunotherapy with chemotherapy
  - Osimertinib and other targeted TKIs
  - Pembrolizumab-based immunotherapy
  - Antibody-drug conjugates
  burden: heavy
  burden_note: Most patients are diagnosed late and get chemo-immunotherapy or ongoing targeted drugs
    with fatigue, rash and immune side effects; early cases need lung surgery or radiation.
forecast:
  bottleneck: design-limited
  normal:
    p2035: 5
    p2045: 23
    median: 2053
    low: 2039
    high: 2094
  faster:
    p2035: 15
    p2045: 48
    median: 2045
    low: 2036
    high: 2074
  faster_note: Faster design and trials of ADCs, bispecifics and targeted drugs for metastatic disease
    plus wider AI-read CT screening could cure far more patients, but most are still found late, so the
    2035 lift is moderate and the big gain lands by 2045.
  outlook: Survival is rising fast, but most patients are still found at stage III-IV where cure is uncommon.
    Reaching cured-for-most likely needs both wide CT screening uptake and durable cures in metastatic
    disease, which is a decade-plus project. Smoking decline helps incidence but not the cure rate. Stage IV is close to half of patients, so cured for most needs stage III to become curable as well, which sets this forecast.
pipeline:
- name: Ivonescimab (PD-1/VEGF bispecific)
  note: BLA in EGFR-mutated NSCLC after TKI based on HARMONi; PDUFA Nov 14, 2026.
  stage: Filed
  url: https://www.clinicaltrialsarena.com/news/summit-debuts-longer-term-ivonescimab-data-as-it-awaits-fda-nsclc-decision/
- name: Zidesamtinib (Jideytro)
  note: ROS1 inhibitor approved July 2026 for previously treated ROS1-positive NSCLC.
  stage: Approved 2025-26
  url: https://www.bioworld.com/articles/732912-gsks-newly-acquired-jideytro-wins-fda-nod-in-nsclc
- name: Zongertinib
  note: Accelerated approval Feb 2026 for HER2-mutant nonsquamous NSCLC.
  stage: Approved 2025-26
  url: https://www.mdlinx.com/article/the-biggest-fda-decision-drops-in-2026-so-far-oncology-approvals/4WRnWWH8XhXAO0mgWJJvfm
- name: Sacituzumab tirumotecan (sac-TMT)
  note: TROP2 ADC with overall survival gains in pretreated EGFR-mutant NSCLC in OptiTROP-Lung trials.
  stage: Phase 3
  url: https://egfrchannel.onclive.com/sac-tmt-extends-os-in-pretreated-egfr-mutated-nsclc
