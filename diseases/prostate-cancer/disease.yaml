# Cure Watch disease record. Field guide: CONTRIBUTING.md. Sources live in research.md.
id: prostate-cancer
name: Prostate cancer
category: cancer
tracking: active
summary: Cancer of the prostate gland, often slow-growing and driven by androgen signaling.
toll:
  text: About 1.5M new cases and 420,000 deaths/yr worldwide (2024); ~333,830 US cases and ~36,320 US
    deaths est. 2026.
  url: https://pressroom.cancer.org/global-cancer-statistics-2026
status:
  level: 4
  why: Most cases are found while localized and are cured or safely monitored, with US 5-year survival
    near 98%, though metastatic disease is not curable.
  today: Localized disease is cured with surgery or radiation, or watched with active surveillance when
    low risk. Metastatic disease is controlled for years with hormone therapy, androgen receptor inhibitors,
    PARP inhibitors, PSMA radioligands and now an AKT inhibitor, but it eventually becomes resistant.
    Black men and those diagnosed late fare worse.
  groups:
  - name: Stage I
    what: A small, slow-growing, lowest-grade cancer still inside the prostate, with a PSA under 10.
    level: 4
    burden: moderate
    survival: Almost 100% survive at least 5 years (5-year net survival, England, diagnosed 2013-2017)
    note: 'Most men are offered active surveillance: regular PSA tests, MRI scans and repeat biopsies, with
      surgery or radiation only if it grows. Very few die of it; men who choose treatment face the side
      effects listed for stage II.'
    caveat: Rated moderate for surveillance (ongoing monitoring and biopsies); immediate surgery or radiation
      would be heavy. Share by TNM stage not verified; SEER reports 69% of US cases as localized, which
      spans stages I-III.
    url: https://www.cancerresearchuk.org/about-cancer/prostate-cancer/survival
  - name: Stage II
    what: Cancer still inside the prostate, but with a higher PSA (10 to 20) or a more aggressive grade.
    level: 4
    burden: heavy
    survival: Almost 100% survive at least 5 years (5-year net survival, England, diagnosed 2013-2017)
    note: Surgery to remove the prostate or several weeks of radiation, often with a few months of hormone
      therapy; erectile problems and some urinary leakage or bowel problems are common and can be lasting.
      Some favorable cases can still be watched. Most are cured.
    url: https://www.cancerresearchuk.org/about-cancer/prostate-cancer/survival
  - name: Stage III
    what: Cancer that has grown through the outer edge of the prostate or into nearby tissue, or has a very
      high PSA (20+) or the most aggressive grade, but has not spread to lymph nodes or bones.
    level: 4
    burden: heavy
    survival: Around 95% survive at least 5 years (5-year net survival, England, diagnosed 2013-2017)
    note: Radiation plus 1.5 to 3 years of hormone therapy (hot flashes, fatigue, weight gain, bone and
      muscle loss, low libido), or surgery often followed by radiation. Most are cured, but PSA comes back
      in a sizable minority.
    caveat: Prostate cancer grows slowly, so 5-year survival overstates cure for high-risk disease; long-term
      cure is lower than 95%, though still a majority.
    url: https://www.cancerresearchuk.org/about-cancer/prostate-cancer/survival
  - name: Stage IV
    what: Cancer that has spread to nearby lymph nodes (IVA) or to bones or other distant organs (IVB).
    level: 2
    burden: heavy
    survival: Around 50% survive at least 5 years (5-year net survival, England, diagnosed 2013-2017); ~40%
      for distant spread in the US (SEER, 2016-2022)
    share: ~9% of new US cases have distant spread (SEER)
    note: Lifelong hormone therapy plus an androgen receptor drug, sometimes chemotherapy, PARP inhibitors
      or PSMA radioligand therapy; side effects build up over years. Distant spread is controlled for years
      but not cured; node-only (IVA) disease is often treated with radiation and hormone therapy aiming
      to cure.
    caveat: The England stage 4 figure includes node-only disease, which does better; the SEER 40% figure
      (seer.cancer.gov/statfacts/html/prost.html) covers distant spread only. Node-only IVA disease is closer
      to level 3.
    url: https://www.cancerresearchuk.org/about-cancer/prostate-cancer/survival
    forecast:
      median: 2065
      low: 2042
      high: 2100
      p2035: 1
      p2045: 10
      note: Men whose cancer has spread to bones or organs would need treatment that eradicates it rather
        than controlling it for years, and no current drug does that. The nearest candidates are PSMA radioligands
        and newer androgen receptor drugs moved into earlier, more intensive combinations, mainly helping
        node-only and low-volume disease first.
  last_reviewed: '2026-11-03'
treatment:
  best:
  - Radical prostatectomy or radiation
  - Active surveillance for low-risk disease
  - Androgen deprivation plus enzalutamide, apalutamide or darolutamide
  - Lutetium-177 PSMA radioligand (Pluvicto)
  - PARP inhibitors for HRR-mutated disease
  burden: heavy
  burden_note: Prostatectomy or radiation for localized disease often causes erectile dysfunction and
    some incontinence or bowel problems; low-risk men can avoid treatment through active surveillance.
  cure_tolerable: true
forecast:
  bottleneck: access-limited
  reached: 1995
  faster_note: Already cured for most; acceleration would mostly help late-diagnosed and underserved men
    get early detection and move radioligands earlier, a small change at the population level.
  outlook: Prostate cancer already meets the cured-for-most bar thanks to PSA-driven early detection and
    effective local treatment. Progress now centers on stretching control of metastatic disease by moving
    radioligands and targeted drugs earlier. A true cure for metastatic disease still looks far off.
pipeline:
- name: Talazoparib plus enzalutamide in mCSPC
  note: TALAPRO-3 cut progression risk 52% in HRR-mutated disease; priority review with Q4 2026 action
    date.
  stage: Filed
  url: https://www.rttnews.com/3669562/pfizer-secures-fda-priority-review-for-talzenna-plus-xtandi-in-metastatic-prostate-cancer.aspx
- name: Lutetium-177 PSMA (Pluvicto) in hormone-sensitive disease
  note: Approved July 31, 2026 with an AR pathway inhibitor for PSMA-positive mHSPC.
  stage: Approved 2025-26
  url: https://nuclear.pharmacy.purdue.edu/news-and-updates/fda-approves-lutetium-lu-177-vipivotide-tetraxetan-androgen-receptor-pathway
- name: Capivasertib (Truqap) plus abiraterone
  note: First AKT inhibitor for PTEN-deficient mHSPC, approved June 12, 2026 (CAPItello-281).
  stage: Approved 2025-26
  url: https://www.aacr.org/patients-caregivers/progress-against-cancer/first-akt-inhibitor-approved-for-prostate-cancer/
recent:
- date: 2026-06
  text: Capivasertib became the first AKT inhibitor approved in prostate cancer, extending median rPFS
    to 33.2 months vs 25.7.
  url: https://www.aacr.org/patients-caregivers/progress-against-cancer/first-akt-inhibitor-approved-for-prostate-cancer/
- date: 2026-07
  text: Pluvicto radioligand therapy moved into the hormone-sensitive metastatic setting.
  url: https://nuclear.pharmacy.purdue.edu/news-and-updates/fda-approves-lutetium-lu-177-vipivotide-tetraxetan-androgen-receptor-pathway
next_milestone:
  date: 2026-12
  url: https://www.rttnews.com/3669562/pfizer-secures-fda-priority-review-for-talzenna-plus-xtandi-in-metastatic-prostate-cancer.aspx
  what: FDA action on talazoparib plus enzalutamide for HRR-mutated metastatic castration-sensitive prostate
