  url: https://www.rttnews.com/3669562/pfizer-secures-fda-priority-review-for-talzenna-plus-xtandi-in-metastatic-prostate-cancer.aspx
  what: FDA action on talazoparib plus enzalutamide for HRR-mutated metastatic castration-sensitive prostate
