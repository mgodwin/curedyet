# Cure Watch variant record: one stage or type of Prostate cancer. Field guide: CONTRIBUTING.md.
id: stage-iv
name: Stage IV
order: 4
what: Cancer that has spread to nearby lymph nodes (IVA) or to bones or other distant organs (IVB).
level: 2
burden: heavy
survival: Around 50% survive at least 5 years (5-year net survival, England, diagnosed 2013-2017); ~40%
  for distant spread in the US (SEER, 2016-2022)
share: ~9% of new US cases have distant spread (SEER)
treatment: Lifelong hormone therapy plus an androgen receptor drug, sometimes chemotherapy, PARP inhibitors
  or PSMA radioligand therapy; side effects build up over years. Distant spread is controlled for years
  but not cured; node-only (IVA) disease is often treated with radiation and hormone therapy aiming to
  cure.
caveat: The England stage 4 figure includes node-only disease, which does better; the SEER 40% figure
  (seer.cancer.gov/statfacts/html/prost.html) covers distant spread only. Node-only IVA disease is closer
  to level 3.
url: https://www.cancerresearchuk.org/about-cancer/prostate-cancer/survival
forecast:
  median: 2065
  low: 2042
  high: 2100
  p2035: 1
  p2045: 10
  note: Men whose cancer has spread to bones or organs would need treatment that eradicates it rather
    than controlling it for years, and no current drug does that. The nearest candidates are PSMA radioligands
    and newer androgen receptor drugs moved into earlier, more intensive combinations, mainly helping
    node-only and low-volume disease first.
