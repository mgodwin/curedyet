  url: https://africa.com/featuresopinion/first-participant-vaccinated-in-pivotal-phase-2-3-bundibugyo-ebola-vaccine-trial-in-drc
- date: 2026-07
  text: The PARTNERS randomized trial began testing MBP134 and remdesivir in Bundibugyo patients within
    two months of the outbreak's PHEIC declaration.
  url: https://www.itg.be/en/health-stories/press-releases/partners-trial
- date: 2026-06
  text: CEPI funded three Bundibugyo vaccine candidates from Moderna, Oxford and IAVI.
  url: https://en.wikipedia.org/wiki/2026_Central_Africa_Ebola_epidemic
