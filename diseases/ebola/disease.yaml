# Cure Watch disease record. Field guide: CONTRIBUTING.md. Sources live in research.md.
id: ebola
name: Ebola
category: outbreaks
tracking: active
summary: A severe, often fatal viral hemorrhagic fever caused by several ebolavirus species, spread by
  contact with body fluids.
toll:
  text: '2026 Bundibugyo outbreak: 10,274 confirmed cases and 4,992 deaths in DRC as of 28 Oct 2026 (ECDC),
    up from WHO''s 9,704 cases and 4,687 deaths as of 20 Oct; historic outbreaks kill roughly 25-90% of
    cases.'
  url: https://www.ecdc.europa.eu/en/ebola-disease-multi-country-outbreak-2026
status:
  level: 3
  why: For Zaire ebolavirus, a licensed vaccine and two FDA-approved antibody drugs save most early-treated
    patients, but Bundibugyo and Sudan virus disease still have only supportive care and kill about half
    of patients.
  today: 'Zaire ebolavirus, the cause of most past outbreaks, has a licensed vaccine (Ervebo, plus Zabdeno/Mvabea)
    and approved antibody treatments (Inmazeb and Ebanga), which raise survival most when given early.
    Bundibugyo virus, which drives the 2026 DRC epidemic, and Sudan virus have no approved vaccine or
    treatment, so care is fluids, symptom management and isolation; about 49% of confirmed DRC cases in
    2026 have died. Post-exposure prevention is being tested: oral obeldesivir for contacts and ring vaccination
    in the TUMAINI trial.'
  groups:
  - name: Zaire ebolavirus
    what: The Ebola virus species behind most past outbreaks, including West Africa 2014-16, which causes
      severe fever, bleeding and organ failure.
    level: 4
    burden: heavy
    survival: ~66% alive at 28 days with REGN-EB3 (Inmazeb) vs ~49% on the older comparator, in the DRC
      PALM trial
    note: Patients get a single infusion of an approved antibody (Inmazeb or Ebanga) plus intensive supportive
      care in isolation; survival is much higher when treated early, and survivors clear the infection.
      A licensed vaccine (Ervebo) is used in ring vaccination of contacts and health workers.
    caveat: 'Judgment call between 3 and 4: the trial was in outbreak conditions in DRC; in that trial patients
      with low viral load at admission did much better (about 19% died across all arms vs 76% with high
      viral load). In rich-country hospitals 22 of 27 patients (81%) survived in 2014-15 even before these
      antibodies (Uyeki et al., NEJM 2016). Some survivors have lasting post-Ebola symptoms and the virus
      can persist in the eye or semen.'
    url: https://scienceportal.msf.org/assets/randomized-controlled-trial-ebola-virus-disease-therapeutics
  - name: Sudan virus
    what: A different Ebola virus species, found mainly in Uganda and South Sudan, that causes the same
      kind of severe illness.
    level: 1
    burden: heavy
    survival: Past outbreaks killed 41-70% of cases (WHO); ~39% of confirmed cases in Uganda 2022
    note: There is no approved treatment, so care is intensive supportive care in isolation (fluids, oxygen,
      managing organ failure), which improves survival but does not target the virus. There is no licensed
      vaccine; candidate vaccines, remdesivir and an antibody have been tested in outbreak trials in Uganda.
    caveat: Level 1 reflects that supportive care helps but nothing specific exists; outbreaks are small,
      so fatality figures are noisy. Zaire-specific antibodies do not work against Sudan virus.
    url: https://www.who.int/emergencies/disease-outbreak-news/item/2025-DON558
    forecast:
      median: 2044
      low: 2030
      high: 2080
      p2035: 28
      p2045: 52
      note: A treatment that raises survival to Zaire-like levels would be needed; the pan-species antibody
        MBP134 and remdesivir could cover Sudan virus if they work against Bundibugyo, but Sudan outbreaks
        are small, so proof may rely on animal data and future outbreak trials.
  - name: Bundibugyo virus
    what: A rarer Ebola virus species, driving the large 2026 epidemic in the Democratic Republic of the
      Congo.
    level: 1
    burden: heavy
    survival: ~49% of confirmed cases in the 2026 DRC epidemic have died (ECDC counts); past outbreaks ~30%
      and ~50% (WHO)
    note: No vaccine or specific treatment is approved, so care is isolation with fluids and symptom support.
      The MBP134 antibody and remdesivir are in a randomized trial (PARTNERS), and candidate vaccines are
      being tested by ring vaccination (TUMAINI).
    caveat: The 49% figure is a crude deaths-to-confirmed-cases ratio from ECDC (5,126 deaths, 10,532 confirmed
      cases as of 2 Nov 2026, https://www.ecdc.europa.eu/en/ebola-disease-multi-country-outbreak-2026),
      not a stated case fatality rate; it reflects outbreak-zone care, not rich-country care.
    url: https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON607
    forecast:
      median: 2040
      low: 2029
      high: 2075
      p2035: 36
      p2045: 60
      note: The PARTNERS trial of MBP134 and remdesivir, enrolling since July 2026 in the large DRC epidemic,
        would need to show a clear survival benefit, likely in 2027, followed by approval; if it fails,
        the next candidates are years behind.
  last_reviewed: '2026-11-03'
treatment:
  best:
  - Ebanga (ansuvimab), Zaire only
  - Inmazeb (REGN-EB3), Zaire only
  - Ervebo vaccine, Zaire only
  - Early intensive supportive care
  burden: heavy
  burden_note: Single antibody infusion for Zaire virus, but patients need isolated intensive care with
    IV fluids in outbreak zones where access is poor; non-Zaire strains have supportive care only.
forecast:
  bottleneck: trial-limited
  normal:
    p2035: 30
    p2045: 55
    median: 2042
    low: 2030
    high: 2075
  faster:
    p2035: 45
    p2045: 72
    median: 2036
    low: 2029
    high: 2060
  faster_note: Pan-ebolavirus antibodies and antivirals are already in randomized trials during the 2026
    Bundibugyo epidemic, so faster trials and approval plus outbreak-zone delivery would lift odds a lot
    even by 2035.
  outlook: Zaire Ebola is already close to curable when treated early, so the gap is the other species.
    The huge 2026 Bundibugyo epidemic is generating randomized trial data fast; if the pan-species MBP134
    or remdesivir shows a clear survival benefit in 2027, approvals covering all major ebolaviruses could
    follow within a few years. Uneven access to care in outbreak zones keeps real-world survival below
    rich-country levels.
pipeline:
- name: TUMAINI ring-vaccination platform trial (Ervebo first; Moderna and Oxford/Serum Institute Bundibugyo
    vaccines to join)
  note: Phase 2/3 adaptive trial in high-risk contacts; first participant vaccinated in Bunia on 23 Oct
    2026.
  stage: Phase 3
  url: https://africa.com/featuresopinion/first-participant-vaccinated-in-pivotal-phase-2-3-bundibugyo-ebola-vaccine-trial-in-drc
- name: MBP134 (Mapp pan-ebolavirus antibody cocktail)
  note: Tested alone and with remdesivir versus standard care in the PARTNERS randomized trial in Bunia;
    28-day mortality endpoint, 700-1,000 patients planned.
  stage: Phase 2
  url: https://www.itg.be/en/health-stories/press-releases/partners-trial
- name: Remdesivir (Gilead)
  note: Repurposed antiviral in the PARTNERS trial arms for Bundibugyo patients, started 2 Jul 2026.
  stage: Phase 2
  url: https://www.itg.be/en/health-stories/press-releases/partners-trial
- name: Obeldesivir (oral, Gilead) post-exposure prophylaxis
  note: Twice-daily pill for close contacts to prevent infection; trial slated to start in July 2026.
  stage: Phase 2
  url: https://www.wunc.org/2026-07-07/theres-no-treatment-designed-for-the-ebola-strain-ravaging-drc-but-now-theres-hope
- name: Sabin cAd3-Sudan ebolavirus vaccine
  note: Enrollment complete in all Phase 2 trials as of March 2026; Phase 3 in planning.
  stage: Phase 2
  url: https://www.sabin.org/resources/sabin-vaccine-institute-completes-enrollment-in-all-phase-2-clinical-trials-for-cad3-marburg-vaccine-and-cad3-sudan-ebolavirus-vaccine/
