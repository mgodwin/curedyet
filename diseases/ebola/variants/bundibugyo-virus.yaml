# Cure Watch variant record: one stage or type of Ebola. Field guide: CONTRIBUTING.md.
id: bundibugyo-virus
name: Bundibugyo virus
order: 3
what: A rarer Ebola virus species, driving the large 2026 epidemic in the Democratic Republic of the Congo.
level: 1
burden: heavy
burden_why: There is no specific drug or vaccine, so care is isolation and intensive supportive care for
  a life-threatening illness.
survival: ~49% of confirmed cases in the 2026 DRC epidemic have died (ECDC counts); past outbreaks ~30%
  and ~50% (WHO)
treatment: No vaccine or specific treatment is approved, so care is isolation with fluids and symptom
  support. The MBP134 antibody and remdesivir are in a randomized trial (PARTNERS), and candidate vaccines
  are being tested by ring vaccination (TUMAINI).
caveat: The 49% figure is a crude deaths-to-confirmed-cases ratio from ECDC (5,126 deaths, 10,532 confirmed
  cases as of 2 Nov 2026, https://www.ecdc.europa.eu/en/ebola-disease-multi-country-outbreak-2026), not
  a stated case fatality rate; it reflects outbreak-zone care, not rich-country care.
url: https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON607
forecast:
  median: 2040
  low: 2029
  high: 2075
  p2035: 36
  p2045: 60
  note: The PARTNERS trial of MBP134 and remdesivir, enrolling since July 2026 in the large DRC epidemic,
    would need to show a clear survival benefit, likely in 2027, followed by approval; if it fails, the
    next candidates are years behind.
prevention:
  level: 0
  burden: heavy
  why: No vaccine is licensed for Bundibugyo virus; Ervebo is being tested for cross-protection in the
    TUMAINI ring trial that began in DRC in October 2026, and Bundibugyo-specific vaccines are only in
    Phase 1.
  burden_why: During the 2026 DRC epidemic, vaccines are available only to high-risk contacts enrolled
    in trial rings, and Ervebo needs ultra-cold storage.
  best:
  - Infection control and contact tracing
  - Ervebo in the TUMAINI ring trial (unproven for Bundibugyo)
  url: https://clinicaltrials.gov/study/NCT07842107
  forecast:
    median: 2034
    low: 2028
    high: 2075
    p2035: 52
    p2045: 68
    note: 'The huge 2026 DRC epidemic makes an efficacy trial feasible: TUMAINI (Phase 2/3, from 23 Oct
      2026) is testing Ervebo first and plans to add Bundibugyo-specific vaccines. Oxford/Serum Institute''s
      ChAdOx1 BDBV (Phase 1 UK and Uganda, about 620,000 doses stockpiled) and Moderna''s mRNA-1469 (Phase
      1 Canada) are the specific candidates. Ervebo cross-protection is likely partial at best, and the
      specific vaccines must clear Phase 1-2; base rate: about 30% of vaccines entering Phase 2/3 reach
      licensure, but a large outbreak shortens the path (Ervebo went from ring trial to licensure in about
      4 years).'
  easy:
    median: 2048
    low: 2034
    high: 2100
    p2035: 12
    p2045: 40
    note: 'Even if a ring vaccine works, it would be outbreak-only with cold-chain needs, which is heavy
      burden. Mild burden needs routine preventive use in at-risk areas of DRC and Uganda. Base rate:
      Zaire vaccine still is not routine for the general public 7 years after licensure.'
