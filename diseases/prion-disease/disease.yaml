# Cure Watch disease record. Field guide: CONTRIBUTING.md. Sources live in research.md.
id: prion-disease
name: Prion disease (CJD)
category: outbreaks
tracking: active
summary: Rare brain diseases caused by misfolded prion protein. Most cases are sporadic Creutzfeldt-Jakob
  disease (CJD); others are inherited, or acquired, as with variant CJD from BSE ("mad cow disease"), which
  affected about 230 people worldwide, mostly in the UK, before feed bans and food controls all but ended
  it.
toll:
  text: About 1-2 cases per million people per year worldwide (roughly 85% sporadic, 5-15% genetic, under
    1% acquired); median survival 4-5 months after symptoms (CDC).
  url: https://www.cdc.gov/creutzfeldt-jakob/hcp/clinical-overview/
  ratio: "1 to 2 in a million"
  ratio_caption: "people a year develop Creutzfeldt-Jakob disease"
  ratio_url: https://www.cdc.gov/creutzfeldt-jakob/hcp/clinical-overview/
  ratio_basis: "CDC CJD clinical overview: estimated annual incidence in many countries of about 1 to 2 cases per 1 million people."
status:
  level: 0
  why: CDC says CJD is always fatal and no therapy slows it; care is supportive only.
  today: For all forms of CJD, sporadic, genetic and acquired (iatrogenic or variant), care focuses on
    comfort. Acquired cases are prevented by instrument sterilization, blood and tissue safeguards and
    BSE controls. The main hope is lowering prion protein (PrP) with antisense or siRNA drugs, which
    extended survival in mice and is now in early human trials in people with symptoms; the PRiSM siRNA
    trial also enrols healthy carriers of PRNP gene changes.
  last_reviewed: '2026-11-09'
treatment:
  best:
  - Supportive and palliative care
  - Infection control to prevent acquired CJD
  burden: moderate
  burden_note: Comfort care only, with drugs for jerking, agitation and seizures, as rapid decline leads
    to full-time nursing or hospice care within months.
forecast:
  bottleneck: trial-limited
  normal:
    p2035: 2
    p2045: 10
    median: 2062
    low: 2042
    high: 2100
  faster:
    p2035: 5
    p2045: 25
    median: 2050
    low: 2038
    high: 2100
  faster_note: PrP-lowering drugs are in human trials, so biomarker-based approval and faster trials would
    help most; the lift stays modest because sporadic CJD is diagnosed late after rapid brain damage.
  outlook: PrP lowering is a strong idea and may prevent genetic prion disease in carriers within 10-15
    years. Curing patients who already have symptoms is much harder because sporadic CJD damages the
    brain very quickly, within months, and is usually diagnosed late. Expect slowing or prevention for a
    subset well before a cure for most.
pipeline:
- name: PrP-lowering divalent siRNA 2439-s4 (Broad Institute / UMass)
  note: PRiSM single-dose trial (NCT07444580) of about 45 adults with symptoms or healthy carriers of
    PRNP gene changes started May 2026; primary completion is estimated for August 2029.
  stage: Phase 1
  url: https://clinicaltrials.gov/study/NCT07444580
  variants:
  - sporadic
  - genetic
  - acquired
  expected: 2029-08
  effect: some
  effect_note: Safe, lasting PrP lowering would open the way to prevention trials in carriers and larger
    trials in people with symptoms, though it would not itself show benefit.
- name: ION717 antisense oligonucleotide (Ionis)
  note: PrProfile Phase 1/2a reopened March 2026 with an open-label Regimen 3 and closed to recruitment
    by August 2026 with 85 enrolled; primary completion estimated April 2027.
  stage: Phase 2
  url: https://clinicaltrials.gov/study/NCT06153966
  variants:
  - sporadic
  - genetic
  - acquired
  expected: 2027-04
  effect: some
  effect_note: Clear prion protein lowering with a hint of slower decline would support a larger efficacy
    trial; no benefit would push forecasts later.
- name: CHARM compact epigenetic editor (AAV, Broad)
  note: One-time AAV-delivered editor silenced PRNP across the mouse brain.
  stage: Preclinical
  url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC11875203/
  variants:
  - sporadic
  - genetic
  - acquired
- name: Primary prevention in PRNP mutation carriers
  note: Natural history study of presymptomatic carriers underway to support biomarker-based prevention
    trials.
  stage: Preclinical
  url: https://www.bioxconomy.com/modalities/oligo-based-therapies-lead-charge-against-prion-disease
  variants:
  - genetic
recent:
- date: 2026-08
  text: Ionis said the ION717 PrProfile trial was no longer recruiting; the registry lists 85 enrolled.
  url: https://clinicaltrials.gov/study/NCT06153966
- date: 2026-04
  text: First-in-human divalent siRNA trial for prion disease opened enrollment after FDA IND clearance.
  url: https://www.cureffi.org/2026/04/22/divalent-sirna-clinical-trial-is-now-recruiting/
- date: 2026-03
  text: Ionis reopened the ION717 PrProfile trial with a third dosing regimen; early safety described
    as encouraging.
  url: https://www.cureffi.org/2026/03/17/ion717-trial-reopens/
next_milestone:
  date: 2027-02
  url: https://www.cureffi.org/2026/03/17/ion717-trial-reopens/
  what: Expected last patient visit in Ionis ION717 PrProfile trial; top-line data possibly later in 2027.
ai:
  impact: low
  note: The leading drugs are rationally designed oligonucleotides, not AI-discovered; AI plays at most
    a minor role in sequence optimization.
