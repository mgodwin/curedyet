# Cure Watch variant record: one stage or type of Prion disease (CJD). Field guide: CONTRIBUTING.md.
id: acquired
name: Acquired prion disease
order: 3
what: Prion disease caught from outside the body, including variant CJD from eating beef from cattle with
  BSE ("mad cow disease"), iatrogenic CJD from medical treatments such as cadaver-derived growth hormone,
  brain-covering (dura mater) grafts or surgical instruments, and kuru, once spread by funeral rites in
  Papua New Guinea.
level: 0
burden: moderate
burden_why: Care is comfort-focused, with drugs for distressing symptoms and growing nursing needs over
  about a year.
survival: Variant CJD averages 13-14 months from first symptoms (CDC)
share: Under 1% of CJD today. About 230 people worldwide have had variant CJD, 178 of them in the UK
  (UK surveillance, July 2022), and about 470 iatrogenic cases were recorded up to 2012.
share_url: https://cjd.ed.ac.uk/sites/default/files/2025-01/Current%20data%20on%20variant%20CJD%20cases%20worldwide.pdf
treatment: There is no treatment that slows it, so care focuses on comfort. New cases are now very rare,
  so few people with acquired forms can join drug trials.
caveat: Variant CJD affected much younger people (average age 28, CDC) and lasted longer than sporadic
  CJD. Some infections may still be silent, since incubation can exceed 10 years, and decades for kuru
  and growth-hormone cases.
url: https://www.cdc.gov/variant-creutzfeldt-jakob/about/index.html
forecast:
  median: 2062
  low: 2043
  high: 2100
  p2035: 2
  p2045: 10
  note: A cure would come from the same PrP-lowering drugs being tested in sporadic and genetic prion disease,
    since prion protein is needed for any form to spread in the brain; ION717 and the PRiSM siRNA are
    still in Phase 1-2 safety testing.
easy:
  median: 2075
  low: 2050
  high: 2100
  p2035: 0
  p2045: 4
  note: The leading drugs need repeated spinal injections; a mild cure would need a one-time treatment,
    which is still only in mice.
prevention:
  level: 4
  burden: light
  why: Feed bans and removing high-risk cattle tissue from food made BSE rare, so variant CJD has almost
    vanished, while synthetic growth hormone, safer grafts and instrument cleaning closed off nearly all
    medical spread.
  burden_why: These are public-health controls on food, blood and surgery that need nothing from the individual,
    and CDC says no specific personal precautions are needed now.
  best:
  - Animal feed bans and removing high-risk cattle tissue from food (BSE controls)
  - Synthetic (recombinant) growth hormone and safer graft material
  - Instrument decontamination and blood donor safeguards
  url: https://www.cdc.gov/variant-creutzfeldt-jakob/about/index.html
  reached:
    year: 2005
    basis: 'Approximate: most variant CJD cases came in the late 1990s and early 2000s (CDC), falling
      to very few after BSE controls, and by then the main medical sources had been closed off.'
    url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3358170/
  reached_easy:
    year: 2005
    basis: 'Approximate: the controls are applied to the food chain and medical supply, so protection needed
      no action from individuals from the start.'
    url: https://www.cdc.gov/variant-creutzfeldt-jakob/about/index.html
