# Cure Watch disease record. Field guide: CONTRIBUTING.md. Sources live in research.md.
id: polio
name: Polio
category: infectious
tracking: active
summary: A viral infection that can cause paralysis, now prevented by vaccines.
toll:
  text: 52 wild polio cases worldwide in 2025 and 29 so far in 2026, all in Afghanistan and Pakistan (WHO,
    Nov 2026).
  url: https://www.who.int/news/item/13-11-2026-statement-of-the-forty-sixth-meeting-of-the-polio-ihr-emergency-committee
status:
  level: 1
  why: Polio has no cure and can only be prevented, but vaccines work well and two of the three wild types
    are eradicated.
  today: WHO says several vaccine doses can protect a child for life. Wild type 2 was declared eradicated
    in 2015 and type 3 in 2019; wild type 1 still circulates only in Afghanistan and Pakistan.
  last_reviewed: '2026-11-22'
treatment:
  best:
  - Inactivated polio vaccine (IPV)
  - Oral polio vaccine (OPV)
  burden_note: There is no treatment that cures polio; protection comes from vaccination.
forecast:
  bottleneck: access-limited
  normal:
    p2035: 25
    p2045: 55
    median: 2042
    low: 2030
    high: 2085
  faster:
    p2035: 30
    p2045: 60
    median: 2040
    low: 2029
    high: 2080
  faster_note: "Faster progress depends on reaching children in the last strongholds, not on new science."
  outlook: "Polio has no cure, so the path is eradication with vaccines, which would end it for everyone. Wild type 1 caused 52 cases in 2025 and 29 so far in 2026, all in Afghanistan and Pakistan. Vaccine-derived outbreaks also have to stop before the world can be certified polio-free. These odds are for eradication."
