# Cure Watch variant record: one stage or type of Fatty liver disease (MASLD/MASH). Field guide: CONTRIBUTING.md.
id: mash
name: MASH with scarring (before cirrhosis)
order: 2
what: Fatty liver with inflammation and liver-cell damage (metabolic dysfunction-associated steatohepatitis),
  often with some scarring (fibrosis stages F1 to F3) but not cirrhosis.
level: 2
burden: moderate
burden_why: Weekly injections or a daily pill taken indefinitely, with nausea and other GI effects and
  high out-of-pocket cost.
survival: ~63% vs 34% on placebo had MASH resolve at 72 weeks on semaglutide (ESSENCE); 26-30% vs 10%
  at 52 weeks on resmetirom (MAESTRO-NASH)
share: NIDDK estimates 1.5-6.5% of US adults have MASH
share_url: https://www.niddk.nih.gov/health-information/liver-disease/nafld-nash/definition-facts
treatment: Weight loss is the foundation, and people with moderate to advanced scarring (F2-F3) can take
  semaglutide (Wegovy) or resmetirom (Rezdiffra), both with accelerated approval. They clear inflammation
  in a quarter to two-thirds of patients and improve scarring in about a quarter to a third, but they
  are taken indefinitely and are not yet proven to prevent cirrhosis or death.
caveat: People who lose at least 10% of their weight see MASH resolve in about 90% of cases (Vilar-Gomez
  2015), and bariatric surgery resolved it in 84% of those biopsied at 5 years (Lassailly 2020), but most
  people cannot reach or keep that weight loss and surgery suits only some. Both drug approvals rest on
  biopsy results, with outcome trials still running. Early scarring (F1) has no approved drug.
url: https://www.ajmc.com/view/fda-approves-semaglutide-for-mash-with-fibrosis
forecast:
  median: 2050
  low: 2036
  high: 2092
  p2035: 6
  p2045: 26
  note: Needs a finite treatment that clears inflammation and scarring for most patients and keeps it
    clear afterwards. FGF21 drugs (efruxifermin, pegozafermin) and stronger incretin drugs could raise
    response rates, but all are ongoing treatments, so a cure still depends on lasting weight loss.
