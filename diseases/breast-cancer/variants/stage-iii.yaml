# Cure Watch variant record: one stage or type of Breast cancer. Field guide: CONTRIBUTING.md.
id: stage-iii
name: Stage III
order: 4
what: 'Locally advanced cancer: a large tumor, spread to many nearby lymph nodes, or growth into the skin
  or chest wall, but not to distant organs.'
level: 3
burden: heavy
burden_why: It takes chemotherapy or targeted drugs, surgery, radiation and years of hormone or HER2 therapy,
  and relapse is still common.
survival: Around 75% survive at least 5 years (5-year net survival, England, diagnosed 2018-2022)
share: Part of the roughly 1 in 4 US breast cancers diagnosed after spreading to nearby lymph nodes or
  tissue (SEER 'regional', 27%)
share_url: https://seer.cancer.gov/statfacts/html/breast.html
treatment: Chemotherapy or targeted drugs often given before surgery, then surgery, radiation and years
  of endocrine or HER2 therapy. Many are cured, but relapse is common, especially in stage IIIC.
caveat: 'SEER regional stage also includes some stage II cases. Rated 3: around 75% survive 5 years but
  only about 55% survived breast cancer at 10 years in registry data, well below 85%.'
url: https://www.cancerresearchuk.org/about-cancer/breast-cancer/survival
forecast:
  median: 2052
  low: 2038
  high: 2095
  p2035: 6
  p2045: 30
  note: About 55% survived breast cancer at 10 years for women diagnosed in 2002, and even with newer
    drugs a large jump is needed to cure 85%. Better drugs before surgery, antibody-drug conjugates such
    as T-DXd moving earlier, and blood tests that catch leftover cancer are the nearest candidates.
easy:
  median: 2075
  low: 2048
  high: 2100
  p2035: 1
  p2045: 5
  note: Stage III needs chemotherapy or targeted drugs, surgery, radiation and years of further drugs;
    a mild cure for most is far off.
