# Cure Watch disease record. Field guide: CONTRIBUTING.md. Sources live in research.md.
id: breast-cancer
name: Breast cancer
category: cancer
tracking: active
summary: Cancer that starts in breast tissue, split into HR-positive, HER2-positive and triple-negative
  subtypes.
toll:
  text: About 2.4M new cases and 694,000 deaths/yr worldwide (2024); ~324,580 US cases and ~42,670 US
    deaths est. 2026.
  url: https://www.cancer.org/content/dam/cancer-org/research/cancer-facts-and-statistics/annual-cancer-facts-and-figures/2026/2026-cancer-facts-and-figures.pdf
status:
  level: 4
  why: Most patients are diagnosed at an early stage and are cured with surgery, radiation and systemic
    therapy, though metastatic disease remains incurable.
  today: Early-stage disease is usually cured with surgery plus endocrine therapy, HER2 drugs or chemo-immunotherapy
    depending on subtype. Metastatic breast cancer is treated as a chronic disease with CDK4/6 inhibitors,
    oral SERDs and antibody-drug conjugates, but it is rarely cured. Triple-negative and late-relapsing
    HR-positive disease drive most deaths.
  groups:
  - name: Stage 0
    what: Abnormal cells (DCIS) inside the milk ducts that have not grown into surrounding breast tissue.
    level: 4
    burden: moderate
    survival: Nearly all cured (ACS); no stage-specific 5-year figure on the source page
    share: ~1 in 5 new breast cancers (ACS)
    note: Lumpectomy usually followed by a few weeks of radiation, or mastectomy, sometimes with 5 years
      of tamoxifen or an aromatase inhibitor for hormone-positive DCIS. It is cured in nearly all women,
      though many may be treated for cells that would never have spread.
    caveat: No numeric survival figure verified; burden rated moderate because breast-conserving surgery
      plus radiation is less intensive than invasive-cancer treatment, but mastectomy or years of endocrine
      pills would push it toward heavy.
    url: https://www.cancer.org/cancer/types/breast-cancer/about/types-of-breast-cancer/dcis.html
  - name: Stage I
    what: A small invasive tumor (up to 2 cm) with no spread to lymph nodes, or only tiny clusters of cells
      in them.
    level: 4
    burden: heavy
    survival: Almost 100% survive at least 5 years (5-year net survival, England, diagnosed 2018-2022)
    share: Most of the ~64% of US cases found while still localized (SEER, invasive only)
    note: Surgery, usually with radiation; most tumors are hormone-positive and need 5-10 years of endocrine
      pills with joint pain, hot flashes or bone loss, and HER2-positive or triple-negative tumors often
      add chemotherapy. Most are cured.
    caveat: SEER reports share by localized/regional/distant, not by TNM stage; localized also includes
      some stage II tumors.
    url: https://www.cancerresearchuk.org/about-cancer/breast-cancer/survival
  - name: Stage II
    what: A tumor 2 to 5 cm, or a smaller tumor that has spread to a few (1 to 3) nearby armpit lymph nodes,
      or a larger tumor with no node spread.
    level: 4
    burden: heavy
    survival: About 90% survive at least 5 years (5-year net survival, England, diagnosed 2018-2022)
    note: Surgery and usually radiation, with chemotherapy common, HER2 drugs for HER2-positive disease,
      and years of endocrine therapy for hormone-positive disease. Most are cured, but late relapses can
      occur for hormone-positive tumors.
    url: https://www.cancerresearchuk.org/about-cancer/breast-cancer/survival
  - name: Stage III
    what: 'Locally advanced cancer: a large tumor, spread to many nearby lymph nodes, or growth into the
      skin or chest wall, but not to distant organs.'
    level: 4
    burden: heavy
    survival: Around 75% survive at least 5 years (5-year net survival, England, diagnosed 2018-2022)
    share: Part of the ~27% of US cases with regional spread (SEER)
    note: Chemotherapy or targeted drugs often given before surgery, then surgery, radiation and years of
      endocrine or HER2 therapy. Many are cured, but relapse is common, especially in stage IIIC.
    caveat: 'Borderline between level 3 and 4: 5-year survival overstates cure because hormone-positive
      disease can relapse after 5 years. SEER regional stage also includes some stage II cases.'
    url: https://www.cancerresearchuk.org/about-cancer/breast-cancer/survival
  - name: Stage IV
    what: Cancer that has spread beyond the breast and nearby nodes to distant organs such as bones, liver,
      lungs or brain.
    level: 2
    burden: heavy
    survival: ~34% alive at 5 years (5-year relative survival, SEER distant stage, 2016-2022)
    share: ~6% of new US cases (SEER distant), plus earlier cancers that later return
    note: 'Ongoing treatment for life: endocrine pills with CDK4/6 inhibitors, HER2 drugs, antibody-drug
      conjugates or chemotherapy, given in sequence as each stops working. Many live years with good quality
      of life, especially with hormone-positive or HER2-positive disease, but it is rarely cured.'
    caveat: Level 2 fits hormone-positive and HER2-positive disease best; metastatic triple-negative disease
      is closer to level 1. SEER distant counts only cancers metastatic at diagnosis.
    url: https://seer.cancer.gov/statfacts/html/breast.html
    forecast:
      median: 2062
      low: 2040
      high: 2100
      p2035: 2
      p2045: 12
      note: Most women with spread breast cancer would need treatment that clears it for good rather than
        holding it back, and today only a small HER2-positive subset stays in remission for many years.
        The nearest candidates are antibody-drug conjugates and oral SERDs used earlier, plus combinations
        aimed at lasting remission, but none has shown cure in most patients.
  last_reviewed: '2026-11-03'
treatment:
  best:
  - Surgery plus radiation
  - Endocrine therapy with CDK4/6 inhibitors
  - Trastuzumab deruxtecan (Enhertu)
  - Pembrolizumab with chemotherapy for TNBC
  - Sacituzumab govitecan (Trodelvy)
  burden: heavy
  burden_note: Most patients get surgery and often radiation, then 5-10 years of endocrine pills with
    joint pain and bone loss; many also need chemo or HER2 drugs with hair loss and fatigue.
  cure_tolerable: true
forecast:
  bottleneck: access-limited
  reached: 2000
  faster_note: Already cured for most; acceleration mainly helps by moving ADCs and oral SERDs into earlier
    settings and designing drugs that cure metastatic disease, which matters for the remaining patients
    but not the level.
  outlook: Breast cancer already meets the cured-for-most bar because most cases are found early and 5-year
    survival is around 90% in rich countries. The remaining work is metastatic disease, where new ADCs
    and oral SERDs extend life but do not cure. Moving early ADCs and SERDs into the adjuvant setting
    should keep shrinking relapse rates.
pipeline:
- name: Giredestrant (oral SERD), adjuvant
  note: lidERA trial in early ER-positive disease; FDA decision expected Nov 30, 2026.
  stage: Filed
  url: https://www.curetoday.com/view/breast-cancer-treatments-awaiting-fda-decisions-4-to-watch
- name: Giredestrant plus everolimus
  note: evERA trial in ESR1-mutated metastatic disease; decision expected Dec 18, 2026.
  stage: Filed
  url: https://www.curetoday.com/view/breast-cancer-treatments-awaiting-fda-decisions-4-to-watch
- name: Camizestrant (Etcamah)
  note: Accelerated approval Sept 2026 for switching at emerging ESR1 mutation (SERENA-6).
  stage: Approved 2025-26
  url: https://www.pharmacytimes.com/view/5-breast-cancer-advances-in-2026-and-the-questions-they-leave-unanswered
- name: Trastuzumab deruxtecan in early HER2+ disease
  note: May 2026 approval for neoadjuvant and post-neoadjuvant use; cut invasive disease risk by about
    half vs T-DM1.
  stage: Approved 2025-26
  url: https://www.pharmacytimes.com/view/5-breast-cancer-advances-in-2026-and-the-questions-they-leave-unanswered
- name: Vepdegestrant (Veppanu)
  note: PROTAC estrogen receptor degrader approved Q2 2026 for ESR1-mutated advanced disease.
  stage: Approved 2025-26
  url: https://www.aacr.org/blog/2026/07/02/fda-approvals-in-oncology-april-june-2026/
- name: Tucatinib maintenance (HER2CLIMB-05)
  note: First-line maintenance for HER2+ metastatic disease; Pfizer expects a 2026 decision.
  stage: Filed
  url: https://www.curetoday.com/view/breast-cancer-treatments-awaiting-fda-decisions-4-to-watch
recent:
- date: 2026-05
  text: FDA approved Enhertu for early HER2+ disease after DESTINY-Breast05 showed 3-year IDFS of 92.4%
    vs 83.7%.
  url: https://www.pharmacytimes.com/view/5-breast-cancer-advances-in-2026-and-the-questions-they-leave-unanswered
- date: 2026-06
  text: Sacituzumab govitecan approved first line in metastatic TNBC, alone or with pembrolizumab.
  url: https://www.pharmacytimes.com/view/5-breast-cancer-advances-in-2026-and-the-questions-they-leave-unanswered
- date: 2026-09
  text: Camizestrant got accelerated approval as the first drug used to switch therapy when an ESR1 mutation
    shows up in blood tests.
  url: https://www.pharmacytimes.com/view/5-breast-cancer-advances-in-2026-and-the-questions-they-leave-unanswered
