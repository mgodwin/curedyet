ai:
  impact: low
  note: Recent advances are conjugate vaccines and simpler drug regimens from conventional trials; AI
    has no clear role yet in meningitis drug discovery.
markets: []
prevention:
  level: 2
  burden: moderate
  why: Conjugate vaccines against Hib, pneumococcus and meningococcus protect strongly against the strains
    they cover, but for a typical person the remaining bacterial meningitis comes largely from causes
    vaccines miss, such as group B strep in newborns, Listeria and non-vaccine pneumococcal types, and
    the MenB vaccine was about 60% effective in England, so overall protection is partial.
  burden_why: Protection needs several childhood series and teen boosters, some vaccines such as MenB
    are not routine in every rich country, and coverage in the African meningitis belt depends on campaigns.
  best:
  - Hib conjugate vaccine
  - Pneumococcal conjugate vaccines (PCV15, PCV20, PCV21)
  - Meningococcal vaccines (MenACWY, MenB, MenABCWY; Men5CV in Africa)
  - Antibiotics for close contacts of meningococcal disease
  url: https://www.who.int/news-room/fact-sheets/detail/meningitis
  forecast:
    median: 2038
    low: 2030
    high: 2070
    p2035: 35
    p2045: 60
    note: 'Strong protection needs vaccines covering most remaining causes: broader pneumococcal vaccines
      (VAX-31 adult filing planned 2028, infant data 2027), a maternal group B strep vaccine (Pfizer''s
      BEATRIX Phase 3, estimated to finish 2029) and better MenB coverage. Base rate: about half of Phase
      3 vaccines are licensed, and Listeria and E. coli have no vaccine candidates near approval.'
  easy:
    median: 2045
    low: 2033
    high: 2085
    p2035: 15
    p2045: 50
    note: Mild would need these vaccines folded into fewer combination shots in routine schedules, as
      MenABCWY vaccines began doing in 2023-25, and reliable routine coverage in the meningitis belt rather
      than campaign-based protection.
