# Cure Watch disease record. Field guide: CONTRIBUTING.md. Sources live in research.md.
id: melanoma
name: Melanoma
category: cancer
tracking: active
summary: Skin cancer arising from pigment cells, deadly when it spreads but usually curable when caught
  early.
toll:
  text: ~112,000 US cases and ~8,510 US deaths est. 2026; distant-stage 5-year survival has risen to about
    35%.
  url: https://www.cancer.org/content/dam/cancer-org/research/cancer-facts-and-statistics/annual-cancer-facts-and-figures/2026/2026-cancer-facts-and-figures.pdf
status:
  level: 4
  why: Most melanomas are found early and cured by excision, and immunotherapy now gives durable remissions
    to many patients with advanced disease.
  today: Thin localized melanoma is cured by surgery in nearly all patients. For stage III-IV, PD-1 and
    CTLA-4 or LAG-3 combinations and BRAF/MEK inhibitors produce long-term survival in roughly half of
    advanced patients. Adjuvant immunotherapy lowers relapse after surgery, and a personalized mRNA vaccine
    added to pembrolizumab cut recurrence further in a phase 3 trial.
  groups:
  - name: Stage 0
    what: 'Melanoma in situ: cancer cells only in the top layer of the skin, not growing deeper.'
    level: 4
    burden: light
    survival: Essentially all cured by excision; no stage-specific survival figure verified
    note: A minor outpatient excision with a small margin under local anesthetic, then regular skin checks.
      Cures almost everyone.
    caveat: SEER and AJCC figures cover invasive melanoma only; the source shows 100% 5-year relative survival
      for localized invasive melanoma, which in situ disease would not be worse than, but no in situ figure
      was verified.
  - name: Stage I
    what: A thin melanoma (up to 2 mm, or up to 1 mm if the surface is broken) with no spread to lymph nodes.
    level: 4
    burden: light
    survival: ~98% melanoma-specific survival at 5 years, 95% at 10 years (AJCC 8th edition)
    share: Most of the ~77% of US cases found while localized (SEER, stages I-II combined)
    note: Wide excision, usually outpatient; thicker stage IB tumors often add a sentinel lymph node biopsy.
      Nearly all are cured.
    caveat: SEER share is for localized disease (stage I and II together), not stage I alone.
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5978683/
  - name: Stage II
    what: A thicker melanoma (over 1 to 4+ mm, sometimes with a broken surface) that has not spread to lymph
      nodes.
    level: 4
    burden: moderate
    survival: ~90% melanoma-specific survival at 5 years, 84% at 10 years (AJCC 8th edition; 82% at 5 years
      for stage IIC)
    note: Wide excision with sentinel lymph node biopsy; for higher-risk IIB and IIC, a year of adjuvant
      immunotherapy is offered, with a risk of lasting immune side effects such as thyroid damage. Most
      are cured.
    caveat: Burden is light-to-moderate for stage IIA (surgery only) and heavy for IIB/IIC patients who
      take adjuvant immunotherapy.
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5978683/
  - name: Stage III
    what: Melanoma that has spread to nearby lymph nodes or to skin close to the original tumor, but not
      to distant organs.
    level: 4
    burden: heavy
    survival: ~77% melanoma-specific survival at 5 years, 69% at 10 years (AJCC 8th edition; ranges from
      93% for IIIA to 32% for IIID)
    share: ~10% of new US cases (SEER regional)
    note: Surgery plus about a year of immunotherapy (increasingly started before surgery), or BRAF/MEK
      pills for BRAF-mutant disease; immune side effects can be serious or permanent. Most are cured, though
      IIID often relapses.
    caveat: AJCC survival comes from patients diagnosed from 1998, mostly before modern adjuvant immunotherapy,
      so current outcomes are likely somewhat better. Level 4 is weaker for IIIC-IIID.
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5978683/
  - name: Stage IV
    what: Melanoma that has spread to distant skin, lymph nodes or organs such as the lungs, liver or brain.
    level: 3
    burden: heavy
    survival: ~34% alive at 5 years (5-year relative survival, SEER distant stage, 2016-2022)
    share: ~5% of new US cases (SEER distant)
    note: Combination immunotherapy (nivolumab with ipilimumab or relatlimab) or BRAF/MEK pills, with TIL
      cell therapy as a later option; severe immune side effects are common with combinations. A meaningful
      share get long remissions that look like cures, but most do not.
    caveat: SEER distant figures lag current immunotherapy; in the CheckMate 067 trial roughly half of combination-treated
      patients were alive at 6.5 years (reported by Cancer Research UK), but trial patients are fitter than
      average.
    url: https://seer.cancer.gov/statfacts/html/melan.html
    forecast:
      median: 2043
      low: 2032
      high: 2080
      p2035: 15
      p2045: 52
      note: Already about 4 in 10 on combination immunotherapy in trials live 10 years, so this needs a
        first-line treatment that cures over half and that most patients can tolerate. Candidates include
        LAG-3 combinations, TIL cell therapy and personalized mRNA vaccines such as intismeran, which cut
        relapse in a 2026 Phase 3 after surgery but has not been tested as first treatment for spread disease.
  last_reviewed: '2026-11-03'
treatment:
  best:
  - Surgical excision
  - Nivolumab plus ipilimumab or relatlimab
  - Adjuvant pembrolizumab or nivolumab
  - BRAF plus MEK inhibitors
  - TIL therapy (lifileucel)
  burden: light
  burden_note: Most patients have thin melanoma cured by an outpatient excision plus skin checks; advanced
    disease needs immunotherapy with serious immune side effects and very high cost.
  cure_tolerable: true
forecast:
  bottleneck: access-limited
  reached: 2000
  faster_note: Already cured for most; acceleration would mainly help resistant advanced and rare subtypes
    such as uveal melanoma and spread personalized vaccines, a modest change overall.
  outlook: Melanoma already meets the cured-for-most bar because most cases are caught early, with US
    5-year survival above 90%. Immunotherapy has made a large share of advanced cases curable too, and
    personalized mRNA vaccines could raise adjuvant cure rates further. The remaining gap is primary-resistant
    advanced disease and rare subtypes like mucosal and uveal melanoma.
pipeline:
- name: Intismeran autogene (mRNA-4157/V940) plus pembrolizumab
  note: INTerpath-001 cut recurrence risk (HR 0.58) in resected high-risk melanoma; NEJM paper due Nov
    11, 2026.
  stage: Phase 3
  url: https://www.onclive.com/view/adjuvant-intismeran-autogene-plus-pembrolizumab-improves-rfs-and-dmfs-in-melanoma
- name: RP1 (vusolimogene, Tudriqev) plus nivolumab
  note: Oncolytic virus got accelerated approval Aug 6, 2026 after PD-1 failure, following two rejections.
  stage: Approved 2025-26
  url: https://www.thefdalawblog.com/2026/08/the-fda-adcomm-reboot-part-2-lessons-from-the-meeting-on-replimunes-rp1/
recent:
- date: 2026-10
  text: INTerpath-001 at ESMO showed a personalized mRNA vaccine plus pembrolizumab lowered recurrence
    (HR 0.58) and distant spread (HR 0.62) vs pembrolizumab alone.
  url: https://www.onclive.com/view/adjuvant-intismeran-autogene-plus-pembrolizumab-improves-rfs-and-dmfs-in-melanoma
- date: 2026-08
  text: FDA granted accelerated approval to RP1 plus nivolumab for PD-1-refractory advanced melanoma.
  url: https://www.thefdalawblog.com/2026/08/the-fda-adcomm-reboot-part-2-lessons-from-the-meeting-on-replimunes-rp1/
- date: 2026-01
  text: ACS reported distant-stage melanoma 5-year survival climbed from 16% to 35%.
  url: https://pressroom.cancer.org/cancer-statistics-report-2026
