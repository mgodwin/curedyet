# Cure Watch disease record. Field guide: CONTRIBUTING.md. Sources live in research.md.
id: testicular-cancer
name: Testicular cancer
category: cancer
tracking: active
summary: Cancer that starts in the testicles.
toll:
  text: About 9,810 new cases and 630 deaths expected in the US in 2026 (American Cancer Society).
  url: https://www.cancer.org/cancer/types/testicular-cancer/about/key-statistics.html
status:
  level: 4
  why: Surgery and cisplatin-based chemotherapy cure most men, even many whose cancer has spread; 96.5%
    of UK men diagnosed survive 10 years.
  today: Five-year survival is 99% when the cancer is confined to the testicle, 96% when it has reached
    nearby lymph nodes and 72% when it has spread further. Cisplatin combination chemotherapy, first given
    by Lawrence Einhorn in 1974, made spread testicular cancer curable.
  last_reviewed: '2026-11-22'
treatment:
  best:
  - Surgery
  - Cisplatin-based chemotherapy
  burden: moderate
  burden_note: Surgery for most; chemotherapy for spread disease is harder.
forecast:
  bottleneck: biology-limited
  reached: 1980
  faster_note: "Already curable for most. Gains would come from gentler treatment and better options for the minority that resists cisplatin."
  outlook: "Cisplatin chemotherapy, first given in 1974, made most testicular cancers curable, including many that have spread (year approximate). About 7 in 10 men with distant spread are alive at 5 years. Treatment can leave long-term side effects."
