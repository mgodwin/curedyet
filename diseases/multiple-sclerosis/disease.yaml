# Cure Watch disease record. Field guide: CONTRIBUTING.md. Sources live in research.md.
id: multiple-sclerosis
name: Multiple sclerosis
category: neuro
tracking: active
summary: An autoimmune disease in which the immune system attacks myelin in the brain and spinal cord,
  causing relapses and disability.
toll:
  text: About 3.1 million people living with MS worldwide (2024).
  url: https://en.wikipedia.org/wiki/Multiple_sclerosis
status:
  level: 2
  why: High-efficacy therapies now suppress relapses and new lesions for most relapsing patients, but
    progressive MS still advances.
  today: 'Relapsing MS is well controlled for many patients with anti-CD20 antibodies (ocrelizumab, ofatumumab),
    natalizumab and others, and many live near-normal lives. Progressive forms respond poorly, though
    ocrelizumab helps primary progressive MS modestly. BTK inhibitors are arriving: tolebrutinib was approved
    in the EU in June 2026, and fenebrutinib is under FDA priority review.'
  groups:
  - name: Relapsing MS
    what: The most common form of MS, where the immune system attacks nerves in flare-ups (relapses) that
      then partly or fully ease.
    level: 2
    burden: moderate
    share: ~85% of people at diagnosis
    note: Standard care is a high-efficacy disease-modifying drug such as anti-CD20 infusions every six
      months or monthly injections, taken indefinitely with infection risk and lab monitoring; in trials
      ocrelizumab roughly halved relapses versus an older interferon drug. Many people stay relapse-free
      and live near-normal lives, but treatment controls rather than cures it.
    caveat: Includes active secondary progressive MS (still having relapses or new lesions), which responds
      less well. Share figure is from MS Australia (https://www.msaustralia.org.au/types-of-ms/); the National
      MS Society and MSIF cite the same ~85%. Autologous stem cell transplant gives long remissions for
      some highly active cases but is not standard for most.
    url: https://www.ema.europa.eu/en/medicines/human/EPAR/ocrevus
    forecast:
      median: 2052
      low: 2037
      high: 2090
      p2035: 5
      p2045: 24
      note: A one-time immune reset that is safe enough for most patients would be needed; stem cell transplant
        works for some but is too risky for most, and CD19 CAR-T and EBV-targeted therapies are still in
        early trials.
  - name: Progressive MS
    what: Forms of MS where disability slowly worsens over time with few or no flare-ups, either from the
      start or after years of relapsing disease.
    level: 1
    burden: moderate
    share: ~10-15% of people have primary progressive MS at diagnosis; many with relapsing MS later become
      progressive
    note: Ocrelizumab is approved for primary progressive MS but only modestly slows it (about 30% vs 34%
      had lasting worsening in its main trial), and tolebrutinib was approved in the EU in 2026 for non-active
      secondary progressive MS. Treatment is ongoing with infection risk, and disability still advances
      for most.
    caveat: Covers primary progressive and non-active secondary progressive MS. The published ORATORIO paper
      reports 32.9% vs 39.3% with 12-week confirmed progression (hazard ratio 0.76); the EMA overview rounds
      differently. Share is from MS Australia (https://www.msaustralia.org.au/types-of-ms/).
    url: https://www.ema.europa.eu/en/medicines/human/EPAR/ocrevus
    forecast:
      median: 2063
      low: 2042
      high: 2100
      p2035: 2
      p2045: 11
      note: Treatments would need to stop nerve damage that is already under way and ideally repair it;
        BTK inhibitors only slow it somewhat, and remyelination or neuroprotection drugs are still early.
  last_reviewed: null
treatment:
  best:
  - Ocrelizumab (Ocrevus)
  - Ofatumumab
  - Natalizumab
  - Autologous stem cell transplant (selected patients)
  - Tolebrutinib (EU, nrSPMS)
  burden: moderate
  burden_note: Indefinite anti-CD20 infusions every six months or monthly injections raise infection risk
    and need lab monitoring; natalizumab carries PML brain infection risk, and all are very expensive.
forecast:
  bottleneck: biology-limited
  normal:
    p2035: 4
    p2045: 18
    median: 2055
    low: 2038
    high: 2095
  faster:
    p2035: 8
    p2045: 40
    median: 2046
    low: 2035
    high: 2080
  faster_note: Understanding progressive MS and testing immune-reset approaches like CAR-T or EBV vaccines
    faster would matter most; relapsing MS is already controlled, so the gain is about turning control
    into cure, mostly after 2035.
  outlook: Relapsing MS is close to fully controlled, and BTK inhibitors may finally slow progressive
    disease somewhat. A true cure would need durable immune reset (stem cell transplant, CAR-T) or prevention
    via Epstein-Barr virus vaccines, both still early. 'Cured for most' by 2035 is unlikely, but control
    will keep improving.
pipeline:
- name: Fenebrutinib (Roche/Genentech, BTK inhibitor)
  note: FDA accepted NDA with priority review Sept 29, 2026; non-inferior to Ocrevus in PPMS, halved relapses
    vs teriflunomide.
  stage: Filed
  url: https://www.gene.com/media/press-releases/15130/2026-09-29/genentechs-fenebrutinib-is-the-first-btk
- name: Tolebrutinib (Cenrifki, Sanofi)
  note: EU approved June 2026 for non-relapsing secondary progressive MS; FDA did not approve.
  stage: Approved 2025-26
  url: https://www.sanofi.com/en/media-room/press-releases
- name: CD19 CAR-T for MS
  note: Early trials aim to reset the immune system in refractory MS; no efficacy data yet.
  stage: Phase 1
  url: https://en.wikipedia.org/wiki/Multiple_sclerosis
recent:
- date: 2026-06
  text: Tolebrutinib became the first BTK inhibitor approved for MS, in the EU for non-relapsing secondary
    progressive disease.
  url: https://www.sanofi.com/en/media-room/press-releases
- date: 2026-09
  text: FDA accepted fenebrutinib for priority review in both relapsing and primary progressive MS.
  url: https://www.gene.com/media/press-releases/15130/2026-09-29/genentechs-fenebrutinib-is-the-first-btk
next_milestone:
  date: 2027-04
  url: https://www.gene.com/media/press-releases/15130/2026-09-29/genentechs-fenebrutinib-is-the-first-btk
  what: Expected FDA decision on fenebrutinib for relapsing and primary progressive MS (estimate from
    priority review timing; no date published).
ai:
  impact: low
  note: AI mainly helps with MRI lesion quantification and monitoring; leading new MS drugs were not AI-discovered.
