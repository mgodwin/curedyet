# Cure Watch disease record. Field guide: CONTRIBUTING.md. Sources live in research.md.
id: glaucoma
name: "Glaucoma"
category: other
tracking: proposed
summary: "Eye diseases that damage the optic nerve, usually linked to high eye pressure, slowly narrowing vision."
toll:
  text: "About 76 million people aged 40 to 80 in 2020 (Ophthalmology, 2014 projection)."
  url: https://pubmed.ncbi.nlm.nih.gov/24974815/
status:
  level: 1
  why: "Treatment can slow vision loss by lowering eye pressure, but lost vision can't be restored."
  today: "Eye drops, laser treatment and surgery lower eye pressure and slow damage. Nothing repairs the optic nerve. Glaucoma is the leading cause of irreversible blindness; about 3.6 million people were blind from it in 2020."
  last_reviewed: null
treatment:
  best:
  - "Pressure-lowering eye drops"
  - "Selective laser trabeculoplasty"
  - "Glaucoma surgery"
  burden: moderate
  burden_note: "Daily drops for life or a laser or surgical procedure, with regular eye checks."
forecast:
  bottleneck: biology-limited
pipeline:
- name: "Nicotinamide (NAMinG trial)"
  stage: "Phase 3"
  note: "High-dose vitamin B3 to protect the optic nerve; 378 patients enrolled by April 2026, results after 2028."
  url: https://clinicaltrials.gov/study/NCT05405868
  expected: "2029"
  effect: small
  effect_note: "A nerve-protecting pill would slow loss further but not restore sight."
