# Cure Watch variant record: one stage or type of Ovarian cancer. Field guide: CONTRIBUTING.md.
id: stage-ii
name: Stage II
order: 2
what: The cancer has spread beyond the ovaries to other organs in the pelvis, such as the womb or bladder.
level: 3
burden: heavy
burden_why: Major surgery and about six cycles of chemotherapy, with hair loss and nerve damage.
survival: More than 70% alive at 5 years (net survival, England 2016-2020)
share: Part of the roughly 1 in 5 US ovarian cancers that have spread into the pelvis or nearby nodes
  (SEER 'regional', 18%)
share_url: https://seer.cancer.gov/statfacts/html/ovary.html
treatment: Surgery followed by about six cycles of carboplatin and paclitaxel, with hair loss and nerve
  damage. Most women are alive at five years, though some relapse later.
caveat: 'Late relapses happen, so 5-year survival somewhat overstates the cure rate. Rated 3: just over
  70% survive 5 years and some relapse later, well below 85% cured.'
url: https://www.cancerresearchuk.org/about-cancer/ovarian-cancer/survival
forecast:
  median: 2048
  low: 2035
  high: 2095
  p2035: 9
  p2045: 40
  note: Over 70% survive 5 years but late relapses mean fewer are cured, so first-line treatment would
    need to keep far more women in permanent remission. PARP inhibitors for BRCA or HRD tumors and antibody-drug
    conjugates moving into first-line care are the nearest candidates.
easy:
  median: 2075
  low: 2048
  high: 2100
  p2035: 1
  p2045: 5
  note: Major surgery and six cycles of chemotherapy are the cure today; a mild cure is far off.
