# Cure Watch variant record: one stage or type of Ovarian cancer. Field guide: CONTRIBUTING.md.
id: stage-iv
name: Stage IV
order: 4
what: The cancer has spread to distant organs such as the liver, lungs or the fluid around the lungs.
level: 1
burden: heavy
burden_why: Chemotherapy and surgery, then maintenance drugs and repeated treatment as it keeps coming
  back.
survival: ~15% alive at 5 years (net survival, England 2016-2020)
share: Part of the more than half of US ovarian cancers found after spreading beyond the pelvis (SEER
  'distant', 54%)
share_url: https://seer.cancer.gov/statfacts/html/ovary.html
treatment: Chemotherapy and surgery where possible, then maintenance drugs; it usually returns and is
  treated again with more chemotherapy or newer drugs. It extends life but rarely cures.
url: https://www.cancerresearchuk.org/about-cancer/ovarian-cancer/survival
forecast:
  median: 2070
  low: 2045
  high: 2100
  p2035: 2
  p2045: 9
  note: Cure is rare today, so this would need drugs that eradicate widely spread disease, well beyond
    what current maintenance therapy does. The nearest candidates are antibody-drug conjugates such as
    those targeting folate receptor alpha, which extend life in relapsed disease but have not shown cures.
