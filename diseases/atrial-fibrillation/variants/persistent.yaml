# Cure Watch variant record: one stage or type of Atrial fibrillation. Field guide: CONTRIBUTING.md.
id: persistent
name: Persistent AF
order: 2
what: AF that lasts longer than seven days without stopping on its own, including long-standing AF lasting
  more than a year.
level: 2
burden: moderate
burden_why: Lifelong blood thinners plus rate or rhythm drugs, and ablation that often needs repeating
  because AF comes back more often.
survival: ~42% free of atrial arrhythmias 3+ years after one ablation for non-paroxysmal AF (older thermal
  ablation); 73% at 1 year with pulsed field ablation in ADVANTAGE AF
share: About 31% of people with AF in a European registry had persistent or long-standing persistent
  AF
share_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3864758
treatment: Most people take a lifelong blood thinner plus drugs to control heart rate, and some get electrical
  cardioversion, rhythm drugs or ablation to restore a normal rhythm. Ablation works less well than in
  paroxysmal AF because the atria are more stretched and scarred, so AF returns more often and repeat
  procedures are common.
caveat: Rated level 2 because ablation gives lasting freedom to a smaller share and recurrence is common,
  so for most people AF is controlled rather than ended; a case could be made for level 3. The 73% figure
  is 12-month freedom from AF, flutter and tachycardia in a 255-patient single-arm company trial, reported
  in a trade outlet. Permanent AF, where restoring rhythm is no longer attempted, is managed with rate
  control and blood thinners and is not rated separately.
url: https://www.ahajournals.org/doi/10.1161/JAHA.112.004549
forecast:
  median: 2058
  low: 2040
  high: 2100
  p2035: 3
  p2045: 18
  note: Needs ways to halt or reverse the scarring and stretching of the atria that keeps persistent AF
    going, not just better ablation tools; no such therapy is in late-stage trials.
